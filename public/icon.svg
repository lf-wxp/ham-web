      <rect x="24.000" y="14.000" width="16.000" height="4.000"/>
      <rect x="28.000" y="18.000" width="8.000" height="8.000"/>
      <rect x="8.000" y="26.000" width="12.000" height="8.000"/>
      <rect x="24.000" y="26.000" width="16.000" height="8.000"/>
      <rect x="44.000" y="26.000" width="12.000" height="8.000"/>
      <rect x="8.000" y="34.000" width="48.000" height="8.000"/>
      <rect x="8.000" y="42.000" width="12.000" height="8.000"/>
      <rect x="24.000" y="42.000" width="16.000" height="8.000"/>
      <rect x="44.000" y="42.000" width="12.000" height="8.000"/>
    </g>
  </g>
</svg>
