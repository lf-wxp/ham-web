    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5dc9"/>
      <stop offset="1" stop-color="#3b5dc9"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="8.000"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
