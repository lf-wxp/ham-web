<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>业余无线电</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07A7AA"/>
      <stop offset="0.52" stop-color="#008183"/>
      <stop offset="1" stop-color="#0E7C63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#002E33" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <g filter="url(#shadow)" fill="#FFFFFF">
    <line x1="38" y1="34" x2="38" y2="16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="14" r="2.6"/>
    <rect x="17" y="34" width="27" height="22" rx="5.5"/>
    <path d="M 43 16 A 6 6 0 0 1 43 26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 48 13 A 10 10 0 0 1 48 29" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g fill="#006568">
    <rect x="20" y="38" width="12" height="2.5" rx="1.25"/>
    <rect x="20" y="43" width="12" height="2.5" rx="1.25"/>
    <rect x="20" y="48" width="12" height="2.5" rx="1.25"/>
    <circle cx="38" cy="47" r="3.5"/>
  </g>
  <circle cx="38" cy="47" r="1.4" fill="#FFFFFF"/>
  <circle cx="21" cy="34.5" r="1.4" fill="#F0A500"/>
</svg>
