<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>业余无线电</title>
  <defs>
    <!-- 与 pwa-icon.svg 同一份设计（等比缩小到 64 空间，数值为母版的 1/8），仅供设计参考，构建不使用 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f80ea"/>
      <stop offset="0.55" stop-color="#3b5dc9"/>
      <stop offset="1" stop-color="#2d489f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.14" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14.375"/></clipPath>
    <g id="tower">
      <rect x="26" y="30" width="12" height="3"/>
      <rect x="29" y="33" width="6" height="6"/>
      <rect x="14" y="39" width="9" height="6"/>
      <rect x="26" y="39" width="12" height="6"/>
      <rect x="41" y="39" width="9" height="6"/>
      <rect x="14" y="45" width="36" height="6"/>
      <rect x="14" y="51" width="9" height="6"/>
      <rect x="26" y="51" width="12" height="6"/>
      <rect x="41" y="51" width="9" height="6"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#glass)"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M 21.3 27.03 A 11.25 11.25 0 0 1 42.7 27.03" stroke-width="2" stroke-opacity="0.6"/>
      <path d="M 14.16 24.7 A 18.75 18.75 0 0 1 49.84 24.7" stroke-width="1.625" stroke-opacity="0.44"/>
      <path d="M 7.63 22.58 A 25.6 25.6 0 0 1 56.37 22.58" stroke-width="1.25" stroke-opacity="0.32"/>
    </g>
    <rect width="64" height="64" fill="url(#sheen)"/>
    <use href="#tower" y="1.25" fill="#0e1c4d" opacity="0.42"/>
    <use href="#tower" fill="#ffffff"/>
  </g>

  <rect x="0.125" y="0.125" width="63.75" height="63.75" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="0.25"/>
</svg>
