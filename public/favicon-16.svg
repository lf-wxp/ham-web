<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>业余无线电</title>
  <defs>
    <!--
      小尺寸专用图形：与 pwa-icon.svg 同一套构图（圆角、塔 + 上方电波），但整像素双色 ——
      16px 上渐变与细弧会被插值成灰边，只有实色块才立得住；`icons.rs` 的
      favicon_16_stays_crisp 与圆角检查都盯着这点。

      ico 的 16 与 32 两档都用这一份（32 档按 2 倍整数放大，仍是整像素）。
      塔：天线针（2 宽）→ 顶板（4 宽）→ 两条塔腿逐级外张 → 两条横档 → 底座。
      底色是母版 #bg 的中段（品牌蓝），改母版时要连这版一起看。
    -->
    <clipPath id="tile"><rect width="16" height="16" rx="3"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="16" height="16" fill="#3b5dc9"/>
    <g fill="#ffffff">
      <!-- 电波（母版三道同心弧的像素化） -->
      <rect x="7" y="1" width="2" height="1"/>
      <rect x="5" y="2" width="2" height="1"/>
      <rect x="9" y="2" width="2" height="1"/>
      <rect x="3" y="3" width="2" height="1"/>
      <rect x="11" y="3" width="2" height="1"/>
      <!-- 塔 -->
      <rect x="7" y="4" width="2" height="1"/>
      <rect x="6" y="5" width="4" height="1"/>
      <rect x="5" y="6" width="2" height="2"/>
      <rect x="9" y="6" width="2" height="2"/>
      <rect x="4" y="8" width="8" height="1"/>
      <rect x="4" y="9" width="2" height="2"/>
      <rect x="10" y="9" width="2" height="2"/>
      <rect x="3" y="11" width="10" height="1"/>
      <rect x="2" y="12" width="12" height="1"/>
    </g>
  </g>
</svg>
