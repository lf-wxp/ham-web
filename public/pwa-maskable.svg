<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>业余无线电</title>
  <defs>
    <!--
      满幅版设计源：给「系统会自己加遮罩」的场景用（Android 的 maskable、iOS 的
      apple-touch-icon）。与 pwa-icon.svg 同一套构图与配色，差别只有三点：

      1. 整块 512 画布都是背景 —— 没有 clip-path、没有轮廓、没有厚度与投影，
         玻璃底色与反光铺到四角，遮罩一盖不会露出「圆角方框」的接缝；
      2. 不画轮廓边缘的上下沿高光 —— 那两条线在方形图里会被看成一个内嵌描边；
      3. 图形缩到 0.85 并绕画布中心缩放，落在 maskable 的安全圆内（半径 204.8）：
         旋钮外缘离圆心约 232 × 0.85 ≈ 197，右上角最内一道电波的下端约 217 × 0.85 ≈ 185。
         右上角的弧光毛玻璃盘本来就铺到画布边缘，缩放后仍然越出画布，不会露接缝。
    -->

    <!--
      调谐器面板：钴蓝 → 青绿的玻璃底，三道同心电波从右上角扩散，
      一根琥珀色指针横过只有刻线的频率刻度，右下角是拉丝铝旋钮。
      四层玻璃（底板 / 弧光盘 / 刻度窗 / 旋钮座）各有自己的毛玻璃填充与边缘折射线。
      改品牌色时三份源（本文件 / pwa-maskable.svg / favicon-16.svg）要一起看，
      `icons.rs` 的 art_sources_share_brand_palette 会盯着这件事。
    -->
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="40" y1="20" x2="470" y2="500">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="0.5" stop-color="#0a5c8c"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="150" cy="70" r="320">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" gradientUnits="userSpaceOnUse" cx="420" cy="470" r="300">
      <stop offset="0" stop-color="#022b2a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#022b2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="230">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 毛玻璃：白色半透明渐变；边缘折射线：受光边亮、背光边淡 -->
    <radialGradient id="frostArc" gradientUnits="userSpaceOnUse" cx="446" cy="70" r="160">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="rimArc" gradientUnits="userSpaceOnUse" x1="286" y1="70" x2="446" y2="230">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="frostPlate" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="332">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rimPlate" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="332">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="frostSeat" gradientUnits="userSpaceOnUse" cx="366" cy="394" r="76">
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.24"/>
    </radialGradient>
    <linearGradient id="rimSeat" gradientUnits="userSpaceOnUse" x1="306" y1="334" x2="426" y2="454">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="needle" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="370">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#e08a06"/>
    </linearGradient>

    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#7c8aa0"/>
    </linearGradient>
    <linearGradient id="aluRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#475569" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="aluFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="0.55" stop-color="#d3dbe6"/>
      <stop offset="1" stop-color="#aeb9c9"/>
    </linearGradient>
    <clipPath id="knobClip"><circle r="42"/></clipPath>

    <filter id="blur3" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6" x="-60%" y="-10%" width="220%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#base)"/>
  <rect width="512" height="512" fill="url(#depth)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="230" fill="url(#gloss)"/>

  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">

    <!-- 第二层玻璃：右上角的弧光毛玻璃盘，电波从这个角往左下扩散 -->
    <circle cx="446" cy="70" r="160" fill="url(#frostArc)"/>
    <circle cx="446" cy="70" r="160" fill="none" stroke="url(#rimArc)" stroke-width="2"/>
    <circle cx="446" cy="70" r="153" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

    <!-- 广播电波：三道同心细弧，圆心在右上角，没有圆心点 —— 不是 Wi-Fi 的「点 + 扇弧」 -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 434.9 133.0 A 64 64 0 0 1 383.0 81.1" stroke-width="9" stroke-opacity="0.96"/>
    <path d="M 427.9 172.4 A 104 104 0 0 1 343.6 88.1" stroke-width="7.5" stroke-opacity="0.78"/>
    <path d="M 421.0 211.8 A 144 144 0 0 1 304.2 95.0" stroke-width="6" stroke-opacity="0.58"/>
    </g>

    <!-- 第三层玻璃：频率刻度的毛玻璃窗 -->
    <rect x="52" y="236" width="408" height="96" rx="30" fill="url(#frostPlate)"/>
    <rect x="53" y="237" width="406" height="94" rx="29" fill="none" stroke="url(#rimPlate)" stroke-width="2"/>
    <rect x="55" y="327" width="402" height="2" rx="1" fill="#04162f" fill-opacity="0.18"/>

    <!-- 刻度：先画一层偏移的青色折射影，再画主刻度；只有刻线，没有数字 -->
    <g fill="none" stroke="#7dd3fc" stroke-opacity="0.28" stroke-linecap="round">
      <path d="M 77.5 264.5 V 316.5 M 137.5 264.5 V 316.5 M 197.5 264.5 V 316.5 M 257.5 264.5 V 316.5 M 317.5 264.5 V 316.5 M 377.5 264.5 V 316.5 M 437.5 264.5 V 316.5" stroke-width="4"/>
      <path d="M 89.5 286.5 V 316.5 M 101.5 286.5 V 316.5 M 113.5 286.5 V 316.5 M 125.5 286.5 V 316.5 M 149.5 286.5 V 316.5 M 161.5 286.5 V 316.5 M 173.5 286.5 V 316.5 M 185.5 286.5 V 316.5 M 209.5 286.5 V 316.5 M 221.5 286.5 V 316.5 M 233.5 286.5 V 316.5 M 245.5 286.5 V 316.5 M 269.5 286.5 V 316.5 M 281.5 286.5 V 316.5 M 293.5 286.5 V 316.5 M 305.5 286.5 V 316.5 M 329.5 286.5 V 316.5 M 341.5 286.5 V 316.5 M 353.5 286.5 V 316.5 M 365.5 286.5 V 316.5 M 389.5 286.5 V 316.5 M 401.5 286.5 V 316.5 M 413.5 286.5 V 316.5 M 425.5 286.5 V 316.5" stroke-width="3"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M 76 262 V 314 M 136 262 V 314 M 196 262 V 314 M 256 262 V 314 M 316 262 V 314 M 376 262 V 314 M 436 262 V 314" stroke-width="4" stroke-opacity="0.95"/>
      <path d="M 88 284 V 314 M 100 284 V 314 M 112 284 V 314 M 124 284 V 314 M 148 284 V 314 M 160 284 V 314 M 172 284 V 314 M 184 284 V 314 M 208 284 V 314 M 220 284 V 314 M 232 284 V 314 M 244 284 V 314 M 268 284 V 314 M 280 284 V 314 M 292 284 V 314 M 304 284 V 314 M 328 284 V 314 M 340 284 V 314 M 352 284 V 314 M 364 284 V 314 M 388 284 V 314 M 400 284 V 314 M 412 284 V 314 M 424 284 V 314" stroke-width="3" stroke-opacity="0.62"/>
    </g>

    <!-- 琥珀色调谐指针：柔光、投影、本体、左缘高光 -->
    <line x1="208.2" y1="190" x2="186.2" y2="370" stroke="#f59e0b" stroke-width="18" stroke-linecap="round" stroke-opacity="0.32" filter="url(#blur6)"/>
    <line x1="215.2" y1="199" x2="193.2" y2="379" stroke="#04162f" stroke-width="8" stroke-linecap="round" stroke-opacity="0.34" filter="url(#blur3)"/>
    <line x1="208.2" y1="190" x2="186.2" y2="370" stroke="url(#needle)" stroke-width="9" stroke-linecap="round"/>
    <line x1="206.6" y1="196" x2="184.6" y2="362" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>

    <!-- 第四层玻璃：旋钮底座的毛玻璃圆台 -->
    <circle cx="366" cy="394" r="76" fill="url(#frostSeat)"/>
    <circle cx="366" cy="394" r="75" fill="none" stroke="url(#rimSeat)" stroke-width="2"/>

    <!-- 拉丝铝旋钮 -->
    <ellipse cx="371" cy="414" rx="56" ry="48" fill="#021a3a" fill-opacity="0.5" filter="url(#blur8)"/>
    <g transform="translate(366 394)">
      <circle r="56" fill="url(#alu)"/>
      <circle r="51" fill="none" stroke="#334155" stroke-opacity="0.38" stroke-width="8" stroke-dasharray="2.67 2.67"/>
      <circle r="56" fill="none" stroke="url(#aluRim)" stroke-width="2.5"/>
      <circle r="42" fill="url(#aluFace)"/>
      <g fill="none" stroke-width="1.1">
        <circle r="6" stroke="#ffffff" stroke-opacity="0.55"/>
        <circle r="10" stroke="#64748b" stroke-opacity="0.16"/>
        <circle r="14" stroke="#ffffff" stroke-opacity="0.55"/>
        <circle r="18" stroke="#64748b" stroke-opacity="0.16"/>
        <circle r="22" stroke="#ffffff" stroke-opacity="0.55"/>
        <circle r="26" stroke="#64748b" stroke-opacity="0.16"/>
        <circle r="30" stroke="#ffffff" stroke-opacity="0.55"/>
        <circle r="34" stroke="#64748b" stroke-opacity="0.16"/>
        <circle r="38" stroke="#ffffff" stroke-opacity="0.55"/>
      </g>
      <g clip-path="url(#knobClip)" fill="#ffffff">
        <path d="M 0 0 L 7.6 -43.3 L 28.3 -33.7 Z" fill-opacity="0.32"/>
        <path d="M 0 0 L -7.6 43.3 L -28.3 33.7 Z" fill-opacity="0.26"/>
      </g>
      <circle r="42" fill="none" stroke="#475569" stroke-opacity="0.35" stroke-width="1.5"/>
      <line x1="-9.8" y1="-13.9" x2="-18.9" y2="-27.0" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
