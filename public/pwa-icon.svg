    <g clip-path="url(#inner)">
      <rect x="16.000" y="16.000" width="480.000" height="16.000" fill="#FFFFFF" opacity="0.35"/>
      <rect x="16.000" y="16.000" width="16.000" height="480.000" fill="#FFFFFF" opacity="0.35"/>
      <rect x="16.000" y="480.000" width="480.000" height="16.000" fill="#000000" opacity="0.30"/>
      <rect x="480.000" y="16.000" width="16.000" height="480.000" fill="#000000" opacity="0.30"/>
    </g>
    <g fill="#f4f4f4">
      <rect x="192.000" y="112.000" width="128.000" height="32.000"/>
      <rect x="224.000" y="144.000" width="64.000" height="64.000"/>
      <rect x="64.000" y="208.000" width="96.000" height="64.000"/>
      <rect x="192.000" y="208.000" width="128.000" height="64.000"/>
      <rect x="352.000" y="208.000" width="96.000" height="64.000"/>
      <rect x="64.000" y="272.000" width="384.000" height="64.000"/>
      <rect x="64.000" y="336.000" width="96.000" height="64.000"/>
      <rect x="192.000" y="336.000" width="128.000" height="64.000"/>
      <rect x="352.000" y="336.000" width="96.000" height="64.000"/>
    </g>
