# 业余无线电执照考试模拟 —— cargo-make 任务定义
#
#   cargo install cargo-make   # 首次安装
#   cargo make                 # 等价于 cargo make dev
#   cargo make --list-all-steps

[config]
default_to_workspace = false
skip_core_tasks = true

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
APP_DIR = "crates/app"
DIST_DIR = "${CARGO_MAKE_WORKING_DIRECTORY}/dist"
SITE_URL = { value = "https://ham.onlyxp.me", condition = { env_not_set = ["SITE_URL"] } }

# ───────────────────────────── 环境准备 ─────────────────────────────

[tasks.setup]
description = "安装 wasm32 目标、Trunk 与 wasm-bindgen CLI（版本取自 Cargo.lock；Tailwind / wasm-opt 由 Trunk 自动下载）"
script_runner = "@shell"
script = '''
set -e
WB_VERSION=$(awk -F'"' '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{print $2; exit}' Cargo.lock)
rustup target add wasm32-unknown-unknown
command -v trunk >/dev/null 2>&1 || cargo install trunk --locked
# Trunk 自带的 wasm-bindgen 不对外暴露，解码 Worker 需要 PATH 上的 CLI，且版本须与 crate 一致
command -v wasm-bindgen >/dev/null 2>&1 || cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
'''

# ───────────────────────────── 开发 ─────────────────────────────

[tasks.default]
alias = "dev"

[tasks.dev]
description = "启动前端开发服务器（热重载）：http://127.0.0.1:3000"
# 语言包必须先生成：`trunk serve` 会把 public/ 拷进产物目录，晚一步拷到的就是旧包
# （改了 data/i18n/ 却不刷新，页面上仍是旧译文，且不会有任何报错）。
dependencies = ["i18n-pack", "build-workers"]
cwd = "${APP_DIR}"
command = "trunk"
# 开发产物放在 target/ 下，避免与 release 构建共用 dist/ 互相覆盖
args = ["serve", "--dist", "../../target/dev-dist"]

[tasks.dev-full]
description = "同时启动后端 server（3001，仅 API）与前端 trunk dev（3000，代理 /api 到后端）"
dependencies = ["i18n-pack", "build-workers"]
script_runner = "@shell"
script = '''
set -e
cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
trap cleanup EXIT INT TERM
PORT=3001 SKIP_DIST_CHECK=1 cargo run -p ham-web-server &
SERVER_PID=$!
(cd crates/app && trunk serve --dist ../../target/dev-dist)
'''

# ───────────────────────────── 构建 ─────────────────────────────


[tasks.build-web]
description = "构建前端（release）并生成 Service Worker / sitemap"
dependencies = ["build-workers", "trunk-build", "postbuild"]

# 全部 worker 一个任务：清单来自 crates/*-worker（scripts/decode-workers.sh），新增 codec
# 不必再往 dev / dev-full / build-web 的依赖里各加一行
[tasks.build-workers]
description = "构建全部解码 Web Worker（codec 清单取自 crates/*-worker）"
script_runner = "@shell"
script = "sh scripts/build-decode-worker.sh"

[tasks.build-worker]
description = "构建 APT 解码 Web Worker（wasm-bindgen --target no-modules，CLI 版本须与 Cargo.lock 一致）"
script_runner = "@shell"
script = "sh scripts/build-decode-worker.sh apt"

[tasks.build-sstv-worker]
description = "构建 SSTV 解码 Web Worker（wasm-bindgen --target no-modules）"
script_runner = "@shell"
script = "sh scripts/build-decode-worker.sh sstv"

[tasks.build-wspr-worker]
description = "构建 WSPR 解码 Web Worker（wasm-bindgen --target no-modules）"
script_runner = "@shell"
script = "sh scripts/build-decode-worker.sh wspr"

[tasks.trunk-build]
private = true
# 语言包必须先生成：Trunk 会把 public/ 拷进产物目录，晚一步拷到的就是旧包
dependencies = ["i18n-pack"]
cwd = "${APP_DIR}"
command = "trunk"
args = ["build", "--release"]

[tasks.postbuild]
description = "构建后处理：sw.js、sitemap.xml、站点地址替换"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "postbuild", "--dist", "${DIST_DIR}", "--site-url", "${SITE_URL}"]

[tasks.build-server]
description = "构建静态站点服务器（release）"
command = "cargo"
args = ["build", "-p", "ham-web-server", "--release"]

[tasks.build]
description = "完整构建：图标 + 前端 + 服务器"
dependencies = ["icons", "build-web", "build-server"]

[tasks.build-full]
description = "完整构建并重新拉取题库数据（需联网或设置 DATASET_DIR）"
dependencies = ["dataset", "build"]

[tasks.serve]
description = "以 release 服务器托管 dist/：http://127.0.0.1:8080"
dependencies = ["build-web"]
command = "cargo"
args = ["run", "-p", "ham-web-server", "--release"]
env = { DIST_DIR = "${DIST_DIR}", HOST = "127.0.0.1", PORT = "8080" }

# ───────────────────────────── 数据与资源 ─────────────────────────────

[tasks.dataset]
description = "从 CSV 构建题库 JSON 与图片（DATASET_DIR 优先本地，DATASET_REMOTE 可覆盖远程地址）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dataset"]

[tasks.dxcc]
description = "从 country-files.com 下载 cty.csv，更新内置 DXCC 前缀表 crates/core/data/dxcc.txt"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dxcc"]

[tasks.dxcc-map]
description = "从 Natural Earth 国界 GeoJSON 生成 DXCC 实体边界 public/dxcc-entities.bin（i16 定点 + delta 二进制）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dxcc-map"]

[tasks.icons]
description = "由 public/ 下的设计源生成 PWA / Apple Touch / badge 图标与 favicon.ico"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "icons"]

[tasks.fonts-pixel]
description = "按仓库语料重新子集化像素字体 → public/fonts/pixel-*.woff2 + style/pixel/fonts-pixel.css（需 FONT_SRC 指向原始 TTF 目录）"
# 产物已提交入库，日常开发与 CI 不需要跑它；只有新增大量中文文案或换字体版本时才重跑。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "pixel-fonts", "--src", "${FONT_SRC}"]

[tasks.pixel-sprites]
description = "由字符画生成像素图标与精灵的数据文件（需 PIXELARTICONS_DIR 指向 pixelarticons 的 svg 目录）"
# 产物已提交入库；只有改了 crates/tools/src/pixel/sprite_art.rs 或换了图标集才需要重跑。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "pixel-sprites", "--pixelarticons", "${PIXELARTICONS_DIR}"]

[tasks.pixel-palette]
description = "校正像素调色板里的文字色阶，使其在所有表面（含每个配色方案的亮 / 暗表面）上满足 WCAG AA"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "pixel-palette"]

[tasks.pixel-schemes]
description = "由配色方案表（crates/core/src/color_scheme.rs）生成 style/pixel/schemes.css，并审计每个方案亮 / 暗的对比度"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "pixel-schemes"]

[tasks.check-ui]
description = "界面规范守卫：已失效的圆角类、原生表单控件、类名工厂残留、模糊/渐变等「应为 0」的机械条目（只读，见 docs/ui-components.md §11）"
# 与 i18n-check 同理不用 --release：只是扫源码文本。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-ui"]

[tasks.check-structure]
description = "结构与架构守卫：一文件一组件、页面手写吸顶偏移、散落 alert()、core 碰浏览器 API、crate 反向依赖、panic 宏（只读，见 docs/code-quality.md）"
# 与 i18n-check 同理不用 --release：只是扫源码文本。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-structure"]

[tasks.pixel-check]
description = "校验像素风生成物：调色板文字色阶与每个配色方案对比度达标，schemes.css 与方案表一致（只读）"
# 与 i18n-check 同理不用 --release：只是算几个对比度，debug 构建即可。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "pixel-check"]

# ───────────────────────────── APT 解码器（测试数据） ─────────────────────────────

[tasks.apt-sample]
description = "生成合成 APT 测试样本 WAV：LINES=400 NOISE=0.02 cargo make apt-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-apt --release --example generate_sample -- tmp/apt-sample.wav "${LINES:-400}" "${NOISE:-0.02}"
'''

[tasks.apt-decode]
description = "命令行解码样本并验证方向：FILE=tmp/apt-sample.wav cargo make apt-decode"
script_runner = "@shell"
script = '''
cargo run -q -p ham-web-apt --release --example decode_sample -- "${FILE:-tmp/apt-sample.wav}"
'''

[tasks.apt-test]
description = "生成并解码合成 APT 样本，端到端自检（依赖 apt-sample → apt-decode）"
dependencies = ["apt-sample", "apt-decode"]

