# ───────────────────────────── PSK31 解码器（测试数据） ─────────────────────────────

[tasks.psk31-sample]
description = "生成合成 PSK31 测试样本 WAV：OFFSET=15 NOISE=0.2 cargo make psk31-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-tools --release -- gen-psk31 \
  --output tmp/psk31-sample.wav \
  --text "${TEXT:-CQ CQ CQ DE BG4XXX BG4XXX K}" \
  --rate "${RATE:-8000}" \
  --center "${CENTER:-1000}" \
  --offset "${OFFSET:-0}" \
  --noise "${NOISE:-0.1}"
'''

# ───────────────────────────── SDR 瀑布图（测试数据） ─────────────────────────────

[tasks.spectrum-sample]
description = "生成合成频谱测试样本 WAV：TONES='700:0.8,1500:0.5' cargo make spectrum-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-tools --release -- gen-spectrum \
  --output tmp/spectrum-sample.wav \
  --rate "${RATE:-8000}" \
  --seconds "${DURATION:-2}" \
  --tones "${TONES:-700:0.8,1500:0.5,3000:0.3}" \
  --noise "${NOISE:-0.05}"
'''

[tasks.spectrum-analyze]
description = "命令行频谱分析样本并打印峰值：FILE=tmp/spectrum-sample.wav cargo make spectrum-analyze"
script_runner = "@shell"
script = '''
cargo run -q -p ham-web-tools --release -- analyze-spectrum \
  --input "${FILE:-tmp/spectrum-sample.wav}" \
  --peaks "${PEAKS:-5}"
'''

[tasks.spectrum-test]
description = "生成并分析合成频谱样本，端到端自检（依赖 spectrum-sample → spectrum-analyze）"
dependencies = ["spectrum-sample", "spectrum-analyze"]

# ───────────────────────────── 合成测试样本（汇总） ─────────────────────────────

[tasks.samples]
description = "生成全部合成测试样本 WAV 到 tmp/：apt / sstv / wspr / ft8 / lrpt / dominoex / olivia / navtex / rtty / hell / wefax / psk31 / spectrum"
# 各样本任务互为独立产物，汇总只做编排；单跑某个样本仍用对应的 <x>-sample。
dependencies = [
  "apt-sample",
  "sstv-sample",
  "wspr-sample",
  "ft8-sample",
  "lrpt-sample",
  "dominoex-sample",
  "olivia-sample",
  "navtex-sample",
  "rtty-sample",
  "hell-sample",
  "wefax-sample",
  "psk31-sample",
  "spectrum-sample",
]

# ───────────────────────────── 题目解析维护 ─────────────────────────────

[tasks.explanations-missing]
description = "统计缺失解析并导出待填模板：[BANK=A] [LIMIT=50] cargo make explanations-missing"
script_runner = "@shell"
script = '''
mkdir -p tmp
args="--output tmp/batch.json --context tmp/context.json"
if [ -n "$BANK" ]; then args="$args --bank $BANK"; fi
if [ -n "$LIMIT" ]; then args="$args --limit $LIMIT"; fi
cargo run -q -p ham-web-tools --release -- missing-explanations $args
'''

[tasks.explanations-add]
description = "按题目 ID 合并解析：BATCH=tmp/batch.json cargo make explanations-add"
script_runner = "@shell"
script = '''
if [ -z "$BATCH" ]; then
  echo "请通过环境变量指定解析文件，例如：BATCH=tmp/batch.json cargo make explanations-add" >&2
  exit 1
fi
cargo run -q -p ham-web-tools --release -- add-explanations "$BATCH"
'''

[tasks.explanations-dedupe]
description = "清理解析中重复或错位的术语括注（重复只保留首次，并删除注进更长词语内部的释义）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dedupe-explanations"]

[tasks.explanations-enhance]
description = "用 data/glossary/ 中 inject=true 的词条为解析注入术语解释"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "enhance-explanations"]

[tasks.glossary-check]
description = "校验 data/glossary/（分类、参见、重复、括号）并输出统计"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "check-glossary"]

[tasks.i18n-pack]
description = "生成运行时语言包 public/data/i18n/{lang}.json（非内嵌域译文，前端启动时按语言拉取）"
# 与 i18n-check 同理，刻意不用 --release：这只是读写 JSON，debug 构建就够；
# 而它挂在 `dev` / `dev-full` / `trunk-build` 的依赖链上，用 release 会连带编译
# 整条 release 依赖链（开发时白等几分钟）。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "i18n-pack"]

[tasks.data-sync-check]
description = "数据产物来源戳的离线一致性（产物有无戳、依赖摘要是否与现状一致；不联网）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-data-sync"]

[tasks.data-stamp]
description = "给已存在的旧产物补写来源戳（内容不动；之后由各生成任务写入真实戳）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "stamp-data"]

[tasks.data-freshness]
description = "比对数据产物与上游是否有更新（需联网；连不上只报告，退出码 0）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "check-data-freshness"]

[tasks.data-staleness]
description = "人工转录的外部事实（法规 / 器材实测 / 磁环 / 成本档位）多久没复核了（离线；超过 6 个月只告警，日期读不出来 / 在未来才失败）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-data-staleness", "--warn-only"]

[tasks.data-staleness-strict]
description = "同 data-staleness，但超过 6 个月也判失败（周检 / 人工复核用，不进 check）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-data-staleness"]

[tasks.data-sync]
description = "拉取上游并重新生成全部外部数据（dxcc + dxcc-map + dataset，需联网）"
dependencies = ["dxcc", "dxcc-map", "dataset"]

[tasks.e2e-check]
description = "e2e 覆盖对账：coverage-targets.json 的每条核心旅程必须能在 e2e/tests 的 spec 里命中"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-e2e"]

[tasks.i18n-check]
description = "校验 data/i18n/ 词典（重复 key、占位符、死条目）与运行时语言包新鲜度，并统计文案覆盖率"
# 不用 --release：这只是解析文本，debug 构建即可，省掉整条依赖链的 release 编译。
# 注意：与 `dev-full` 同时跑会争用 target/ 构建锁，见 README「常见问题」。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-i18n"]

[tasks.i18n-dynamic-calls]
description = "列出数据驱动的调用点（`t(变量)` / `tf(label, …)`：取值来自数据表，静态扫描看不到；译文覆盖已由 i18n-check 的「界面中文都有译文」守住）"
# 与 i18n-check 同理不用 --release：只是扫源码文本。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-i18n", "--dynamic-calls"]

[tasks.i18n-plural-candidates]
description = "导出复数候选骨架（tf/tp 调用且中文带数量占位符的文案）→ tmp/plural-candidates-en.json"
# 换语言：`cargo make i18n-plural-candidates -- --lang es`（CLI 参数覆盖上面的默认）
command = "cargo"
args = [
  "run",
  "-q",
  "-p",
  "ham-web-tools",
  "--",
  "check-i18n",
  "--plural-candidates",
  "tmp/plural-candidates-en.json",
  "--lang",
  "en",
]

[tasks.explanations-apply]
description = "把 data/explanations.json 写入 public/questions/*.json（离线，无需重建数据集）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "apply-explanations"]

[tasks.explanations-sync]
description = "对齐同一道题多指纹变体的解析文本（保留最详细的一条，明细写入 tmp/explanations-sync-report.json）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "sync-explanations", "--report", "tmp/explanations-sync-report.json"]

[tasks.questions-normalize]
description = "一次性迁移：把已提交题库按排版规则归一化并迁移解析表 key（明细写入 tmp/questions-normalize-report.json）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "normalize-questions", "--report", "tmp/questions-normalize-report.json"]

[tasks.knowledge-i18n-check]
description = "校验知识库正文译文：中文原文作 key，源码改过句子后译文即失效（静默回退中文）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "knowledge-i18n-check"]

[tasks.explanations-check]
description = "校验解析表：答案一致性、重复/错位注入、裸释义、同题多版本分叉（分叉只告警）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "check-explanations"]

[tasks.explanations]
description = "一键：合并 → 去重 → 术语增强 → 变体对齐 → 写入题库：BATCH=tmp/batch.json cargo make explanations"
dependencies = [
  "explanations-add",
  "explanations-dedupe",
  "explanations-enhance",
  "explanations-sync",
  "explanations-apply",
]

# ───────────────────────────── 质量 ─────────────────────────────

[tasks.fmt]
description = "格式化全部代码"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.clippy]
description = "Clippy（原生 crate + wasm 前端）"
script_runner = "@shell"
script = '''
set -e
cargo clippy --all-targets -p ham-web-core -p ham-web-nec -p ham-web-dsp -p ham-web-wav -p ham-web-tools -p ham-web-server -- -D warnings
# 先赋值再循环：直接写 for codec in $(…)，清单脚本失败时 for 会静默跑 0 次
codecs=$(sh scripts/decode-workers.sh)
for codec in $codecs; do
  # 解码实现不一定有独立 crate（afsk1200 的实现在 ham-web-core 里）：有目录才检查
  if [ -f "crates/$codec/Cargo.toml" ]; then
    cargo clippy --all-targets -p "ham-web-$codec" -- -D warnings
  fi
  cargo clippy -p "ham-web-$codec-worker" --target wasm32-unknown-unknown -- -D warnings
done
cargo clippy -p ham-web-app --target wasm32-unknown-unknown -- -D warnings
'''

[tasks.test]
description = "运行全部原生库与解码器单元、互操作测试"
script_runner = "@shell"
script = '''
set -e
cargo test -p ham-web-core -p ham-web-nec -p ham-web-dsp -p ham-web-wav -p ham-web-tools -p ham-web-server -p ham-web-app
# 各解码 crate 的 examples 同名，逐包执行避免 Cargo 输出文件互相覆盖。
codecs=$(sh scripts/decode-workers.sh)
for codec in $codecs; do
  # 同上：没有独立解码 crate 的 codec（afsk1200）跳过，它的单测在 ham-web-core 里
  if [ -f "crates/$codec/Cargo.toml" ]; then
    cargo test -p "ham-web-$codec"
  fi
done
'''

[tasks.check]
description = "代码检查：格式检查 + clippy + 单元测试 + 界面文案/知识库译文词典校验 + 解析表校验 + 界面规范守卫 + 结构守卫 + 像素风生成物校验 + 数据来源戳 / 时效性核对日期（不构建前端）"
dependencies = [
  "fmt-check",
  "clippy",
  "test",
  # 先重新生成运行时语言包（public/data/i18n/ 已不入库），再校验新鲜度
  "i18n-pack",
  "i18n-check",
  "knowledge-i18n-check",
  "explanations-check",
  "e2e-check",
  "check-ui",
  "check-structure",
  "pixel-check",
  # 离线：产物有没有来源戳、依赖摘要是否与现状一致（不联网，可放心进 CI）
  "data-sync-check",
  # 离线：人工转录的外部事实多久没复核了（到期只告警；日期本身坏了才失败）
  "data-staleness",
]

[tasks.size-check]
description = "性能预算：按 perf-budget.json 校验 dist/ 的 br 压缩后体积（需先 build-web；ci 已挂上）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "size-check", "--dist", "${DIST_DIR}"]

[tasks.e2e]
description = "端到端测试：构建 release 站点后由 Playwright 启动服务器并运行 e2e/（首次：cd e2e && npm ci && npx playwright install chromium）"
dependencies = ["build-web"]
cwd = "e2e"
command = "npx"
args = ["playwright", "test", "--workers=3"]

[tasks.e2e-coverage]
description = "统计 e2e 覆盖率（路由冒烟 / 交互 / 关键流程），报告写入 e2e/test-results/coverage.{md,json}"
cwd = "e2e"
command = "node"
args = ["scripts/coverage.mjs"]

[tasks.ci]
description = "CI：格式检查 + clippy + 测试 + 界面文案/知识库译文校验 + 解析表校验 + e2e 清单对账 + 界面规范守卫 + 结构守卫 + 像素风生成物校验 + 数据来源戳校验 + 前端构建"
# 与 `check` 保持同一套校验：漏掉 knowledge-i18n-check 时，知识库译文 key 漂移
# 会让页面上静默回退中文，而 CI 不会红；漏掉 e2e-check 时，e2e 清单与用例标题对不上
# 也要等到 CI 的覆盖率步骤才红；漏掉 data-sync-check 时，「提交前跑 ci」的本地流程
# 会放过过期的数据来源戳。
dependencies = [
  "fmt-check",
  "clippy",
  "test",
  # 先重新生成运行时语言包（public/data/i18n/ 已不入库），再校验新鲜度；
  # 缺了它，干净 checkout 上 ci 会在 i18n-check 处必红（check 任务同样列了它）。
  "i18n-pack",
  "i18n-check",
  "knowledge-i18n-check",
  "explanations-check",
  "e2e-check",
  "check-ui",
  "check-structure",
  "pixel-check",
  "data-sync-check",
  "data-staleness",
  "build-web",
  # 体积只能在 release 产物上量，所以挂在 ci（有 build-web）而不是 check 上
  "size-check",
]

# ───────────────────────────── 部署 ─────────────────────────────

[tasks.docker-build]
description = "构建 Docker 镜像：ham-web:latest"
command = "docker"
args = ["build", "--build-arg", "SITE_URL=${SITE_URL}", "-t", "ham-web:latest", "."]

[tasks.docker-run]
description = "运行 Docker 镜像：http://127.0.0.1:3000（/app/data 挂到命名卷，重启不丢推送订阅与 VAPID 密钥）"
command = "docker"
args = ["run", "--rm", "-p", "3000:3000", "-v", "ham-web-data:/app/data", "ham-web:latest"]

[tasks.clean]
description = "清理构建产物"
script_runner = "@shell"
script = '''
set -e
cargo clean
rm -rf dist tmp
'''
