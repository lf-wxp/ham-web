# 业余无线电执照考试模拟 —— cargo-make 任务定义
#
#   cargo install cargo-make   # 首次安装
#   cargo make                 # 等价于 cargo make dev
#   cargo make --list-all-steps

[config]
default_to_workspace = false
skip_core_tasks = true

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
APP_DIR = "crates/app"
DIST_DIR = "${CARGO_MAKE_WORKING_DIRECTORY}/dist"
SITE_URL = { value = "https://ham.onlyxp.me", condition = { env_not_set = ["SITE_URL"] } }

# ───────────────────────────── 环境准备 ─────────────────────────────

[tasks.setup]
description = "安装 wasm32 目标、Trunk 与 wasm-bindgen CLI（版本取自 Cargo.lock；Tailwind / wasm-opt 由 Trunk 自动下载）"
script_runner = "@shell"
script = '''
set -e
WB_VERSION=$(awk -F'"' '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{print $2; exit}' Cargo.lock)
rustup target add wasm32-unknown-unknown
command -v trunk >/dev/null 2>&1 || cargo install trunk --locked
# Trunk 自带的 wasm-bindgen 不对外暴露，APT Worker 需要 PATH 上的 CLI，且版本须与 crate 一致
command -v wasm-bindgen >/dev/null 2>&1 || cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
'''

# ───────────────────────────── 开发 ─────────────────────────────

[tasks.default]
alias = "dev"

[tasks.dev]
description = "启动前端开发服务器（热重载）：http://127.0.0.1:3000"
# 语言包必须先生成：`trunk serve` 会把 public/ 拷进产物目录，晚一步拷到的就是旧包
# （改了 data/i18n/ 却不刷新，页面上仍是旧译文，且不会有任何报错）。
dependencies = ["i18n-pack", "build-worker", "build-sstv-worker", "build-wspr-worker"]
cwd = "${APP_DIR}"
command = "trunk"
# 开发产物放在 target/ 下，避免与 release 构建共用 dist/ 互相覆盖
args = ["serve", "--dist", "../../target/dev-dist"]

[tasks.dev-full]
description = "同时启动后端 server（3001，仅 API）与前端 trunk dev（3000，代理 /api 到后端）"
dependencies = ["i18n-pack", "build-worker", "build-sstv-worker", "build-wspr-worker"]
script_runner = "@shell"
script = '''
set -e
cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
trap cleanup EXIT INT TERM
PORT=3001 SKIP_DIST_CHECK=1 cargo run -p ham-web-server &
SERVER_PID=$!
(cd crates/app && trunk serve --dist ../../target/dev-dist)
'''

# ───────────────────────────── 构建 ─────────────────────────────

[tasks.build-web]
description = "构建前端（release）并生成 Service Worker / sitemap"
dependencies = ["build-worker", "build-sstv-worker", "build-wspr-worker", "trunk-build", "postbuild"]

[tasks.build-worker]
description = "构建 APT 解码 Web Worker（wasm-bindgen --target no-modules，CLI 版本须与 Cargo.lock 一致）"
script_runner = "@shell"
script = '''
set -e
WB_VERSION=$(awk -F'"' '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{print $2; exit}' Cargo.lock)
if ! command -v wasm-bindgen >/dev/null 2>&1; then
  echo "未找到 wasm-bindgen CLI，请先执行 cargo make setup（或 cargo install wasm-bindgen-cli --version $WB_VERSION --locked）" >&2
  exit 1
fi
WB_INSTALLED=$(wasm-bindgen --version | awk '{print $2}')
if [ "$WB_INSTALLED" != "$WB_VERSION" ]; then
  echo "wasm-bindgen CLI 版本 $WB_INSTALLED 与 Cargo.lock 中的 $WB_VERSION 不一致，请执行 cargo install wasm-bindgen-cli --version $WB_VERSION --locked" >&2
  exit 1
fi
cargo build --profile wasm-release --target wasm32-unknown-unknown -p ham-web-apt-worker
mkdir -p public/apt-worker
wasm-bindgen --target no-modules --no-typescript --out-dir public/apt-worker --out-name apt_worker \
  target/wasm32-unknown-unknown/wasm-release/ham_web_apt_worker.wasm
'''

[tasks.build-sstv-worker]
description = "构建 SSTV 解码 Web Worker（wasm-bindgen --target no-modules）"
script_runner = "@shell"
script = '''
set -e
WB_VERSION=$(awk -F'"' '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{print $2; exit}' Cargo.lock)
if ! command -v wasm-bindgen >/dev/null 2>&1; then
  echo "未找到 wasm-bindgen CLI，请先执行 cargo make setup" >&2
  exit 1
fi
WB_INSTALLED=$(wasm-bindgen --version | awk '{print $2}')
if [ "$WB_INSTALLED" != "$WB_VERSION" ]; then
  echo "wasm-bindgen CLI 版本 $WB_INSTALLED 与 Cargo.lock 中的 $WB_VERSION 不一致" >&2
  exit 1
fi
cargo build --profile wasm-release --target wasm32-unknown-unknown -p ham-web-sstv-worker
mkdir -p public/sstv-worker
wasm-bindgen --target no-modules --no-typescript --out-dir public/sstv-worker --out-name sstv_worker \
  target/wasm32-unknown-unknown/wasm-release/ham_web_sstv_worker.wasm
'''

[tasks.build-wspr-worker]
description = "构建 WSPR 解码 Web Worker（wasm-bindgen --target no-modules）"
script_runner = "@shell"
script = '''
set -e
WB_VERSION=$(awk -F'"' '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{print $2; exit}' Cargo.lock)
if ! command -v wasm-bindgen >/dev/null 2>&1; then
  echo "未找到 wasm-bindgen CLI，请先执行 cargo make setup" >&2
  exit 1
fi
WB_INSTALLED=$(wasm-bindgen --version | awk '{print $2}')
if [ "$WB_INSTALLED" != "$WB_VERSION" ]; then
  echo "wasm-bindgen CLI 版本 $WB_INSTALLED 与 Cargo.lock 中的 $WB_VERSION 不一致" >&2
  exit 1
fi
cargo build --profile wasm-release --target wasm32-unknown-unknown -p ham-web-wspr-worker
mkdir -p public/wspr-worker
wasm-bindgen --target no-modules --no-typescript --out-dir public/wspr-worker --out-name wspr_worker \
  target/wasm32-unknown-unknown/wasm-release/ham_web_wspr_worker.wasm
'''

[tasks.trunk-build]
private = true
# 语言包必须先生成：Trunk 会把 public/ 拷进产物目录，晚一步拷到的就是旧包
dependencies = ["i18n-pack"]
cwd = "${APP_DIR}"
command = "trunk"
args = ["build", "--release"]

[tasks.postbuild]
description = "构建后处理：sw.js、sitemap.xml、站点地址替换"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "postbuild", "--dist", "${DIST_DIR}", "--site-url", "${SITE_URL}"]

[tasks.build-server]
description = "构建静态站点服务器（release）"
command = "cargo"
args = ["build", "-p", "ham-web-server", "--release"]

[tasks.build]
description = "完整构建：图标 + 前端 + 服务器"
dependencies = ["icons", "build-web", "build-server"]

[tasks.build-full]
description = "完整构建并重新拉取题库数据（需联网或设置 DATASET_DIR）"
dependencies = ["dataset", "build"]

[tasks.serve]
description = "以 release 服务器托管 dist/：http://127.0.0.1:8080"
dependencies = ["build-web"]
command = "cargo"
args = ["run", "-p", "ham-web-server", "--release"]
env = { DIST_DIR = "${DIST_DIR}", HOST = "127.0.0.1", PORT = "8080" }

# ───────────────────────────── 数据与资源 ─────────────────────────────

[tasks.dataset]
description = "从 CSV 构建题库 JSON 与图片（DATASET_DIR 优先本地，DATASET_REMOTE 可覆盖远程地址）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dataset"]

[tasks.dxcc]
description = "从 country-files.com 下载 cty.csv，更新内置 DXCC 前缀表 crates/core/data/dxcc.txt"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dxcc"]

[tasks.dxcc-map]
description = "从 Natural Earth 国界 GeoJSON 生成 DXCC 实体边界 public/dxcc-entities.bin（i16 定点 + delta 二进制）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dxcc-map"]

[tasks.icons]
description = "由 public/pwa-icon.svg 生成 PWA / Apple Touch 图标"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "icons"]

# ───────────────────────────── APT 解码器（测试数据） ─────────────────────────────

[tasks.apt-sample]
description = "生成合成 APT 测试样本 WAV：LINES=400 NOISE=0.02 cargo make apt-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-apt --release --example generate_sample -- tmp/apt-sample.wav "${LINES:-400}" "${NOISE:-0.02}"
'''

[tasks.apt-decode]
description = "命令行解码样本并验证方向：FILE=tmp/apt-sample.wav cargo make apt-decode"
script_runner = "@shell"
script = '''
cargo run -q -p ham-web-apt --release --example decode_sample -- "${FILE:-tmp/apt-sample.wav}"
'''

[tasks.apt-test]
description = "生成并解码合成 APT 样本，端到端自检（依赖 apt-sample → apt-decode）"
dependencies = ["apt-sample", "apt-decode"]

# ───────────────────────────── SSTV 解码器（测试数据） ─────────────────────────────

[tasks.sstv-sample]
description = "生成合成 SSTV 测试样本 WAV：VIS=44 NOISE=0.02 cargo make sstv-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-sstv --release --example generate_sample -- tmp/sstv-sample.wav "${VIS:-44}" "${NOISE:-0.02}"
'''

[tasks.sstv-decode]
description = "命令行解码 SSTV 样本并验证方向：FILE=tmp/sstv-sample.wav cargo make sstv-decode"
script_runner = "@shell"
script = '''
cargo run -q -p ham-web-sstv --release --example decode_sample -- "${FILE:-tmp/sstv-sample.wav}"
'''

[tasks.sstv-test]
description = "生成并解码合成 SSTV 样本，端到端自检（依赖 sstv-sample → sstv-decode）"
dependencies = ["sstv-sample", "sstv-decode"]

# ───────────────────────────── WSPR 解码器（测试数据） ─────────────────────────────

[tasks.wspr-sample]
description = "生成合成 WSPR 测试样本 WAV：CALL=AA0NT GRID=EM18 PWR=20 NOISE=0.02 cargo make wspr-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-wspr --release --example generate_sample -- tmp/wspr-sample.wav "${CALL:-AA0NT}" "${GRID:-EM18}" "${PWR:-20}" "${NOISE:-0.02}"
'''

[tasks.wspr-decode]
description = "命令行解码 WSPR 样本：FILE=tmp/wspr-sample.wav cargo make wspr-decode"
script_runner = "@shell"
script = '''
cargo run -q -p ham-web-wspr --release --example decode_sample -- "${FILE:-tmp/wspr-sample.wav}"
'''

[tasks.wspr-test]
description = "生成并解码合成 WSPR 样本，端到端自检（依赖 wspr-sample → wspr-decode）"
dependencies = ["wspr-sample", "wspr-decode"]

# ───────────────────────────── PSK31 解码器（测试数据） ─────────────────────────────

[tasks.psk31-sample]
description = "生成合成 PSK31 测试样本 WAV：OFFSET=15 NOISE=0.2 cargo make psk31-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-tools --release -- gen-psk31 \
  --output tmp/psk31-sample.wav \
  --text "${TEXT:-CQ CQ CQ DE BG4XXX BG4XXX K}" \
  --rate "${RATE:-8000}" \
  --center "${CENTER:-1000}" \
  --offset "${OFFSET:-0}" \
  --noise "${NOISE:-0.1}"
'''

# ───────────────────────────── SDR 瀑布图（测试数据） ─────────────────────────────

[tasks.spectrum-sample]
description = "生成合成频谱测试样本 WAV：TONES='700:0.8,1500:0.5' cargo make spectrum-sample"
script_runner = "@shell"
script = '''
mkdir -p tmp
cargo run -q -p ham-web-tools --release -- gen-spectrum \
  --output tmp/spectrum-sample.wav \
  --rate "${RATE:-8000}" \
  --seconds "${DURATION:-2}" \
  --tones "${TONES:-700:0.8,1500:0.5,3000:0.3}" \
  --noise "${NOISE:-0.05}"
'''

[tasks.spectrum-analyze]
description = "命令行频谱分析样本并打印峰值：FILE=tmp/spectrum-sample.wav cargo make spectrum-analyze"
script_runner = "@shell"
script = '''
cargo run -q -p ham-web-tools --release -- analyze-spectrum \
  --input "${FILE:-tmp/spectrum-sample.wav}" \
  --peaks "${PEAKS:-5}"
'''

[tasks.spectrum-test]
description = "生成并分析合成频谱样本，端到端自检（依赖 spectrum-sample → spectrum-analyze）"
dependencies = ["spectrum-sample", "spectrum-analyze"]

# ───────────────────────────── 题目解析维护 ─────────────────────────────

[tasks.explanations-missing]
description = "统计缺失解析并导出待填模板：[BANK=A] [LIMIT=50] cargo make explanations-missing"
script_runner = "@shell"
script = '''
mkdir -p tmp
args="--output tmp/batch.json --context tmp/context.json"
if [ -n "$BANK" ]; then args="$args --bank $BANK"; fi
if [ -n "$LIMIT" ]; then args="$args --limit $LIMIT"; fi
cargo run -q -p ham-web-tools --release -- missing-explanations $args
'''

[tasks.explanations-add]
description = "按题目 ID 合并解析：BATCH=tmp/batch.json cargo make explanations-add"
script_runner = "@shell"
script = '''
if [ -z "$BATCH" ]; then
  echo "请通过环境变量指定解析文件，例如：BATCH=tmp/batch.json cargo make explanations-add" >&2
  exit 1
fi
cargo run -q -p ham-web-tools --release -- add-explanations "$BATCH"
'''

[tasks.explanations-dedupe]
description = "清理解析中重复或错位的术语括注（重复只保留首次，并删除注进更长词语内部的释义）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "dedupe-explanations"]

[tasks.explanations-enhance]
description = "用 data/glossary/ 中 inject=true 的词条为解析注入术语解释"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "enhance-explanations"]

[tasks.glossary-check]
description = "校验 data/glossary/（分类、参见、重复、括号）并输出统计"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "check-glossary"]

[tasks.i18n-pack]
description = "生成运行时语言包 public/data/i18n/{lang}.json（非内嵌域译文，前端启动时按语言拉取）"
# 与 i18n-check 同理，刻意不用 --release：这只是读写 JSON，debug 构建就够；
# 而它挂在 `dev` / `dev-full` / `trunk-build` 的依赖链上，用 release 会连带编译
# 整条 release 依赖链（开发时白等几分钟）。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "i18n-pack"]

[tasks.i18n-check]
description = "校验 data/i18n/ 词典（重复 key、占位符、死条目）与运行时语言包新鲜度，并统计文案覆盖率"
# 不用 --release：这只是解析文本，debug 构建即可，省掉整条依赖链的 release 编译。
# 注意：与 `dev-full` 同时跑会争用 target/ 构建锁，见 README「常见问题」。
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "check-i18n"]

[tasks.i18n-plural-candidates]
description = "导出复数候选骨架（tf/tp 调用且中文带数量占位符的文案）→ tmp/plural-candidates-en.json"
# 换语言：`cargo make i18n-plural-candidates -- --lang es`（CLI 参数覆盖上面的默认）
command = "cargo"
args = [
  "run",
  "-q",
  "-p",
  "ham-web-tools",
  "--",
  "check-i18n",
  "--plural-candidates",
  "tmp/plural-candidates-en.json",
  "--lang",
  "en",
]

[tasks.explanations-apply]
description = "把 data/explanations.json 写入 public/questions/*.json（离线，无需重建数据集）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "apply-explanations"]

[tasks.explanations-sync]
description = "对齐同一道题多指纹变体的解析文本（保留最详细的一条，明细写入 tmp/explanations-sync-report.json）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "sync-explanations", "--report", "tmp/explanations-sync-report.json"]

[tasks.questions-normalize]
description = "一次性迁移：把已提交题库按排版规则归一化并迁移解析表 key（明细写入 tmp/questions-normalize-report.json）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "normalize-questions", "--report", "tmp/questions-normalize-report.json"]

[tasks.knowledge-i18n-check]
description = "校验知识库正文译文：中文原文作 key，源码改过句子后译文即失效（静默回退中文）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--", "knowledge-i18n-check"]

[tasks.explanations-check]
description = "校验解析表：答案一致性、重复/错位注入、裸释义、同题多版本分叉（分叉只告警）"
command = "cargo"
args = ["run", "-q", "-p", "ham-web-tools", "--release", "--", "check-explanations"]

[tasks.explanations]
description = "一键：合并 → 去重 → 术语增强 → 变体对齐 → 写入题库：BATCH=tmp/batch.json cargo make explanations"
dependencies = [
  "explanations-add",
  "explanations-dedupe",
  "explanations-enhance",
  "explanations-sync",
  "explanations-apply",
]

# ───────────────────────────── 质量 ─────────────────────────────

[tasks.fmt]
description = "格式化全部代码"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.clippy]
description = "Clippy（原生 crate + wasm 前端）"
script_runner = "@shell"
script = '''
cargo clippy --all-targets -p ham-web-core -p ham-web-nec -p ham-web-apt -p ham-web-tools -p ham-web-server -- -D warnings
cargo clippy -p ham-web-app --target wasm32-unknown-unknown -- -D warnings
'''

[tasks.test]
description = "运行单元测试"
command = "cargo"
args = ["test", "-p", "ham-web-core", "-p", "ham-web-nec", "-p", "ham-web-apt", "-p", "ham-web-tools", "-p", "ham-web-server", "-p", "ham-web-app"]

[tasks.check]
description = "代码检查：格式检查 + clippy + 单元测试 + 界面文案/知识库译文词典校验 + 解析表校验（不构建前端）"
dependencies = [
  "fmt-check",
  "clippy",
  "test",
  "i18n-check",
  "knowledge-i18n-check",
  "explanations-check",
]

[tasks.e2e]
description = "端到端测试：构建 release 站点后由 Playwright 启动服务器并运行 e2e/（首次：cd e2e && npm ci && npx playwright install chromium）"
dependencies = ["build-web"]
cwd = "e2e"
command = "npx"
args = ["playwright", "test"]

[tasks.e2e-coverage]
description = "统计 e2e 覆盖率（路由冒烟 / 交互 / 关键流程），报告写入 e2e/test-results/coverage.{md,json}"
cwd = "e2e"
command = "node"
args = ["scripts/coverage.mjs"]

[tasks.ci]
description = "CI：格式检查 + clippy + 测试 + 界面文案/知识库译文校验 + 解析表校验 + 前端构建"
# 与 `check` 保持同一套校验：漏掉 knowledge-i18n-check 时，知识库译文 key 漂移
# 会让页面上静默回退中文，而 CI 不会红。
dependencies = [
  "fmt-check",
  "clippy",
  "test",
  "i18n-check",
  "knowledge-i18n-check",
  "explanations-check",
  "build-web",
]

# ───────────────────────────── 部署 ─────────────────────────────

[tasks.docker-build]
description = "构建 Docker 镜像：ham-web:latest"
command = "docker"
args = ["build", "--build-arg", "SITE_URL=${SITE_URL}", "-t", "ham-web:latest", "."]

[tasks.docker-run]
description = "运行 Docker 镜像：http://127.0.0.1:3000"
command = "docker"
args = ["run", "--rm", "-p", "3000:3000", "ham-web:latest"]

[tasks.clean]
description = "清理构建产物"
script_runner = "@shell"
script = '''
cargo clean
rm -rf dist tmp
'''
