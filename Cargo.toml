[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/nec",
  "crates/app",
  "crates/server",
  "crates/tools",
  "crates/apt",
  "crates/apt-worker",
  "crates/sstv",
  "crates/sstv-worker",
  "crates/wspr",
  "crates/wspr-worker",
]
default-members = ["crates/core", "crates/server", "crates/tools", "crates/apt"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/lf-wxp/ham-web"
homepage = "https://ham.onlyxp.me"
authors = ["lf-wxp"]

[workspace.dependencies]
ham-web-core = { path = "crates/core" }
ham-web-nec = { path = "crates/nec" }
ham-web-apt = { path = "crates/apt" }
ham-web-sstv = { path = "crates/sstv" }
ham-web-sstv-worker = { path = "crates/sstv-worker" }
ham-web-wspr = { path = "crates/wspr" }
ham-web-wspr-worker = { path = "crates/wspr-worker" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
thiserror = "2.0.21"

# frontend
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

# server
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sgp4 = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "sync"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br", "set-header", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# tools
clap = { version = "4", features = ["derive", "env"] }
regex = "1.13"
ureq = "3"
resvg = "0.48"
sha2 = "0.11"
brotli = "9"
flate2 = "1"
walkdir = "2"
# 字体子集化 + WOFF2 编码（纯 Rust：不需要 Python / fonttools，也不需要 C++ 工具链）
fontcull-klippa = "0.1"
fontcull-skrifa = "0.39"
ttf2woff2 = { version = "0.13", default-features = false }
# 只用来把 GB2312 一级汉字区的字节对解码成码点
encoding_rs = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
# 关闭 LTO：fat LTO 会为每个 crate 生成 .bc bitcode 中间文件，
# 显著放大 target 目录，是磁盘紧张环境下的主要空间杀手
lto = "off"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1

# 前端 WASM 构建使用体积优先的配置（由 index.html 中的 data-cargo-profile-release 指定，仅 release 构建生效）
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# 关闭 LTO：wasm 体积优化主要由 wasm-opt（data-wasm-opt="z"）完成，
# LTO 收益有限却会显著增大 target 中间产物，拖累 Docker 构建缓存占用
lto = "off"
panic = "abort"
