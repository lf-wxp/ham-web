html[data-palette='mono'] .s9-wf-cell[data-lv='2'],
html[data-palette='mono'] .s9-wf-cell[data-lv='3'],
html[data-palette='mono'] .s9-wf-cell[data-lv='4'],
html[data-palette='mono'] .s9-wf-cell[data-lv='5'] { background: var(--blue); }
html[data-palette='warm'] .s9-wf-cell[data-lv='2'] { background: var(--gold); }
html[data-palette='warm'] .s9-wf-cell[data-lv='3'] { background: var(--accent); }
.s9-wf-legend { display: flex; align-items: center; gap: 6px; }
.s9-wf-legend i { width: 12px; height: 8px; display: inline-block; }

.s9-stat {
  border: 1px solid var(--line);
  border-radius: var(--r3);
  background: var(--surface);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.s9-stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.s9-stat-spark { height: 18px; width: 100%; }
.s9-progress { display: grid; grid-template-columns: repeat(40, 1fr); gap: 2px; }
.s9-progress-cell { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 1px; }
.s9-progress-cell[data-state='done'] { background: var(--accent); border-color: var(--accent); }
.s9-progress-cell[data-state='now'] { border-color: var(--accent); box-shadow: var(--glow); animation: s9-blink var(--dur-blink) steps(2, end) infinite; }
.s9-bars { display: flex; align-items: flex-end; gap: 5px; height: 96px; }
.s9-chart-bar { flex: 1; background: linear-gradient(to top, var(--bar-bottom), var(--bar-top)); border-top: 1px solid var(--green); }
.s9-heat { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.s9-heat-cell { height: 15px; border: 1px solid var(--line); background: var(--surface-2); }
.s9-heat-cell[data-lv='1'] { background: var(--blue-lv1); }
.s9-heat-cell[data-lv='2'] { background: var(--green-lv2); }
.s9-heat-cell[data-lv='3'] { background: var(--gold); }
.s9-heat-cell[data-lv='4'] { background: var(--accent); }
.s9-qsl {
  border: 1px solid var(--line);
  border-radius: var(--r2);
  background: var(--surface-2);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.s9-qsl[data-earned='1'] { border-color: var(--gold); }
.s9-qsl-mark { height: 26px; border-bottom: 1px solid var(--line); position: relative; }
.s9-qsl-mark:before {
  content: '';
  position: absolute;
  left: 10%;
  right: 10%;
  top: 6px;
  height: 12px;
  border: 1px solid var(--line-strong);
  border-bottom: 0;
  border-radius: 50% 50% 0 0;
}
.s9-qsl-call { font-family: var(--font-mono); font-size: 11px; }

/* ---------- 页面专属 ---------- */
.s9-hero { display: grid; grid-template-columns: 7fr 5fr; gap: 20px; align-items: center; min-height: 210px; }
.s9-hero-title { font-size: clamp(28px, 3.6vw, 46px); line-height: 1.18; margin: 0 0 14px; }
.s9-hero-title em { font-style: normal; color: var(--accent); }
.s9-hero-copy { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.s9-tower { position: relative; height: 200px; display: grid; place-items: center; }
.s9-tower svg { width: 100%; height: 100%; }
/* 首页发射塔主视觉：整套复刻 modern UI 的首屏（kit_modern/home/hero.rs 的 SVG +
   style/modern/kit/{01-base,03-atmosphere,05-menu}.css 的动效），md-* 全部映射到 s9-* token。 */
.s9-tower--hero { height: 320px; }
.s9-aurora {
  position: absolute;
  /* 完全落在主视觉容器内：负 inset 会让色光越过上方板头，也与 SVG 几何脱节 */
  inset: 0;
  pointer-events: none;
  filter: blur(52px);
  opacity: .62;
  background:
    radial-gradient(closest-side, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%) 12% 18% / 52% 62% no-repeat,
    radial-gradient(closest-side, color-mix(in srgb, var(--blue) 14%, transparent), transparent 70%) 82% 8% / 48% 58% no-repeat,
    radial-gradient(closest-side, color-mix(in srgb, var(--violet) 14%, transparent), transparent 70%) 58% 92% / 56% 60% no-repeat;
}
/* 与 modern UI .md-tower-glow 同口径：塔身一层柔和电光辉光，静态、不随时间闪动 */
.s9-tower-glow { filter: drop-shadow(0 0 14px var(--tower-glow)); }
.s9-hero-line { height: 1px; background: var(--accent); box-shadow: var(--glow); }
.s9-task-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.s9-task-row:last-child { border-bottom: 0; }
.s9-task-row .s9-note { margin-left: auto; }
.s9-task-arrow {
  display: inline-grid;
  place-items: center;
  width: var(--ico);
  height: var(--ico);
  flex: none;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1;
}
/* 字符型图标与 SVG 图标共用同一尺寸盒，避免视觉上忽大忽小 */
.s9-glyph {
  display: inline-grid;
  place-items: center;
  width: var(--ico);
  height: var(--ico);
  flex: none;
  font-size: 14px;
  line-height: 1;
  text-align: center;
  transition: var(--tr-ico);
}
.s9-bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.s9-bento-cell {
  border: 1px solid var(--line);
  border-radius: var(--r3);
  padding: 14px;
  background: var(--surface);
  min-height: 92px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.s9-bento-cell[data-accent='1'] { border-color: var(--accent); }
.s9-bento-cell:nth-child(2) { grid-column: span 2; }

/* ---------- 首页动效：对齐现有 modern/landing 的节奏 ----------
   首帧编排（文案错峰入位 / 橙尺画出 / 表针校准 / 频谱长起 / 清单逐行 / 瀑布反向点亮），
   折叠线下由 IntersectionObserver 打 data-reveal='in' 浮现；循环电波滚出视口即暂停。
   三层视差由 JS 写 transform；整段挂在 no-preference + data-anim='on' 下，降级即静态终态。 */
@media (prefers-reduced-motion: no-preference) {
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-home-copy > * { animation: s9-home-in var(--dur-enter-3) var(--ease) backwards; }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-home-copy > :nth-child(1) { animation-delay: var(--dur-stagger-2); }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-home-copy > :nth-child(2) { animation-delay: var(--dur-stagger-4); }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-home-copy > :nth-child(3) { animation-delay: var(--dur-stagger-6); }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-home-copy > :nth-child(4) { animation-delay: var(--dur-stagger-7); }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-hero-line { animation: s9-line-sweep var(--dur-enter-5) var(--ease) backwards; }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-home-art { animation: s9-home-disc var(--dur-enter-4) var(--ease) backwards; }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-needle { animation: s9-home-needle var(--dur-enter-5) var(--ease) backwards; }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-sp-bar { animation: s9-home-grow var(--dur-enter-2) var(--ease) backwards; }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-wf-cell { animation: s9-home-lit var(--dur-enter-1) var(--ease) backwards; }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-task-row { animation: s9-home-row var(--dur-enter-2) var(--ease) backwards; }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-task-row:nth-child(2) { animation-delay: var(--dur-stagger-3); }
  html[data-anim='on'] .s9-home[data-enter='1'] .s9-task-row:nth-child(3) { animation-delay: var(--dur-stagger-5); }

  html[data-anim='on'] .s9-home [data-home-reveal] {
    transition: opacity var(--dur-enter-2) var(--ease), transform var(--dur-enter-2) var(--ease);
  }
  html[data-anim='on'] .s9-home [data-home-reveal]:not([data-reveal='in']) {
    opacity: 0;
    transform: translateY(12px);
  }
  html[data-anim='on'] .s9-home [data-home-reveal][data-reveal='in'] {
    opacity: 1;
    transform: none;
  }

  /* 首页塔台电波直接对齐 modern UI 的 .md-ring-wave / @keyframes md-ring-out
     （crates/app/style/modern/kit/01-base.css）：4.2s 扩散消散、三圈错峰 1/3 周期、
     fill-box 圆心缩放；描边取 --blue / 1.5px 对齐那边渐变环的电光强度，随主题换肤。
     错峰沿用负相位，让首帧就是完整扩散而非逐圈等待启动；航标灯与 modern UI 一样静态。
     循环只跑 #board，打印栈副本不参与。 */
  html[data-anim='on'] #board .s9-home .s9-home-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: s9-ring-out var(--dur-ring) var(--ease-out) infinite;
  }
  html[data-anim='on'] #board .s9-home .s9-home-ring--2 { animation-delay: calc(var(--dur-ring) / -3); }
  html[data-anim='on'] #board .s9-home .s9-home-ring--3 { animation-delay: calc(var(--dur-ring) * -2 / 3); }
  /* 与 modern UI 05-menu / 03-atmosphere 同口径：卫星上下漂浮、EME 虚线流动、
     月盘呼吸、极光漂移。都只跑 #board 内的首页，打印栈副本不参与。 */
  html[data-anim='on'] #board .s9-home .s9-sat {
    animation: s9-sat-float var(--dur-sat) var(--ease) infinite alternate;
  }
  html[data-anim='on'] #board .s9-home .s9-eme {
    stroke-dasharray: 5 9;
    animation: s9-eme-travel var(--dur-eme) linear infinite;
  }
  html[data-anim='on'] #board .s9-home .s9-eme-back {
    animation-duration: var(--dur-eme-back);
    animation-direction: reverse;
  }
  html[data-anim='on'] #board .s9-home .s9-moon-disc {
    transform-box: fill-box;
    transform-origin: center;
    animation: s9-moon-pulse var(--dur-moon) var(--ease) infinite alternate;
  }
  html[data-anim='on'] #board .s9-home .s9-aurora {
    animation: s9-aurora-drift var(--dur-aurora) var(--ease) infinite alternate;
  }
  /* 实时波形只有一条来源：合成层 transform 行波。不写 height、不混 height 过渡，
     负相位让 21 根柱子一开始就铺满流动，避免逐根排队启动与每 3s 跳变造成的顿感。 */
  html[data-anim='on'] #board .s9-home .s9-chart-bar {
    transform-origin: bottom;
    animation: s9-live-wave var(--dur-live) ease-in-out infinite;
  }
  html[data-anim='on'] #board .s9-home-live-card { transition: border-color var(--dur) var(--ease); }
  html[data-anim='on'] #board .s9-home-live-card[data-live-on='1'] { border-color: var(--accent); }
  /* 循环动画只在当前设计板里跑：打印栈的 30 页副本不带动画，滚出视口全部暂停 */
  html[data-anim='on'] #board .s9-home[data-offscreen='1'] .s9-home-ring,
  html[data-anim='on'] #board .s9-home[data-offscreen='1'] .s9-sat,
  html[data-anim='on'] #board .s9-home[data-offscreen='1'] .s9-eme,
  html[data-anim='on'] #board .s9-home[data-offscreen='1'] .s9-moon-disc,
  html[data-anim='on'] #board .s9-home[data-offscreen='1'] .s9-aurora,
  html[data-anim='on'] #board .s9-home[data-offscreen='1'] .s9-chart-bar,
  html[data-anim='on'] #board .s9-home [data-live-off='1'] .s9-chart-bar {
    animation-play-state: paused;
  }
}

@media (hover: hover) {
  .s9-home .s9-task-row,
  .s9-home .s9-bento-cell {
    transition: transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .s9-home .s9-task-row:hover,
  .s9-home .s9-bento-cell:hover { transform: translateX(3px); }
  .s9-home .s9-bento-cell:hover { border-color: var(--blue); }
}

.s9-question { font-size: 17px; line-height: 1.7; margin: 0 0 12px; font-weight: 500; }
.s9-option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r3);
  background: var(--surface-2);
  text-align: left;
  font-size: 14px;
  position: relative;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.s9-option:hover { border-color: var(--blue); background: var(--blue-wash); }
.s9-option-key { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; flex: none; }
.s9-option[data-state='on'] {
  padding-top: 11px;
  background: var(--blue-wash);
  border-color: var(--blue);
  border-top: 2px solid var(--accent);
}
.s9-option[data-state='right'] { border-color: var(--green); box-shadow: 0 0 8px var(--green-glow-soft); }
.s9-option[data-state='wrong'] { border-color: var(--red); }
.s9-option[data-state='wrong'] .s9-option-key { color: var(--red); }
.s9-explain { animation: s9-rise var(--dur-slow) var(--ease) both; }
.s9-answer-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.s9-answer-cell {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  padding: 0;
}
.s9-answer-cell[data-state='done'] { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.s9-answer-cell[data-state='now'] { border-color: var(--accent); box-shadow: var(--glow); color: var(--accent-ink); }
.s9-answer-cell[data-state='flag']:after { content: ''; position: absolute; }
.s9-timer { font-family: var(--font-mono); font-size: 30px; font-weight: 600; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.s9-timer[data-danger='1'] { color: var(--red); }
.s9-chipbar { display: flex; gap: 6px; flex-wrap: wrap; }
.s9-table { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r3); overflow: hidden; }
.s9-tr { display: grid; grid-template-columns: var(--cols, 80px 1fr 110px 90px 24px); gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.s9-tr:last-child { border-bottom: 0; }
.s9-tr[data-head='1'] { background: var(--surface-2); font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.s9-tr[data-row]:hover { box-shadow: inset 3px 0 0 var(--blue); background: var(--blue-wash); }
.s9-list-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.s9-list-row:last-child { border-bottom: 0; }
.s9-list-row:hover { box-shadow: inset 3px 0 0 var(--blue); }
.s9-article { max-width: 36em; }
.s9-article-h { font-family: var(--font-display); font-weight: 900; font-size: 22px; margin: 0 0 10px; }
.s9-article-p { color: var(--muted); line-height: 1.85; margin: 0 0 12px; font-size: 15px; }
.s9-article-index { font-family: var(--font-mono); font-size: 11px; color: var(--accent-ink); }
.s9-map { position: relative; height: auto; aspect-ratio: 640 / 230; border: 1px solid var(--line); border-radius: var(--r3); background: var(--surface-2); overflow: hidden; }
.s9-map:before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, var(--blue-grid-soft) 1px, transparent 1px),
    linear-gradient(to bottom, var(--blue-grid-soft) 1px, transparent 1px);
  background-size: 32px 32px;
}
.s9-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.s9-map-pin { fill: var(--accent); stroke: var(--bg); stroke-width: 1; cursor: pointer; }
.s9-map-pin:hover { fill: var(--green); }
.s9-flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.s9-flow-step {
  border: 1px solid var(--line);
  border-radius: var(--r3);
  padding: 12px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
}
.s9-flow-step:not(:last-child):after {
  content: '→';
  position: absolute;
  right: -12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
  font-family: var(--font-mono);
  z-index: var(--z-flow-caption);
}
.s9-flow-step[data-on='1'] { border-color: var(--accent); }

.s9-phone-row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
.s9-phone {
  width: 300px;
  height: 620px;
  border: 1px solid var(--line-strong);
  border-radius: 18px;
  background: var(--bg);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
}
.s9-phone-notch { height: 16px; display: flex; justify-content: center; }
.s9-phone-notch:before { content: ''; width: 60px; height: 6px; border-radius: 3px; background: var(--line-strong); }
.s9-phone-screen { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.s9-phone-title { font-family: var(--font-display); font-weight: 900; font-size: 19px; line-height: 1.25; }
.s9-phone-dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.s9-phone-dock--nav { grid-template-columns: repeat(5, 1fr); gap: 2px; }
.s9-phone-dock span { font-family: var(--font-mono); font-size: 10px; text-align: center; color: var(--muted); }
.s9-phone-dock-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: center;
  cursor: pointer;
  transition: var(--tr-base);
}
.s9-phone-dock-item:hover { color: var(--fg); }
.s9-phone-dock-item svg { width: var(--ico); height: var(--ico); }
.s9-phone-dock-item[data-on='1'] { color: var(--accent-ink); }

.s9-story { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.s9-story-frame { border: 1px solid var(--line); border-radius: var(--r3); background: var(--surface); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.s9-story-art { height: 92px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface-2); position: relative; overflow: hidden; display: grid; place-items: center; }
.s9-story-art:before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px);
  background-size: 12px 12px;
}
.s9-story-state { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; color: var(--accent-ink); }
.s9-matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.s9-matrix-cell {
  border: 1px solid var(--line);
  border-radius: var(--r2);
  background: var(--surface-2);
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 86px;
}
.s9-swatch-row { display: flex; gap: 6px; flex-wrap: wrap; }
.s9-swatch { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: var(--r1); position: relative; cursor: pointer; }
.s9-swatch[data-on='1'] { outline: 1px solid var(--accent); outline-offset: 2px; }
.s9-type-row { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding: 8px 0; }
.s9-type-row > :first-child { width: 132px; flex: none; }
.s9-spec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.s9-spec-list { display: flex; flex-direction: column; gap: 7px; font-size: 12px; }
.s9-spec-list li { list-style: none; padding-left: 12px; position: relative; color: var(--muted); }
.s9-spec-list li:before { content: '—'; position: absolute; left: 0; color: var(--accent); }
.s9-spec-list b { color: var(--fg); font-weight: 600; }

/* ---------- 浮层 ---------- */
.s9-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  background: var(--scrim);
  background-image: linear-gradient(to right, var(--blue-grid-soft) 1px, transparent 1px),
    linear-gradient(to bottom, var(--blue-grid-soft) 1px, transparent 1px);
  background-size: 24px 24px;
  animation: s9-fade var(--dur) var(--ease) both;
}
.s9-overlay[hidden], .s9-palette[hidden], .s9-drawer[hidden], .s9-modal[hidden] { display: none; }
.s9-overlay[data-state='closed'] {
  pointer-events: none;
  animation: s9-fade-out var(--dur-fast) var(--ease) both;
}
.s9-palette[data-state='closed'] {
  pointer-events: none;
  animation: s9-pop-out var(--dur-fast) var(--ease) both;
}
/* Drawer / Modal 也进同一套关闭态：抽屉向右滑出、模态与调谐台同款淡出 */
.s9-drawer[data-state='closed'] {
  pointer-events: none;
  animation: s9-drawer-out var(--dur-fast) var(--ease) both;
}
.s9-modal[data-state='closed'] {
  pointer-events: none;
  animation: s9-pop-out var(--dur-fast) var(--ease) both;
}
@keyframes s9-fade-out { to { opacity: 0; } }
@keyframes s9-drawer-out { to { opacity: 0; transform: translateX(32px); } }
@keyframes s9-pop-out { to { opacity: 0; scale: .985; translate: 0 8px; } }
.s9-palette {
  position: fixed;
  z-index: var(--z-panel);
  inset: 0;
  margin: auto;
  width: min(720px, calc(100vw - 40px));
  height: fit-content;
  max-height: calc(100vh - 80px);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line-strong);
  border-radius: var(--r5);
  background: var(--surface);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
  animation: s9-pop var(--dur) var(--ease) both;
}
.s9-palette-input {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  position: relative;
}
.s9-palette-input input { flex: 1; border: 0; background: transparent; outline: 0; font-size: 16px; }
.s9-palette-input:after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  height: 1px;
  width: 100%;
  background: var(--accent);
  opacity: .3;
}
.s9-palette[data-state='scanning'] .s9-palette-input:after { opacity: 1; animation: s9-line-sweep var(--dur-scan) linear infinite; }
.s9-palette-results { flex: 1; min-height: 0; overflow: auto; }
.s9-result {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  cursor: pointer;
}
.s9-result[data-on='1'] { background: var(--blue-wash); box-shadow: inset 3px 0 0 var(--accent); }
.s9-result-bars { display: flex; gap: 2px; }
.s9-result-bars i { width: 5px; height: 9px; background: var(--line-strong); }
.s9-result-bars i[data-on='1'] { background: var(--green); }
.s9-result-route { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.s9-palette-foot {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
}
.s9-palette-empty { padding: 34px 16px; text-align: center; font-family: var(--font-mono); letter-spacing: .16em; color: var(--muted); }
.s9-drawer {
  position: fixed;
  z-index: var(--z-panel);
  right: 0;
  top: 0;
  bottom: 0;
  width: min(420px, 100vw);
  border-left: 1px solid var(--line-strong);
  background: var(--surface);
  padding: 20px;
  overflow: auto;
  animation: s9-slide var(--dur) var(--ease) both;
}
.s9-drawer-group { margin-bottom: 22px; }
.s9-drawer-group > .s9-label { display: block; margin-bottom: 10px; }
.s9-drawer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.s9-modal {
  position: fixed;
  z-index: var(--z-modal);
  inset: 0;
  margin: auto;
  width: min(420px, calc(100vw - 40px));
  height: fit-content;
  max-height: calc(100vh - 80px);
  overflow: auto;
  border: 1px solid var(--line-strong);
  border-radius: var(--r5);
  background: var(--surface);
  padding: 22px;
  box-shadow: var(--shadow-pop);
  animation: s9-pop var(--dur) var(--ease) both;
}
.s9-toast {
  position: fixed;
  z-index: var(--z-toast);
  right: 18px;
  bottom: 18px;
  max-width: min(320px, calc(100vw - 36px));
  padding: 9px 16px;
  border: 1px solid var(--accent);
  border-radius: var(--r2);
  background: var(--surface);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .08em;
  box-shadow: var(--glow);
  animation: s9-toast-in var(--dur) var(--ease) both;
}
/* 进/退场都用独立的 translate、scale 属性，不覆盖水平居中的 transform */
@keyframes s9-toast-in { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
@keyframes s9-toast-out { to { opacity: 0; translate: 0 8px; scale: .98; } }
/* 关闭态先播 120ms 淡出下滑，播完再卸载；期间不拦截点击 */
.s9-toast[data-state='closed'] {
  animation: s9-toast-out var(--dur-fast) var(--ease) both;
  pointer-events: none;
}
.s9-ripple {
  position: fixed;
  z-index: var(--z-toast);
  width: 12px;
  height: 12px;
  border: 1px solid var(--blue);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  animation: s9-ripple var(--dur-scan) var(--ease) both;
}

.s9-print-stack { display: none; }

@keyframes s9-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes s9-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes s9-pop { from { opacity: 0; scale: .985; translate: 0 -8px; } to { opacity: 1; scale: 1; translate: 0 0; } }
@keyframes s9-slide { from { transform: translateX(16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes s9-sweep { from { left: 0; } to { left: 100%; } }
/* 主视觉循环层，与 md-sat-float / md-eme-travel / md-moon-pulse / md-aurora-drift 同形 */
@keyframes s9-sat-float { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
@keyframes s9-eme-travel { to { stroke-dashoffset: -140; } }
@keyframes s9-moon-pulse { from { opacity: .75; } to { opacity: 1; } }
@keyframes s9-aurora-drift {
  from { transform: translate3d(-2%, -1%, 0) scale(1); opacity: .85; }
  to { transform: translate3d(3%, 2%, 0) scale(1.08); opacity: 1; }
}
@keyframes s9-line-sweep { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); transform-origin: left; } }
@keyframes s9-switch-sweep { from { left: 0; opacity: 1; } to { left: 100%; opacity: 0; } }
@keyframes s9-spin { to { transform: rotate(360deg); } }
@keyframes s9-blink { 50% { opacity: .25; } }
@keyframes s9-ripple { from { width: 12px; height: 12px; opacity: .9; } to { width: 120px; height: 120px; opacity: 0; } }

@keyframes s9-home-in { from { opacity: 0; translate: 0 10px; } }
@keyframes s9-home-row { from { opacity: 0; translate: 0 10px; } }
@keyframes s9-home-disc { from { opacity: 0; scale: .55; } }
@keyframes s9-home-needle { from { transform: rotate(-76deg); } }
@keyframes s9-home-grow { from { transform: scaleY(0); } }
@keyframes s9-home-lit { from { opacity: 0; clip-path: polygon(15% 0, 15% 0, 0 100%, 0 100%); } }
/* 与 md-ring-out 同形：45% 起扩散到 135%，70% 淡尽；不是原地呼吸 */
@keyframes s9-ring-out {
  0% { transform: scale(.45); opacity: .5; }
  70% { opacity: 0; }
  100% { transform: scale(1.35); opacity: 0; }
}
@keyframes s9-live-wave {
  0%, 100% { transform: scaleY(.92); }
  25% { transform: scaleY(1.03); }
  50% { transform: scaleY(.96); }
  75% { transform: scaleY(1.06); }
}

/* ---------- 状态过渡层 / STATE MOTION ----------
   一张表管住全部基础组件：press 120 / state 180 / expand 320，统一 --ease。
   图标与控件本体同规；展开块用 allow-discrete 让 display 也参与过渡，JS 不必改。 */
:root {
  --tr-base:
    background-color var(--dur-state) var(--ease),
    border-color var(--dur-state) var(--ease),
    color var(--dur-state) var(--ease),
    box-shadow var(--dur-state) var(--ease),
    transform var(--dur-press) var(--ease),
    opacity var(--dur-state) var(--ease),
    filter var(--dur-state) var(--ease);
  --tr-ico:
    transform var(--dur-state) var(--ease),
    opacity var(--dur-state) var(--ease),
    background-color var(--dur-state) var(--ease),
    border-color var(--dur-state) var(--ease),
    color var(--dur-state) var(--ease),
    fill var(--dur-state) var(--ease),
    stroke var(--dur-state) var(--ease),
    box-shadow var(--dur-state) var(--ease);
}

/* 1) 控件本体：换态一律 180ms，位移按压 120ms */
.s9-btn,
.s9-chip,
.s9-choice,
.s9-switch,
.s9-input,
.s9-textarea,
.s9-option,
.s9-bento-cell,
.s9-pk-opt,
.s9-pk-cell,
.s9-pk-clock-item,
.s9-pk-trigger,
.s9-pager-btn,
.s9-dir-item,
.s9-dir-sub-item,
.s9-fab-row,
.s9-fab-sub-item,
.s9-fab-close,
.s9-ds-qrow,
.s9-ds-tile,
.s9-sf-icon,
.s9-chip-x,
.s9-tbl tbody tr[data-row] { transition: var(--tr-base); }

/* 2) 图标 / 指示器：跟着当前状态变形，不靠替换字符 */
.s9-btn:after,
.s9-tx-lamp,
.s9-choice-box,
.s9-switch-thumb,
.s9-led,
.s9-chip-dot,
.s9-chip-count,
.s9-chip-x,
.s9-dir-caret,
.s9-task-arrow,
.s9-sf-icon svg,
.s9-fab-icon path,
.s9-fab-close svg,
.s9-mini-fab,
.s9-ico { transition: var(--tr-ico); }

/* 统一图标：14px 单线、1.8 描边，状态只改 transform / 颜色 / 透明度 */
.s9-ico {
  display: inline-block;
  width: var(--ico);
  height: var(--ico);
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
}
.s9-ico--chevron { transform: rotate(-90deg); }
[data-expanded='true'] > .s9-ico--chevron,
[data-open='1'] > .s9-ico--chevron,
.s9-pk-pop[data-open='1'] .s9-ico--chevron,
[aria-expanded='true'] .s9-ico--chevron { transform: rotate(0deg); }
button:hover > .s9-ico--arrow,
.s9-bento-cell:hover .s9-task-arrow { transform: translateX(3px); }
[data-on='1'] > .s9-ico { color: var(--accent-ink); }
[disabled] > .s9-ico,
[data-disabled='1'] > .s9-ico { opacity: .4; }
.s9-fab-close:hover svg { transform: rotate(90deg); }
.s9-chip-x:hover { transform: rotate(90deg); }
.s9-sf-icon:hover svg { transform: scale(1.15); color: var(--accent-ink); }
.s9-led[data-state='off'] { opacity: .22; }
.s9-led[data-state='on'] { opacity: 1; }

/* 3) 勾 / 圆点 / 半选横杠：同一枚标记在状态间缩放变形 */
.s9-choice-box:after {
  transform: rotate(-45deg) translateY(-1px) scale(.35);
  opacity: 0;
  transition:
    transform var(--dur-state) var(--ease-pop),
    opacity var(--dur-state) var(--ease),
    width var(--dur-state) var(--ease),
    height var(--dur-state) var(--ease),
    border-color var(--dur-state) var(--ease);
}
.s9-choice[data-state='on'] .s9-choice-box:after,
.s9-tbl tbody tr[data-selected='1'] td:first-child .s9-choice-box:after {
  transform: rotate(-45deg) translateY(-1px) scale(1);
  opacity: 1;
}
.s9-choice[data-state='mixed'] .s9-choice-box:after {
  transform: none scaleX(1);
  opacity: 1;
}
.s9-choice[data-kind='radio'] .s9-choice-box:after { transform: scale(.3); opacity: 0; }
.s9-choice[data-kind='radio'][data-state='on'] .s9-choice-box:after { transform: scale(1); opacity: 1; }

/* 4) FAB 菜单图标：收起三横线，展开旋转成 × */
.s9-fab-icon path { transform-origin: 12px 12px; }
.s9-phone--fab[data-open='1'] .s9-fab-icon path[data-line='top'] { transform: translateY(5px) rotate(45deg); }
.s9-phone--fab[data-open='1'] .s9-fab-icon path[data-line='mid'] { opacity: 0; transform: scaleX(.2); }
.s9-phone--fab[data-open='1'] .s9-fab-icon path[data-line='bot'] { transform: translateY(-5px) rotate(-45deg); }

/* 5) 展开 / 收起块：display 也参与过渡，进入淡入下滑、退出反向后卸载。
   Picker 面板已改走 .s9-pk-layer 的 data-state 动画，不在此组。 */
.s9-dir-sub,
.s9-fab-sub,
.s9-ds-qrow-block,
.s9-sf-tip,
.s9-sf-bubble {
  transition:
    opacity var(--dur-expand) var(--ease),
    transform var(--dur-expand) var(--ease),
    display var(--dur-expand) allow-discrete;
}
.s9-dir-sub[hidden],
.s9-fab-sub[hidden],
.s9-ds-qrow-block[hidden],
.s9-sf-tip[hidden],
.s9-sf-bubble[hidden] {
  display: none;
  opacity: 0;
  transform: translateY(-6px);
}
@starting-style {
  .s9-dir-sub:not([hidden]),
  .s9-fab-sub:not([hidden]),
  .s9-ds-qrow-block:not([hidden]),
  .s9-sf-tip:not([hidden]),
  .s9-sf-bubble:not([hidden]) {
    opacity: 0;
    transform: translateY(-6px);
  }
}

/* 6) 降级：时长归 1ms 之外，还要显式停掉无限循环，避免 1ms 疯狂闪 */
html[data-reduce='1'] .s9-ds-skel:after,
html[data-reduce='1'] .s9-btn--loading:after,
html[data-reduce='1'] .s9-led[data-state='blink'],
html[data-reduce='1'] .s9-scanline,
html[data-reduce='1'] .s9-status[data-state='scanning'] .s9-status-lamp,
html[data-reduce='1'] .s9-chart-bar,
html[data-reduce='1'] .s9-home-ring,
html[data-reduce='1'] .s9-sat,
html[data-reduce='1'] .s9-eme,
html[data-reduce='1'] .s9-moon-disc,
html[data-reduce='1'] .s9-aurora,
html[data-anim='off'] .s9-ds-skel:after,
html[data-anim='off'] .s9-btn--loading:after,
html[data-anim='off'] .s9-led[data-state='blink'],
html[data-anim='off'] .s9-scanline,
html[data-anim='off'] .s9-status[data-state='scanning'] .s9-status-lamp,
html[data-anim='off'] .s9-chart-bar,
html[data-anim='off'] .s9-home-ring,
html[data-anim='off'] .s9-sat,
html[data-anim='off'] .s9-eme,
html[data-anim='off'] .s9-moon-disc,
html[data-anim='off'] .s9-aurora { animation: none; }

/* 7) 具体状态语义：悬停 / 激活 / 禁用 / 选中 / 展开，各走同一套时长 */
.s9-btn:hover:not(:disabled):not(.s9-btn--loading):after,
.s9-btn[data-demo='hover']:not(.s9-btn--loading):after { translate: 2px 0; opacity: 1; }
.s9-btn:active:not(:disabled):not(.s9-btn--loading):after { translate: 0 0; opacity: .5; }
.s9-btn:disabled:after,
.s9-btn[data-demo='disabled']:after { opacity: .25; }
.s9-btn--accent:hover .s9-tx-lamp { transform: scale(1.35); box-shadow: 0 0 10px var(--accent); }
.s9-option-key { transition: var(--tr-ico); }
.s9-option[data-state='on'] .s9-option-key,
.s9-option[data-state='right'] .s9-option-key { color: var(--accent-ink); transform: scale(1.1); }
.s9-option[data-state='wrong'] .s9-option-key { color: var(--red); }
.s9-chip[data-on='1'] .s9-chip-dot { transform: scale(1.2); }
.s9-chip[disabled] .s9-chip-dot,
.s9-chip[disabled] .s9-chip-count { opacity: .4; }
.s9-pk-opt[data-checked='1'] .s9-ico,
.s9-fab-row[data-on='1'] .s9-ico { color: var(--accent-ink); }
.s9-dir-item[data-expanded='true'] .s9-dir-caret { color: var(--accent-ink); }
.s9-sf-dialog[data-tone='danger'] .s9-sf-dialog-head { border-bottom-color: var(--red); }
.s9-sf-dialog-head { transition: border-color var(--dur-state) var(--ease); }
.s9-file-row[data-state='done'] .s9-file-state { color: var(--green); }
.s9-file-state { transition: color var(--dur-state) var(--ease); }
.s9-flash-target[data-flash='1'] { animation: s9-flash var(--dur-expand) var(--ease) 1; }

/* 8) 状态序列演示器：同一枚控件走完 7 态，全部走上面的统一时长 */
[data-mt-demo] { transition: var(--tr-base); }
[data-mt-demo][data-state='hover'] { transform: translateY(-2px); border-color: var(--accent); color: var(--fg); }
[data-mt-demo][data-state='active'] { transform: translateY(2px) scale(.98); }
[data-mt-demo][data-state='focus'] { outline: 2px dashed var(--blue); outline-offset: 2px; }
[data-mt-demo][data-state='selected'] { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
[data-mt-demo][data-state='selected'] .s9-ico { color: var(--on-blue); }
[data-mt-demo][data-state='disabled'] { opacity: .4; filter: saturate(.4); }
[data-mt-demo][data-state='expanded'] { background: var(--wash); color: var(--accent-ink); border-color: var(--accent); }
[data-mt-demo][data-state='expanded'] .s9-ico--chevron { transform: rotate(0deg); }

/* ---------- 视口断点：480 / 640 / 720 / 900 / 1024 + 外壳 768 / 360 ----------
   窄屏上界统一写范围语法，互斥档边界只属于一边（modern.md §3）。
   900 以下外壳改单列，顶栏三段都可收缩、工具区横向滚动，不再把整页撑到 919px。 */
@media (width < 1024px) {
  .s9-bar { gap: 10px; padding: 0 14px; }
  .s9-canvas { padding: 18px; }
}
@media (width < 900px) {
  .s9-shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60px auto minmax(0, 1fr); }
  .s9-brand { flex: none; }
  .s9-bar-spacer { display: none; }
  .s9-status { flex: none; min-width: 0; }
  .s9-status-freq { display: none; }
  .s9-bar-tools { flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-end; scrollbar-width: none; }
  .s9-bar-tools::-webkit-scrollbar { display: none; }
  .s9-rail { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; }
  .s9-group { display: flex; gap: 6px; margin: 0; flex: none; }
  .s9-group-title, .s9-rail-foot, .s9-nav-num { display: none; }
  .s9-nav-item { width: auto; white-space: nowrap; grid-template-columns: 1fr; padding: 6px 10px; border-left: 0; border-radius: var(--r2); }
  .s9-cards-mobile { grid-template-columns: 1fr; }
  .s9-cols { grid-template-columns: 1fr; }
  .s9-hero { grid-template-columns: 1fr; }
  .s9-spec-grid, .s9-matrix, .s9-story, .s9-flow { grid-template-columns: repeat(2, 1fr); }
}
/* 外壳档 768：dock / 页内菜单按钮的窄屏口径；板内重排仍交给 data-view='mobile' */
@media (width < 768px) {
  .s9-bar { gap: var(--sp-2); padding: 0 var(--sp-3); }
  .s9-tool { height: var(--ctl-h-sm); }
}
@media (width < 720px) {
  .s9-status-word { display: none; }
}
@media (width < 640px) {
  .s9-brand-sub { display: none; }
  .s9-tool { flex: none; white-space: nowrap; padding: 0 var(--sp-2); }
  .s9-canvas { padding: var(--sp-3); }
  .s9-board-body { padding: var(--sp-3) var(--sp-3) 28px; }
  .s9-foot > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (width < 480px) {
  .s9-bar-div, .s9-status { display: none; }
  .s9-board-head { padding: 10px var(--sp-3) 12px; }
}
/* 外壳档 360：顶栏品牌文字折叠，只留标记与工具区 */
@media (width < 360px) {
  .s9-brand-name { display: none; }
}

/* ---------- 任意板切移动端视图 ----------
   现有 @media (max-width:900px) 认的是浏览器视口，把板限宽到 390px 时视口没变，
   那条断点根本不会触发；这里用 #board[data-view='mobile'] 按容器宽度真实重排。
   内联 style="--cols: …" 只设变量、不设 grid-template-columns 属性本身，
   所以下面直接写属性即可覆盖，不需要 !important。 */
.s9-mobile-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.s9-mobile-bar > .s9-label { margin-right: auto; }
.s9-mobile-shell {
  position: relative;
  width: var(--mw, 390px);
  margin: 20px auto 26px;
  padding: 10px;
  border: 1px solid var(--line-strong);
  border-radius: 26px;
  background: var(--device-frame);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
}
.s9-mobile-notch { display: flex; justify-content: center; height: 16px; }
.s9-mobile-notch:before { content: ''; width: 64px; height: 6px; border-radius: 3px; background: var(--line-strong); }
.s9-mobile-screen {
  height: 720px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.s9-mobile-dock {
  position: absolute;
  left: 11px;
  right: 11px;
  bottom: 11px;
  z-index: var(--z-local-dock);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  padding: 6px 6px 8px;
  border-top: 1px solid var(--line);
  border-radius: 0 0 14px 14px;
  background: var(--surface);
  box-shadow: 0 -8px 20px rgba(0, 0, 0, .35);
  color: var(--muted);
}
.s9-mobile-dock-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 44px;
  padding: 4px 2px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: inherit;
  font-family: var(--font-mono);
  font-size: 10px;
  cursor: pointer;
  transition: var(--tr-base);
}
.s9-mobile-dock-item svg { width: var(--ico); height: var(--ico); flex: none; }
.s9-mobile-dock-item[data-on='1'] { color: var(--accent-ink); background: var(--wash); }

#board[data-view='mobile'] .s9-board-head { padding: 12px; }
/* 板说明在移动端预览保留：换板后用户仍需知道当前页讲的是什么 */
#board[data-view='mobile'] .s9-board-head .s9-board-note { display: block; width: 100%; font-size: 11px; }
#board[data-view='mobile'] .s9-board-meta .s9-tag { display: none; }
#board[data-view='mobile'] .s9-board-title { font-size: 17px; }
#board[data-view='mobile'] .s9-board-body { padding: 12px 12px 76px; }
#board[data-view='mobile'] .s9-page { padding: 12px 0 8px; gap: 12px; }
#board[data-view='mobile'] .s9-frame + .s9-page { padding: 14px 12px 20px; }
#board[data-view='mobile'] .s9-cols { grid-template-columns: 1fr; gap: 10px; }
#board[data-view='mobile'] .s9-hero { grid-template-columns: 1fr; min-height: 0; gap: 8px; }
#board[data-view='mobile'] .s9-hero-title { font-size: 28px; }
#board[data-view='mobile'] .s9-tower { height: 130px; }
#board[data-view='mobile'] .s9-spec-grid,
#board[data-view='mobile'] .s9-matrix,
#board[data-view='mobile'] .s9-story,
#board[data-view='mobile'] .s9-flow,
#board[data-view='mobile'] .s9-dir-states { grid-template-columns: repeat(2, 1fr); }
#board[data-view='mobile'] .s9-flow-step:not(:last-child):after { display: none; }
#board[data-view='mobile'] .s9-bento { grid-template-columns: repeat(2, 1fr); }
#board[data-view='mobile'] .s9-bento-cell:nth-child(2) { grid-column: span 1; }
#board[data-view='mobile'] .s9-answer-grid { grid-template-columns: repeat(8, 1fr); }
#board[data-view='mobile'] .s9-tr { grid-template-columns: 1fr auto; }
#board[data-view='mobile'] .s9-phone-row { gap: 12px; }
#board[data-view='mobile'] .s9-phone { width: 100%; max-width: 300px; }
#board[data-view='mobile'] .s9-frame {
  position: sticky;
  top: 0;
  z-index: var(--z-local-dock);
  height: 46px;
  padding: 0 12px;
  gap: 10px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
}
/* <768 顶栏只留品牌 + 全站搜索 icon + 设置 icon：六个一级入口交给 dock，
   顶栏不再摆「更多」，全站 184 条路由目录只由 dock 最下面那一个「更多」打开。 */
#board[data-view='mobile'] .s9-frame-nav { display: none; }
#board[data-view='mobile'] .s9-frame-tools { display: flex; margin-left: auto; }
#board[data-view='mobile'] .s9-frame-search { display: grid; }

/* 手机屏内的「更多」：面板不挂 body，而是 absolute 铺满手机屏，
   头尾固定 / 中间单列滚动，盖过 dock。列数必须按容器（手机壳）而不是浏览器窗口算，
   否则 390px 的屏里仍会套用宽窗口的四列。 */
#board[data-view='mobile'] .s9-mobile-shell > .s9-pk-panel.s9-frame-more-panel {
  position: absolute;
  inset: 26px 10px 10px;
  z-index: var(--z-demo-dialog);
  width: auto;
  max-height: none;
  border: 0;
  border-radius: 14px;
  transform-origin: center bottom;
}
#board[data-view='mobile'] .s9-mobile-shell > .s9-pk-panel[data-state='closed'] {
  transform: translateY(16px);
}
#board[data-view='mobile'] .s9-frame-more-grid { columns: 1; }
#board[data-view='mobile'] .s9-frame-more-head { gap: 6px 8px; padding: 10px; }
#board[data-view='mobile'] .s9-frame-more-meta { display: none; }
#board[data-view='mobile'] .s9-frame-more-title,
#board[data-view='mobile'] .s9-frame-more-head .s9-key,
#board[data-view='mobile'] .s9-frame-more-close { order: 1; }
#board[data-view='mobile'] .s9-frame-more-close { display: grid; }
#board[data-view='mobile'] .s9-frame-more-search { order: 2; flex: 1 1 100%; }
#board[data-view='mobile'] .s9-frame-more-foot { flex-wrap: wrap; padding: 8px 10px; }
#board[data-view='mobile'] .s9-frame-more-foot .s9-note { flex: 1 1 100%; }
/* 手机上没有 ⌘K 键帽，页脚只留说明，避免再叠开第二个浮层 */
#board[data-view='mobile'] .s9-frame-more-foot .s9-btn { display: none; }
#board[data-view='mobile'] .s9-frame-tools .s9-key,
#board[data-view='mobile'] .s9-key { display: none; }
#board[data-view='mobile'] .s9-panel-body { padding: 10px; overflow-x: auto; }
#board[data-view='mobile'] .s9-card { padding: 10px; }
#board[data-view='mobile'] .s9-spread { flex-wrap: wrap; }
#board[data-view='mobile'] .s9-h { font-size: 20px; }
#board[data-view='mobile'] .s9-question { font-size: 15px; }
#board[data-view='mobile'] .s9-seven-value { font-size: 18px; }
#board[data-view='mobile'] .s9-tbl { font-size: 11px; }
#board[data-view='mobile'] .s9-tbl th,
#board[data-view='mobile'] .s9-tbl td { padding: 6px 5px; }
#board[data-view='mobile'] .s9-sf-icons { grid-template-columns: repeat(4, 1fr); }
#board[data-view='mobile'] .s9-wb { grid-template-columns: 1fr; }
#board[data-view='mobile'] .s9-panel.s9-has-pop .s9-panel-body { overflow: visible; }
#board[data-view='mobile'] .s9-pk-cell { height: 30px; }
#board[data-view='mobile'] .s9-led-row { font-size: 10px; }
/* 搜索结果摘要改两行折行，避免 390px 档下被裁掉 40 余像素 */
#board[data-view='mobile'] .s9-dlg-row-snip { white-space: normal; overflow-wrap: anywhere; }
#board[data-view='mobile'] .s9-file-name { overflow-wrap: anywhere; }
/* 手机框内装饰层不参与滚动宽度；屏高随视口收缩，底部 dock 始终可见 */
#board[data-view='mobile'] .s9-phone--fab { overflow: hidden; }
.s9-mobile-screen { height: min(720px, calc(100vh - 300px)); min-height: 420px; }

/* ---------- 统一焦点环 / 读屏专用节点 ---------- */
.s9-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

  ['toolTrain', '训练 · 辅助', '工具与实时', 'tools'],
  ['direct', '站点直链', '站点直链', 'home'],
];
const MORE_GROUP_MAP = Object.fromEntries(MORE_GROUPS.map(([key, label, section, board]) => [key, { label, section, board }]));
const PRIMARY_BOARDS = new Set(NAV_ITEMS.map(([, board]) => board));
/* 每条路由都能落到设计板：先按真实路径在 S9.pages 里找，找不到按功能分组兜底 */
const routeBoard = (path, key) => {
  const hit = S9.pages.find(p => p.route.split(' · ').includes(path));
  return hit ? hit.id : MORE_GROUP_MAP[key].board;
};

F.frameMoreItem = (row, key, opt = {}) => {
  const [path, title] = row;
  const meta = MORE_GROUP_MAP[key];
  const on = opt.boardPaths.has(path);
  const name = `${title} ${path} ${meta.label} ${meta.section}`;
  return `<button id="more-opt-${opt.index}" class="s9-frame-more-route" role="option"
    data-act="go" data-board="${routeBoard(path, key)}" data-name="${escText(name)}"
    data-on="${on ? 1 : 0}" data-active="${opt.active ? 1 : 0}"
    aria-label="${escText(title)} · ${escText(path)}" aria-selected="${on}"${on ? ' aria-current="page"' : ''}>
      <span class="s9-frame-more-path">${escText(path)}</span><span class="s9-frame-more-name">${escText(title)}</span>${on ? '<span class="s9-frame-more-flag">当前</span>' : ''}
    </button>`;
};
F.frameMoreGroup = (key, count, body) => {
  const meta = MORE_GROUP_MAP[key];
  return `<div class="s9-frame-more-group" role="group" aria-label="${escText(meta.label)}" data-group="${key}">
    <div class="s9-frame-more-group-title"><span>${escText(meta.section)} / ${escText(meta.label)}</span><span class="s9-frame-more-group-count">${pad(count)}</span></div>
    ${body}
  </div>`;
};
F.frameMorePanel = () => {
  const page = S9.pages.find(p => p.id === S9.state.board) || { route: '' };
  const boardPaths = new Set(page.route.split(' · '));
  // 一条全局序号同时管键盘游标起点与 aria-activedescendant 的 id，全量清单里不重复
  const ordered = MORE_GROUPS.flatMap(([key]) => S9.ROUTES.filter(r => r[2] === key));
  const indexOf = new Map(ordered.map((r, i) => [r, i]));
  const activeIndex = Math.max(0, ordered.findIndex(r => boardPaths.has(r[0])));
  const groups = MORE_GROUPS.map(([key]) => {
    const rows = S9.ROUTES.filter(r => r[2] === key);
    const body = rows.map(r => F.frameMoreItem(r, key, {
      index: indexOf.get(r), active: indexOf.get(r) === activeIndex, boardPaths,
    })).join('');
    return F.frameMoreGroup(key, rows.length, body);
  }).join('');
  return F.pkPanel('frame-more-panel', `
    <div class="s9-frame-more-head">
      <span class="s9-frame-more-title">全站能力 / ALL ROUTES</span>
      <span class="s9-frame-more-meta s9-label">${S9.ROUTES.length} 条路由 · ${MORE_GROUPS.length - 1} 个功能分组 + ${S9.ROUTES.filter(r => r[2] === 'direct').length} 条直链</span>
      ${F.input({ className: 's9-frame-more-search', type: 'search', placeholder: '按名称 / 路由过滤…', ariaLabel: '过滤全站路由', data: { moreSearch: 1 } })}
      <button class="s9-key" data-act="palette" aria-label="打开 ⌘K 调谐台，搜索全部路由" title="全站路由搜索">⌘K</button>
      <button class="s9-frame-more-close" data-act="frame-more-close" aria-label="关闭全站路由" title="关闭">×</button>
    </div>
    <div class="s9-frame-more-body">
      <div class="s9-frame-more-grid" role="listbox" aria-label="全站路由">${groups}</div>
      <div class="s9-frame-more-empty" hidden>NO SIGNAL · 没有匹配的路由</div>
    </div>
    <div class="s9-frame-more-foot">
      ${F.note(`全部 ${S9.ROUTES.length} 条路由逐条列出，按功能分组；点条目跳到对应设计板，筛选框与全站搜索可跨组查找`)}
      ${F.btn('打开调谐台', { act: 'palette', variant: 'outline', small: true })}
    </div>`, {
    className: 's9-frame-more-panel',
    attrs: 'data-pk-kind="nav"',
  });
};
F.frameMoreTrigger = () => {
  const here = !PRIMARY_BOARDS.has(S9.state.board);
  return `<button class="s9-pk-trigger s9-frame-more-trigger" type="button"
    data-act="pk-toggle" data-target="frame-more-panel" data-on="${here ? 1 : 0}"
    aria-haspopup="true" aria-expanded="false" aria-controls="frame-more-panel"
    title="全站路由 · ${S9.ROUTES.length} 条"${here ? ' aria-current="true"' : ''}>
      <span class="s9-pk-trigger-main">更多</span>${F.icon('chevron', { chevron: true })}
    </button>`;
};

</div>`;

const ICON_PATHS = {

F.pkTrigger = (text, opt = {}) => {

F.pkPanel = (id, content, opt = {}) => `<div class="s9-pk-panel${opt.className ? ` ${opt.className}` : ''}" id="${id}"${opt.open ? '' : ' hidden'}${opt.attrs ? ` ${opt.attrs}` : ''}>${content}</div>`;

F.pkOpt = (text, opt = {}) => {
  const attrs = [
    opt.act ? `data-act="${opt.act}"` : '',
    opt.v !== undefined ? `data-v="${opt.v}"` : '',
    opt.checked !== undefined ? `data-checked="${opt.checked ? 1 : 0}"` : '',
    opt.active !== undefined ? `data-active="${opt.active ? 1 : 0}"` : '',
    opt.disabled ? 'disabled' : '',
    opt.extra || '',
  ].filter(Boolean).join(' ');
  return `<button class="s9-pk-opt" ${attrs}>${text}</button>`;
};
F.pkOpts = (group, items, opt = {}) => `${F.pkGroup(group)}${items.map(([v, st, dis]) => F.pkOpt(v, {
  act: 'pk-opt', v,
  checked: st === 'checked',
  active: st === 'checked' || st === 'cursor' || st === 'active',
  disabled: !!dis,
  extra: opt.listbox ? `role="option" aria-selected="${st === 'checked' ? 'true' : 'false'}"` : '',
})).join('')}`;
/* Select / SimpleSelect 通用组件：触发器是 combobox、面板是 listbox，与 DatePicker / TimePicker 共用同一套浮层。
   选中态与错误态只由 data-* / aria-* 驱动，选中即清错误，避免原生下拉的系统外观混进设计系统。 */
F.selectPop = (opt = {}) => {
  const target = opt.target || `${opt.id || 'select'}-panel`;
  const items = (opt.options || []).map(o => (typeof o === 'string' ? { text: o } : o));
  const picked = items.find(o => o.selected);
  const value = opt.value || (picked ? picked.text : items[0] && items[0].text) || '请选择';
  const triggerAttrs = [
    opt.id ? `id="${opt.id}"` : '',
    'role="combobox"',
    'aria-haspopup="listbox"',
    'aria-expanded="false"',
    `aria-controls="${target}"`,
    opt.invalid ? 'aria-invalid="true"' : '',
    opt.disabled ? 'aria-disabled="true"' : '',
    opt.extra || '',
  ].filter(Boolean).join(' ');
  const content = opt.groups
    ? opt.groups.map(g => F.pkOpts(g.label, g.items, { listbox: true })).join('')
    : items.map(o => F.pkOpt(o.text, {
      act: 'pk-opt',
      v: o.text,
      checked: !!o.selected,
      active: !!o.selected,
      disabled: !!o.disabled,
      extra: `role="option" aria-selected="${o.selected ? 'true' : 'false'}"`,
    })).join('');
  return `<div class="s9-pk-pop s9-pk-pop--select" data-select="1"${opt.invalid ? ' aria-invalid="true"' : ''}>
    ${F.pkTrigger(value, { target, attrs: triggerAttrs })}
    ${F.pkPanel(target, content, { attrs: `role="listbox" aria-label="${opt.label || '选项'}"` })}
  </div>`;
};
F.pkCell = (day, opt = {}) => `<button class="s9-pk-cell" data-act="pk-day" data-y="${opt.y}" data-m="${opt.m}" data-day="${day}" data-out="${opt.out ? 1 : 0}" data-on="${opt.on ? 1 : 0}" aria-pressed="${opt.on ? 'true' : 'false'}" aria-label="${opt.y}年${opt.m + 1}月${day}日">${day}</button>`;
F.pkClockItem = (v, opt = {}) => `<button class="s9-pk-clock-item" data-act="pk-time" data-part="${opt.part}" data-v="${v}" data-on="${opt.on ? 1 : 0}" role="option" aria-selected="${opt.on ? 'true' : 'false'}">${v}</button>`;
F.pkNavBtn = (icon, act, label, opt = {}) => `<button class="s9-pk-nav" data-act="${act}"${opt.data ? ` ${dataAttrs(opt.data)}` : ''} aria-label="${label}">${F.iconSvg(icon)}</button>`;
/* 日历头部：左右箭头翻月 / 翻十年，中间按钮在「日期视图 ↔ 年份视图」间切换 */
F.pkCalBar = () => {
  const s = S9.state;
  const years = s.pkView === 'years';
  const act = years ? 'pk-decade' : 'pk-month';
  return `<div class="s9-pk-cal-bar">
    ${F.pkNavBtn('chevronLeft', act, years ? '上一组年份' : '上一个月', { data: { d: -1 } })}
    <button class="s9-pk-current" data-act="pk-year-view" aria-label="${years ? '返回日期选择' : '选择年份'}" aria-expanded="${years}">
      <span>${years ? `${s.pkDecade} – ${s.pkDecade + 11}` : `${s.pkYear} 年 ${s.pkMonth + 1} 月`}</span>${F.icon('chevron', { chevron: true })}
    </button>
    ${F.pkNavBtn('chevronRight', act, years ? '下一组年份' : '下一个月', { data: { d: 1 } })}
  </div>`;
};
F.pkCalGrid = () => {
  const { pkYear: y, pkMonth: m, pkDay: d } = S9.state;
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const cells = Array.from({ length: 42 }, (_, i) => {
    const n = i - first;
    const out = n < 0 || n >= days;
    const day = n < 0 ? prevDays + n + 1 : n >= days ? n - days + 1 : n + 1;
    let cy = y;
    let cm = m;
    if (n < 0) { cm -= 1; if (cm < 0) { cm = 11; cy -= 1; } }
    else if (n >= days) { cm += 1; if (cm > 11) { cm = 0; cy += 1; } }
    return F.pkCell(day, { y: cy, m: cm, out, on: !out && day === d });
  }).join('');
  return `<div class="s9-pk-cal" role="group" aria-label="日期">${['日', '一', '二', '三', '四', '五', '六'].map(x => `<span class="s9-pk-cal-head">${x}</span>`).join('')}${cells}</div>`;
};
F.pkYearCell = (y, opt = {}) => `<button class="s9-pk-cell s9-pk-year-cell" data-act="pk-year-pick" data-y="${y}" data-on="${opt.on ? 1 : 0}" role="option" aria-selected="${opt.on}" aria-label="${y} 年">${y}</button>`;
F.pkYearGrid = () => `<div class="s9-pk-years" role="listbox" aria-label="年份">${Array.from({ length: 12 }, (_, i) => {
  const y = S9.state.pkDecade + i;
  return F.pkYearCell(y, { on: y === S9.state.pkYear });
}).join('')}</div>`;
F.pkCalendar = () => `<div class="s9-pk-cal-wrap" data-view="${S9.state.pkView}">${F.pkCalBar()}${S9.state.pkView === 'years' ? F.pkYearGrid() : F.pkCalGrid()}</div>`;
/* 时与分各包一层独立滚动容器，滚动一列不会带动另一列 */
F.pkClock = () => `<div class="s9-pk-clock">
  ${[
    ['h', '时 / HH', 24, i => pad(i), i => i === S9.state.pkHour],
    ['m', '分 / MM', 12, i => pad(i * 5), i => i * 5 === S9.state.pkMinute],
  ].map(([part, label, n, fmt, isOn]) => `<div class="s9-pk-clock-col" data-part="${part}">
    ${F.label(label)}
    <div class="s9-pk-clock-scroll" data-part="${part}" role="listbox" aria-label="${part === 'h' ? '小时' : '分钟'}">
      ${Array.from({ length: n }, (_, i) => F.pkClockItem(fmt(i), { part, on: isOn(i) })).join('')}
    </div>
  </div>`).join('')}
</div>`;
F.pkStepBtn = (d) => `<button data-act="pk-step" data-d="${d}" aria-label="${d < 0 ? '减少' : '增加'}">${d < 0 ? '−' : '＋'}</button>`;
F.pkStep = (opt = {}) => `<div class="s9-pk-step">${F.input({
  className: '',
  type: 'text',
  value: opt.value,
  ariaLabel: opt.ariaLabel,
  inputMode: opt.inputMode,
  data: opt.data,
  extra: opt.extra,
})}${F.pkStepBtn(-1)}${F.pkStepBtn(1)}</div>`;

F.dirSearch = (opt = {}) => `<div style="padding: 8px">${F.input({
  className: 's9-dir-search',
  type: 'search',
  placeholder: opt.placeholder || '按名称 / 路由过滤…',
  ariaLabel: opt.ariaLabel,
  data: { dirSearch: opt.id },

F.dirItem = (text, opt = {}) => {
  const tag = opt.tag || 'button';

  return `<${tag} class="s9-dir-item" ${attrs}>${opt.caret || ''}${text}${opt.count !== undefined ? `<span class="s9-dir-count">${opt.count}</span>` : ''}</${tag}>`;
};
F.dirSubItem = (text, opt = {}) => {
  const tag = opt.tag || 'button';

    opt.act ? `data-act="${opt.act}"` : '',
    dataAttrs(opt.data),

  ].filter(Boolean).join(' ');
  return `<${tag} class="s9-dir-sub-item" ${attrs}>${text}${opt.count !== undefined ? `<span class="s9-dir-count">${opt.count}</span>` : ''}</${tag}>`;
};
F.dirSub = (id, content, opt = {}) => `<div class="s9-dir-sub" data-dir-sub="${id}"${opt.hidden ? ' hidden' : ''}>${content}</div>`;

F.fabIcon = () => '<svg class="s9-fab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path data-line="top" d="M4 7h16"></path><path data-line="mid" d="M4 12h16"></path><path data-line="bot" d="M4 17h16"></path></svg>';
F.fabToggle = (open) => `<button class="s9-fab" data-act="fab-toggle" data-open="${open ? 1 : 0}" aria-label="打开分类目录">${F.fabIcon()}</button>`;
F.fabClose = () => `<button class="s9-fab-close" data-act="fab-close" aria-label="关闭抽屉">${F.iconSvg('close', { className: '' })}</button>`;
F.fabRow = (text, opt = {}) => `<button class="s9-fab-row" data-act="fab-row" data-k="${opt.k}" data-has-sub="1" data-on="${opt.on ? 1 : 0}" data-expanded="${opt.expanded ? 'true' : 'false'}">${text}${F.icon('chevron', { chevron: true, caret: true, style: 'margin-left: auto' })}</button>`;
F.fabSubItem = (text) => `<button class="s9-fab-sub-item" data-act="fab-row" data-name="${text}"><span>${text}</span><span class="s9-dir-caret">→</span></button>`;
F.fabMask = () => '<div class="s9-fab-mask" data-act="fab-mask"></div>';
F.fabSub = (k, content, opt = {}) => `<div class="s9-fab-sub" data-fab-sub="${k}"${opt.hidden ? ' hidden' : ''}>${content}</div>`;

F.dropZone = (opt = {}) => `<div class="s9-drop" data-act="${opt.act || 'kit-drop'}" data-state="${opt.state || 'idle'}" role="button" tabindex="0" aria-label="${opt.ariaLabel || '选择或拖入文件'}">
  <div class="s9-drop-mark">↑</div>
  <div style="font-size: 13px">${opt.text || ''}</div>
  <div class="s9-note" style="margin-top: 6px">${opt.note || ''}</div>
</div>`;
F.fileRow = (opt = {}) => `<div class="s9-file-row" data-state="${opt.state}"${opt.dataFile ? ' data-file="1"' : ''}>
  <span class="s9-file-name">${opt.name}</span><span class="s9-label">${opt.size}</span><span class="s9-file-bar"><i></i></span>
  ${opt.retry ? F.chip('重试', { act: 'kit-retry', sm: true }) : `<span class="s9-file-state">${opt.stateText}</span>`}
</div>`;
F.fileList = (rows) => `<div class="s9-file-list">${rows}</div>`;
F.dialogSurface = (opt = {}) => `<div class="s9-sf-dialog" data-tone="${opt.tone || 'normal'}"${opt.id ? ` id="${opt.id}"` : ''}>
  <div class="s9-sf-dialog-head"><div class="s9-h" style="font-size: 15px">${opt.title || ''}</div><div class="s9-note" style="margin-top: 4px">${opt.description || ''}</div></div>
  <div class="s9-sf-dialog-body">${opt.body || ''}</div>
  <div class="s9-sf-dialog-foot">${opt.footer || ''}</div>
</div>`;
F.formula = (text, opt = {}) => `<div class="s9-ds-formula"${opt.style ? ` style="${opt.style}"` : ''}>${text}</div>`;

F.spectrum = (opt = {}) => {
  const codes = ['REG', 'FRQ', 'OPS', 'TRM', 'MOD', 'EQP', 'ANT', 'PRP'];
  const base = { A: [42, 68, 55, 80, 61, 34, 72, 48], B: [55, 47, 73, 38, 84, 60, 44, 66], C: [70, 58, 40, 66, 52, 78, 36, 62] }[S9.state.band] || [50, 60, 45, 70, 55, 40, 75, 58];
  const lock = opt.lock === undefined ? 3 : opt.lock;
  return `
  <div>
    <div class="s9-spectrum">
      ${base.map((v, i) => {
        const lift = S9.state.locked && i === lock ? 12 : 0;
        const h = clamp(v + lift + Math.round((S9.state.freq - 14.2) * 1.4), 8, 96);
        return `<div class="s9-sp-col" data-locked="${i === lock ? '1' : '0'}" data-hit="${S9.state.scanning && i <= lock ? '1' : '0'}">
          <div class="s9-sp-bar" data-sp="${i}" style="height:${h}%"></div>
          <span class="s9-sp-label">${codes[i]}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="s9-base-line" style="margin-top: 4px"></div>
    <div class="s9-row" style="justify-content: space-between; margin-top: 6px">
      ${F.label('1.8 MHz')}<span class="s9-label" style="color: var(--accent-ink)">8 分类 / dB · S9 合格线</span>${F.label('28 MHz')}
    </div>
  </div>`;
};

F.meter = (label = '备考信号 / S-METER') => {
  const v = clamp(S9.state.sValue, 1, 11);
  const deg = -76 + (v - 1) * 9.6;
  const ticks = Array.from({ length: 11 }, (_, i) => {
    const a = (-180 + i * 18) * Math.PI / 180;
    const x1 = 100 + Math.cos(a) * 82;
    const y1 = 96 + Math.sin(a) * 82;
    const x2 = 100 + Math.cos(a) * 90;
    const y2 = 96 + Math.sin(a) * 90;
    return `<line class="s9-meter-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
  }).join('');
  return `
  <div class="s9-stack" style="gap: 8px; align-items: center">
    ${F.label(label)}
    <div class="s9-meter">
      <svg viewBox="0 0 200 112" aria-label="S 表读数">
        <path class="s9-meter-arc" d="M10 96 A 90 90 0 0 1 190 96"></path>
        <path class="s9-meter-pass" d="M171 47 A 90 90 0 0 1 181 66"></path>
        ${ticks}
        <text class="s9-meter-text" x="16" y="108">S1</text>
        <text class="s9-meter-text" x="92" y="12">S5</text>
        <text class="s9-meter-text" x="168" y="108" fill="var(--accent)">S9</text>
        <g class="s9-needle" style="transform:rotate(${deg}deg)">
          <line x1="100" y1="96" x2="100" y2="22" stroke="var(--fg)" stroke-width="1.5"></line>
          <circle cx="100" cy="96" r="4" fill="var(--fg)"></circle>
        </g>
      </svg>
      <div class="s9-row" style="justify-content: center; gap: 8px; align-items: baseline; margin-top: -4px">
        <span class="s9-num" style="font-size: 22px">S${Math.min(v, 9)}${v > 9 ? '+20' : ''}</span>
        ${F.label('PASS LINE S9')}
      </div>
    </div>
    <div class="s9-note">距合格线还差 <b class="s9-mono">${Math.max(0, 9 - v)}</b> 格 · 指针阻尼摆动 320ms</div>
  </div>`;
};

F.wave = (seed, amp, base, filter, width = 480) => {
  const yAt = (x) => {
    const n = rnd(x / 8, seed);
    return base + Math.sin(x / 34 + seed) * amp * (filter ? .35 : 1) + (n - .5) * amp * .8 * (filter ? .25 : 1);
  };
  const xs = [];
  for (let x = 0; x < width; x += 8) xs.push(x);
  xs.push(width);
  return xs.map((x, i) => `${i === 0 ? 'M' : 'L'}${x} ${yAt(x).toFixed(1)}`).join(' ');
};

F.scope = (opt = {}) => {
  const h = opt.h || 160;
  const filter = opt.filter === undefined ? S9.state.filter : opt.filter;
  const noSignal = opt.noSignal === undefined ? S9.state.noSignal : opt.noSignal;
  const pct = (v, total) => `${(v / total * 100).toFixed(2)}%`;
  const peaks = [64, 148, 236, 318, 402];
  const heightAt = (i) => (26 + i * 7) * (filter ? .3 : 1);
  // 波形层按时间轴横向延展（none），但线宽锁定 1px；文字与标签框改走 HTML 覆盖层，
  // 用百分比定位与 SVG 坐标一一对应，这样它们永远不参与非等比缩放。
  const spikes = peaks.map((x, i) => `<line data-spike="${x}" x1="${x}" y1="${h - 26}" x2="${x}" y2="${h - 26 - heightAt(i)}" stroke="var(--red)" stroke-width="1" vector-effect="non-scaling-stroke"></line>`).join('');
  const marks = noSignal ? '' : peaks.map((x, i) => `<span class="s9-scope-mark" style="left:${pct(x + 3, 480)}; top:${pct(h - 30 - heightAt(i), h)}">P${pad(i + 1)}</span>`).join('');
  return `
  <div class="s9-scope" data-scope="1" data-scope-h="${h}" data-scope-filter="${filter ? 1 : 0}" data-scope-nosignal="${noSignal ? 1 : 0}" style="height:${h}px">
    <svg viewBox="0 0 480 ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${F.wave(3, 10, h - 30, filter)}" fill="none" stroke="var(--blue)" stroke-width="1" opacity=".55" vector-effect="non-scaling-stroke"></path>
      <path d="${F.wave(7, 26, h / 2, filter)}" fill="none" stroke="var(--green)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
      ${noSignal ? '' : spikes}
      <line data-cursor="236" x1="236" y1="12" x2="236" y2="${h - 12}" stroke="var(--accent)" stroke-width="1" opacity=".8" vector-effect="non-scaling-stroke"></line>
    </svg>
    <div class="s9-scope-marks" aria-hidden="true">
      <span class="s9-scope-peak" style="left:${pct(242, 480)}; top:${pct(18, h)}">PEAK -42 dBm</span>
      ${marks}
    </div>
    <div class="s9-scanline" data-on="${S9.state.run || S9.state.scanning ? '1' : '0'}"></div>
    <div class="s9-scope-caption">${opt.caption || '24px GRID · MHz / dB · 噪声底 -118 dBm'}</div>
    ${noSignal ? '<div class="s9-scope-no-signal">NO SIGNAL · 底噪 -118 dBm</div>' : ''}
  </div>`;
};

F.waterfall = (rows = 7, cols = 28, seed = 5) => `
  <div class="s9-waterfall">
    ${Array.from({ length: rows }, (_, r) => `<div class="s9-wf-row">${Array.from({ length: cols }, (_, c) => {
      const v = rnd(r * 31 + c, seed + S9.state.sValue);
      const lv = v > .93 ? 5 : v > .8 ? 4 : v > .62 ? 3 : v > .4 ? 2 : v > .22 ? 1 : 0;
      return `<i class="s9-wf-cell" data-lv="${lv}"></i>`;
    }).join('')}</div>`).join('')}
  </div>`;

/* 读数只用一层文字：叠 ghost 暗段会和亮字形成重影，暗段质感改由屏底与微光承担 */
F.seven = (value, opt = {}) => `<div class="s9-seven${opt.small ? ' s9-seven--sm' : ''}"${opt.style ? ` style="${opt.style}"` : ''}><span class="s9-seven-value"${opt.valueAttrs ? ` ${opt.valueAttrs}` : ''}>${value}</span></div>`;

F.stat = (value, label, extra = '') => `
  <div class="s9-stat">

    <svg class="s9-stat-spark" viewBox="0 0 120 18" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 14 L12 11 L24 13 L36 7 L48 10 L60 5 L72 9 L84 4 L96 8 L108 3 L120 5" fill="none" stroke="var(--blue)" stroke-width="1" vector-effect="non-scaling-stroke"></path>
    </svg>
  </div>`;

F.progress = (done = 23, now = 24, total = 40) => `
  <div class="s9-progress">${Array.from({ length: total }, (_, i) => {
    const st = i < done ? 'done' : i === now ? 'now' : '';
    return `<i class="s9-progress-cell" data-state="${st}"></i>`;
  }).join('')}</div>`;

F.bars = (values) => `<div class="s9-bars">${values.map(v => `<i class="s9-chart-bar" style="height:${v}%"></i>`).join('')}</div>`;

F.qsl = (call, date, earned, label) => `
  <div class="s9-qsl" data-earned="${earned ? '1' : '0'}">

F.answerGrid = () => `
  <div class="s9-answer-grid">${Array.from({ length: 40 }, (_, i) => {
    const n = i + 1;
    const st = n <= S9.state.examAnswers ? 'done' : n === S9.state.examAnswers + 1 ? 'now' : '';
    return `<button class="s9-answer-cell" data-act="exam-cell" data-n="${n}" data-state="${st}">${pad(n)}</button>`;
  }).join('')}</div>`;

/* 首页发射塔主视觉：整套复刻 modern UI 的 kit_modern/home/hero.rs 场景，
   md-* 变量映射到 s9-* token；渐变 id 带序号，避免打印栈 30 页副本同 id。
   底盘三层（外圈 / 虚线内圈 / 竖轴）与场景共用 SVG 坐标，以场景中心 (210,170) 为同心点，
   r=150 完整落在 0 0 420 360 画布内；不再用 CSS div 画圈，避免缩放脱节与溢出到 header。
   simple 模式保留简笔塔给窄屏预览板使用。 */
let towerSeq = 0;
F.tower = (opt = {}) => {
  const u = `s9-art-${++towerSeq}`;
  if (opt.simple) return `
  <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g fill="none" stroke="var(--blue)" stroke-width="1.5">
      <circle class="s9-home-ring s9-home-ring--1" cx="160" cy="96" r="30"></circle>
      <circle class="s9-home-ring s9-home-ring--2" cx="160" cy="96" r="58"></circle>
      <circle class="s9-home-ring s9-home-ring--3" cx="160" cy="96" r="86"></circle>
    </g>
    <g fill="none" stroke="var(--accent)" stroke-width="1" opacity=".8">
      <path d="M124 96a36 36 0 0 1 72 0"></path>
      <path d="M102 96a58 58 0 0 1 116 0"></path>
    </g>
    <g class="s9-tower-glow" stroke="var(--blue)" stroke-width="1" fill="none">
      <path d="M160 176 L160 54 M138 176 L160 54 L182 176 M146 150 L174 150 M151 124 L169 124 M155 98 L165 98"></path>
    </g>
    <circle class="s9-tower-beacon" cx="160" cy="52" r="3" fill="var(--accent)"></circle>
    <path d="M0 176 H320" stroke="var(--accent)" stroke-width="1"></path>
    <g font-family="var(--font-mono)" font-size="9" fill="var(--muted)">
      <text x="6" y="192">144</text><text x="146" y="192">430</text><text x="272" y="192">1200 MHz</text>
    </g>
  </svg>`;
  return `
    <div class="s9-aurora" aria-hidden="true"></div>
    <svg viewBox="0 0 420 360" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="${u}-ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--blue)" stop-opacity=".85"></stop>
          <stop offset="100%" stop-color="var(--violet)" stop-opacity=".1"></stop>
        </linearGradient>
        <linearGradient id="${u}-mast" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--blue)" stop-opacity=".95"></stop>
          <stop offset="100%" stop-color="var(--blue)" stop-opacity=".25"></stop>
        </linearGradient>
        <linearGradient id="${u}-horizon" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--violet)" stop-opacity="0"></stop>
          <stop offset="50%" stop-color="var(--blue)" stop-opacity=".55"></stop>
          <stop offset="100%" stop-color="var(--violet)" stop-opacity="0"></stop>
        </linearGradient>
        <radialGradient id="${u}-moon" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".55"></stop>
          <stop offset="42%" stop-color="var(--violet)" stop-opacity=".16"></stop>
          <stop offset="72%" stop-color="var(--violet)" stop-opacity="0"></stop>
          <stop offset="100%" stop-color="var(--violet)" stop-opacity="0"></stop>
        </radialGradient>
        <linearGradient id="${u}-axis" x1="0" y1="0" x2="0" y2="1">

S9.render = () => {

  S9.pkLayerSweep();
  const p = S9.pages.find(x => x.id === S9.state.board) || S9.pages[0];
  const enter = S9.renderedBoard !== p.id;
  const viewKey = `${S9.state.mobile ? 1 : 0}-${S9.state.mobileWidth}`;
  const viewChanged = S9.renderedView !== viewKey;
  const resetScroll = enter || viewChanged;
  const board = $('#board');
  const canvas = $('.s9-canvas');
  // 原型为了同步状态做的是 innerHTML 全量替换；只有切板 / 换视图才回顶部，
  // 同板内改状态要留住滚动位置，否则每次点按钮都像整页跳回开头。
  const prevScroller = $('#board .s9-mobile-screen') || canvas;
  const keepScroll = resetScroll ? 0 : prevScroller.scrollTop;
  // 全量替换会丢焦点：按 data-* 身份找回同一个控件，键盘操作才不会被打断。
  const active = document.activeElement;
  let focusKey = '';
  let focusFallback = '';
  if (!resetScroll && active && board.contains(active) && active.dataset.act) {
    // data-state / data-on 这类会随本次点击改变，不能进身份串，否则重建后匹配不到。
    const volatile = ['state', 'on', 'enter', 'accent', 'demo', 'reveal', 'liveOn', 'offscreen'];
    const attr = k => `[data-${k.replace(/[A-Z]/g, c => `-${c.toLowerCase()}`)}="${CSS.escape(String(active.dataset[k]))}"]`;
    focusKey = Object.keys(active.dataset).filter(k => !volatile.includes(k)).map(attr).join('');
    focusFallback = `[data-act="${CSS.escape(active.dataset.act)}"]`;
  }
  board.dataset.enter = enter ? '1' : '0';
  board.dataset.view = S9.state.mobile ? 'mobile' : 'desktop';
  board.dataset.mw = String(S9.state.mobileWidth);
  const body = S9.B[p.id] ? S9.B[p.id]() : '<div class="s9-note">待补设计板</div>';
  // 移动端视图不是缩放整页：把这一板的内容装进真实宽度的手机屏，
  // 再由 #board[data-view='mobile'] 的属性规则重排内部布局。
  const content = S9.state.mobile ? `
    <div class="s9-mobile-bar">
      <span class="s9-label">MOBILE PREVIEW · ${p.title}</span>
      <div class="s9-row" style="gap: 4px; flex-wrap: nowrap">
        ${[360, 390, 480].map(w => F.chip(String(w), { sm: true, act: 'mobile-width', data: { w }, on: S9.state.mobileWidth === w })).join('')}
      </div>
      ${F.chip('✕ 退出', { sm: true, act: 'mobile-view' })}
    </div>
    <div class="s9-mobile-shell" style="--mw:${S9.state.mobileWidth}px">
      <div class="s9-mobile-notch"></div>
