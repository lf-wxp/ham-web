/* Toast 退场同样走 presence：停留结束先播动画，播完再卸载；卸载延迟不另写一份 */
const dismissToast = (el) => {
  if (el.dataset.state === 'closed') return;
  clearTimeout(el.__dwellTimer);
  S9.presence.close(el, () => el.remove());
};
S9.toast = (msg) => {
  // 同一时刻只留一条：旧提示先播退场，新提示紧接着进场，不做瞬间移除
  $$('.s9-toast').forEach(dismissToast);
  const el = document.createElement('div');
  el.className = 's9-toast';
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  el.setAttribute('aria-atomic', 'true');
  el.textContent = msg;
  document.body.appendChild(el);
  // 动态节点在部分读屏里不播报，常驻 live region 再写一次
  const live = $('#s9-live');
  if (live) live.textContent = msg;
  el.__dwellTimer = setTimeout(() => dismissToast(el), S9.motion.toastDwell);
};

S9.ripple = (x, y) => {
  const el = document.createElement('span');
  el.className = 's9-ripple';
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), S9.motion.ripple);
};

/* 弹层卸载延迟的唯一来源：退场动画播完再卸载，降级时立即卸载。
   时长对齐 CSS 的 --dur-fast，组件不各自写 setTimeout(…, 120)。 */
S9.presence = {
  exitMs: () => (S9.isReduced() ? 0 : S9.motion.exit),
  close(el, done) {
    clearTimeout(el.__exitTimer);
    el.dataset.state = 'closed';
    el.__exitTimer = setTimeout(done, S9.presence.exitMs());
  },
};

/* Picker 浮层：面板挂到 body 的独立层，脱离祖先的 overflow 与 stacking context。
   触发器留在原组件里，面板按它的 rect 定位；收起先播退场，再归位等待下次挂载。 */
S9.pkLayer = () => {
  let layer = $('.s9-pk-layer');
  if (!layer) {
    layer = document.createElement('div');
    layer.className = 's9-pk-layer';
    layer.dataset.pkLayer = '1';
    document.body.appendChild(layer);
  }
  return layer;
};
/* 手机上「更多」面板改挂 .s9-mobile-shell（屏内 Sheet），所以挂载点有两种；
   这条选择器是「所有已挂载面板」的唯一口径，Esc / closeAll / 键盘游标都读它。 */
const PK_MOUNTED = '.s9-pk-layer .s9-pk-panel, .s9-mobile-shell > .s9-pk-panel';
S9.pkMounted = () => $$(PK_MOUNTED);
/* 面板挂载后离开 #board、收起后归位；打印栈有同 id 副本，一律只查这两处。
   先查 #board 可避开 layer 里残留的同 id 孤儿。 */
S9.pkPanelFor = (id) => $(`#board [id="${id}"]`)
  || S9.pkMounted().find(p => p.id === id && p.__pkMounted);
/* 切板 / 打印前清空浮层：board 会重新生成面板，layer / 手机壳里的一切都是上一轮的残留 */
S9.pkLayerSweep = () => {
  S9.pkMounted().forEach((p) => {
    clearTimeout(p.__exitTimer);
    p.__pkMounted = false;
    p.remove();
  });
};
S9.pkPlace = (panel) => {
  const trigger = panel.__pkTrigger;
  if (!panel.__pkMounted || !trigger || !trigger.isConnected) return;
  const rect = trigger.getBoundingClientRect();
  const gap = 6;
  // 顶栏「更多」是整条顶栏宽的路由目录：左沿与顶栏版心对齐，6px 间隙从顶栏下沿算，
  // 不按触发器下沿算；高度 clamp 到视口，多出来的条目在面板里滚。其余几何与 Picker 共用。
  if (panel.dataset.pkKind === 'nav') {
    // 手机预览：面板铺满手机屏的几何全交给 CSS（inset + flex），
    // 这里不能按顶栏 rect 写内联 width / left / top，否则会把 Sheet 缩成一条窄下拉。
    if (S9.state.mobile) {
      panel.style.cssText = '';
      panel.dataset.placement = 'sheet';
      return;
    }
    const frame = trigger.closest('.s9-frame') || trigger;
    const fr = frame.getBoundingClientRect();
    const wide = Math.max(0, Math.min(fr.width, window.innerWidth - 16));
    // 高度上限按「顶栏下沿到视口底」算，不然 620px 的目录会被 clamp 到顶栏上方、盖住导航
    const cap = Math.max(180, Math.min(620, window.innerHeight - fr.bottom - 16));
    panel.style.width = `${wide}px`;
    panel.style.maxHeight = `${cap}px`;
    const h = panel.offsetHeight;
    panel.dataset.placement = 'bottom';
    panel.style.left = `${clamp(fr.left, 8, Math.max(8, window.innerWidth - wide - 8))}px`;
    panel.style.top = `${clamp(fr.bottom + gap, 8, Math.max(8, window.innerHeight - h - 8))}px`;
    return;
  }
  const width = Math.max(rect.width, 200);
  const cap = S9.state.mobile ? 200 : 264;
  panel.style.width = `${width}px`;
  panel.style.maxHeight = `${Math.min(cap, window.innerHeight - 16)}px`;
  const h = panel.offsetHeight;
  let top = rect.bottom + gap;
  let place = 'bottom';
  // 下方空间不够就翻到上方，任何情况下都不压住触发器
  if (top + h > window.innerHeight - 8 && rect.top - gap - h > 8) {
    top = rect.top - gap - h;
    place = 'top';
  }
  panel.dataset.placement = place;
  panel.style.left = `${clamp(rect.left, 8, Math.max(8, window.innerWidth - width - 8))}px`;
  panel.style.top = `${clamp(top, 8, Math.max(8, window.innerHeight - h - 8))}px`;
};
/* 日历切月 / 切年只重绘面板内容，不卸载浮层，避免展开动画重播 */
S9.pkRefreshDate = () => {
  const panel = S9.pkPanelFor('pk-date');
  const wrap = panel && $('.s9-pk-cal-wrap', panel);
  if (!wrap) return;
  wrap.outerHTML = F.pkCalendar();
  S9.pkPlace(panel);
};
/* 时间面板挂载后把选中的时 / 分滚到各自列的可见区，两列互不影响 */
S9.pkScrollActive = (panel) => {
  $$('.s9-pk-clock-scroll', panel).forEach((col) => {
    const on = $('.s9-pk-clock-item[data-on="1"]', col);
    // 滚动容器自身是 offsetParent，选中项按 offsetTop 居中，不牵动另一列
    if (on) col.scrollTop = Math.max(0, on.offsetTop - (col.clientHeight - on.offsetHeight) / 2);
  });
};
S9.pkMount = (panel, trigger, pop) => {
  clearTimeout(panel.__exitTimer);
  // 退场动画还没播完就再点触发器：取消卸载，直接接着淡入，不闪一下
  if (panel.__pkMounted) {
    panel.dataset.state = 'open';
    S9.pkPlace(panel);
    return;
  }
  panel.__pkPop = pop;
  panel.__pkTrigger = trigger;
  panel.__pkMounted = true;
  // 手机预览里「更多」是屏内 Sheet：挂到手机壳而不是 body 层，才不会跑到手机外面。
  const sheet = panel.dataset.pkKind === 'nav' && S9.state.mobile;
  const host = sheet ? ($('.s9-mobile-shell') || S9.pkLayer()) : S9.pkLayer();
  host.appendChild(panel);
  if (sheet) {
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-label', '全站路由');
  }
  panel.hidden = false;
  // 先落初态再切终态，transition 才有起点；不依赖 @starting-style
  panel.dataset.state = 'closed';
  void panel.offsetHeight;
  panel.dataset.state = 'open';
  S9.pkPlace(panel);
  if (sheet) {
    const close = $('.s9-frame-more-close', panel);
    if (close) close.focus({ preventScroll: true });
    S9.syncPortalA11y();
  }
  if ($('.s9-pk-clock', panel)) S9.pkScrollActive(panel);
};
S9.pkUnmount = (panel, immediate = false) => {
  if (!panel || !panel.__pkMounted) return;
  const finish = () => {
    if (!panel.__pkMounted) return;
    clearTimeout(panel.__exitTimer);
    panel.__pkMounted = false;
    panel.hidden = true;
    panel.dataset.state = 'idle';
    panel.removeAttribute('data-placement');
    panel.style.cssText = '';
    // 屏内 Sheet 的模态语义与焦点只在展开期存在，收起后归还触发者
    if (panel.dataset.pkKind === 'nav') {
      panel.removeAttribute('role');
      panel.removeAttribute('aria-modal');
      panel.removeAttribute('aria-label');
      panel.removeAttribute('inert');
      panel.removeAttribute('aria-hidden');
      const back = panel.__pkTrigger;
      if (back && back.isConnected) back.focus({ preventScroll: true });
    }
    if (panel.__pkPop && panel.__pkPop.isConnected) panel.__pkPop.appendChild(panel);
    else panel.remove();
    S9.syncPortalA11y();
  };
  if (immediate || S9.presence.exitMs() === 0) finish();
  else S9.presence.close(panel, finish);
};
S9.pkCloseAll = (immediate = false, except = null) => {
  S9.pkMounted().forEach((p) => {
    if (p === except) return;
    if (!p.__pkMounted) { p.remove(); return; }
    const pop = p.__pkPop;
    S9.pkUnmount(p, immediate);
    if (pop) pop.dataset.open = '0';
    const combo = pop && $('.s9-pk-trigger[aria-expanded]', pop);
    if (combo) combo.setAttribute('aria-expanded', 'false');
  });
  $$('.s9-pk-trigger[aria-activedescendant]').forEach(el => el.removeAttribute('aria-activedescendant'));
  // Esc / 点面板外收起时，dock「更多」的展开态也要跟着落回 false
  $$('.s9-mobile-dock-item[data-board="palette"][aria-expanded]')
    .forEach(el => el.setAttribute('aria-expanded', 'false'));
};

S9.closeTimer = 0;
/* 浮层焦点只在这里管：记录触发者、打开移入、Tab 循环、关闭归还、背景 inert。 */
S9.portalTrigger = null;
S9.trackPortal = (el) => {
  const active = document.activeElement;
  if (active && active !== document.body && el && !el.contains(active)) S9.portalTrigger = active;
};
S9.restorePortalFocus = () => {
  const t = S9.portalTrigger;
  S9.portalTrigger = null;
  if (t && t.isConnected && !t.disabled && typeof t.focus === 'function') t.focus({ preventScroll: true });
};
S9.syncPortalA11y = () => {
  $$('[data-dlg-layer]').forEach((l) => {
    const open = l.dataset.open === '1';
    l.toggleAttribute('inert', !open);
    l.setAttribute('aria-hidden', String(!open));
  });
  // 手机屏内的路由 Sheet 也是模态：关闭态 inert / aria-hidden，展开态不拦自己
  const moreSheet = $('.s9-mobile-shell > .s9-pk-panel[data-pk-kind="nav"]');
  if (moreSheet) {
    const open = moreSheet.dataset.state === 'open';
    moreSheet.toggleAttribute('inert', !open);
    moreSheet.setAttribute('aria-hidden', String(!open));
  }
  const portals = ['#palette', '#drawer', '#modal'].map(sel => $(sel)).filter(el => el && !el.hidden);
  const phone = $('#mobile-search');
  // 不能把 .s9-shell 整体 inert：路由 Sheet 就在 #board 里，会连自己一起锁住
  const anyOpen = portals.length > 0 || (phone && phone.dataset.open === '1');
  const shell = $('.s9-shell');
  if (shell) shell.toggleAttribute('inert', anyOpen);
  ['#palette', '#drawer', '#modal'].forEach((sel) => {
    const el = $(sel);
    if (!el) return;
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.toggleAttribute('inert', el.hidden);
  });
};
S9.hidePortals = () => {
  ['#overlay', '#palette', '#drawer', '#modal'].forEach(sel => { $(sel).hidden = true; });
  $('#palette').dataset.state = 'idle';
  // 关闭态必须清掉，否则下次打开会被 CLOSED 规则继续套用退场动画
  ['#overlay', '#drawer', '#modal'].forEach(sel => { $(sel).removeAttribute('data-state'); });
};
S9.finishClose = () => {
  S9.hidePortals();
  // 先解除背景 inert，否则焦点无法落回 shell 内的触发者
  S9.syncPortalA11y();
  S9.restorePortalFocus();
};
S9.closeAll = () => {
  clearTimeout(S9.closeTimer);
  // Picker 与全局浮层共用 Esc：栈顶有打开的面板时先收它，其余在 closeAll 内兜底
  S9.pkCloseAll();
  const overlay = $('#overlay');
  $$('.s9-phone--fab[data-open="1"]').forEach((p) => {
    p.dataset.open = '0';
    const fab = $('.s9-fab', p);
    if (fab) fab.dataset.open = '0';
  });
  // 屏内浮层（手机预览搜索）由自身 transition 淡出；overlay 可见的桌面浮层先播 120ms 退场，再统一卸载
  const phoneSearch = $('#mobile-search');
  if (phoneSearch) phoneSearch.dataset.open = '0';
  if (!S9.isReduced() && overlay && !overlay.hidden) {
    // 只给当前可见的浮层打关闭态，四个浮层共用同一段退场与同一个 presence 延迟
    ['#palette', '#drawer', '#modal'].forEach((sel) => {
      const el = $(sel);
      if (el && !el.hidden) el.dataset.state = 'closed';
    });
    overlay.dataset.state = 'closed';
    S9.closeTimer = setTimeout(S9.finishClose, S9.presence.exitMs());
  } else {
    S9.finishClose();
  }
  S9.state.paletteOpen = false;
  S9.state.drawerOpen = false;
  S9.state.modal = null;
  if (S9.state.status === 'SCANNING') { S9.state.status = S9.state.locked ? 'LOCKED' : 'IDLE'; S9.statusText(); }
};

S9.updateTuneDom = () => {
  const s = S9.state;
  const pct = clamp((s.freq - 1.8) / 26.2, 0, 1);
  const deg = -135 + pct * 270;
  const on = Math.round(pct * 23);
  $$('.s9-knob-pointer').forEach(el => { el.style.transform = `rotate(${deg}deg)`; });
  $$('.s9-knob-ticks').forEach(box => $$('i', box).forEach((el, i) => { el.dataset.on = i === on ? '1' : '0'; }));
  $$('.s9-knob').forEach(el => { el.setAttribute('aria-valuenow', s.freq.toFixed(3)); });
  $$('.s9-slider').forEach((sl) => {
    const pos = (pct * 100).toFixed(2) + '%';
    const fill = $('.s9-slider-fill', sl);
    const thumb = $('.s9-slider-thumb', sl);
    const bubble = $('.s9-slider-bubble', sl);
    if (fill) fill.style.width = pos;
    if (thumb) thumb.style.left = pos;
    if (bubble) {
      bubble.style.left = pos;
      bubble.textContent = `${s.freq.toFixed(3)} MHz${s.locked ? ' · LOCK' : ''}`;
    }
    sl.dataset.locked = s.locked ? '1' : '0';
  });
  $$('[data-freq]').forEach((el) => {
    const unit = el.textContent.includes('MHz') ? ' MHz' : '';
    el.textContent = s.freq.toFixed(3) + unit;
  });
  S9.statusText();
};

S9.tune = (next) => {
  const s = S9.state;
  s.freq = clamp(Math.round(Number(next) * 1000) / 1000, 1.8, 28);
  if (!s.locked && !s.scanning) s.status = 'IDLE';
  S9.updateTuneDom();
};

S9.tuneFromSlider = (sl, clientX) => {
  const box = sl.getBoundingClientRect();
  const pct = clamp((clientX - box.left) / box.width, 0, 1);
  S9.tune(1.8 + pct * 26.2);
};

S9.scan = () => {
  const s = S9.state;
  if (s.scanning) return;
  s.scanning = true;
  s.locked = false;
  s.status = 'SCANNING';
  S9.render();
  let i = 0;
  const step = () => {
    const cols = $$('.s9-sp-col');
    cols.forEach((c, j) => { c.dataset.hit = j <= i ? '1' : '0'; });
    i += 1;
    if (i < 8) setTimeout(step, S9.motion.scanStep);
  };
  step();
  setTimeout(() => {
    s.scanning = false;
    s.locked = true;
    s.status = 'LOCKED';
    s.sValue = clamp(s.sValue + 1, 1, 11);
    S9.render();
    S9.toast(`LOCKED · ${s.freq.toFixed(3)} MHz · S${Math.min(s.sValue, 9)}`);
  }, S9.motion.scanTotal);
};

S9.homeFx = { observer: null, onScroll: null, clock: null, raf: 0, ticking: false, scroller: null };
// 移动端预览里内容在手机屏内滚动，视差 / 浮现 / 循环暂停都要跟着这个容器走。
S9.homeScroller = () => $('.s9-mobile-screen') || $('.s9-canvas');
/* 错题本图表 → 列表：只改行 hidden 与计数文案，不调 S9.render() */
S9.applyMistakeFilter = () => {
  const { dueDay, mistakeCat, dueOnly } = S9.state;
  let n = 0;
  $$('#board tr[data-mistake-row]').forEach(r => {
    const ok = (dueDay < 0 || Number(r.dataset.day) === dueDay)
      && (mistakeCat === '全部' || r.dataset.cat === mistakeCat)
      && (!dueOnly || r.dataset.due === '1');
    r.hidden = !ok;
    if (ok) n += 1;
  });
  const count = $('#mistake-count');
  if (count) {
    count.textContent = `${n} 条示例 / 共 32 条 · ${dueDay < 0 ? '全部日期' : '指定日'} / ${mistakeCat} / ${dueOnly ? '只看待复习' : '全部状态'}`;
  }
  const hint = $('#mistake-hint');
  if (hint) hint.textContent = n === 0 ? 'NO RESULT · 清除筛选条件' : `已筛出 ${n} 条，按最近答错排序`;
};

S9.stopHome = () => {
  const fx = S9.homeFx;
  if (fx.observer) { fx.observer.disconnect(); fx.observer = null; }
  if (fx.onScroll) {
    (fx.scroller || $('.s9-canvas')).removeEventListener('scroll', fx.onScroll);
    fx.onScroll = null;
  }
  if (fx.clock) { clearInterval(fx.clock); fx.clock = null; }
  if (fx.raf) { cancelAnimationFrame(fx.raf); fx.raf = 0; }
  fx.ticking = false;
};

S9.playHome = (enter) => {
  S9.stopHome();
  const root = $('#board .s9-home');
  if (!root) return;
  const scroller = S9.homeScroller();
  S9.homeFx.scroller = scroller;
  const reduced = S9.isReduced();
  if (enter) S9.homeRevealed = new Set();

  // 首帧编排的错峰延迟按列号写：瀑布从最后一列往前亮、频谱柱从左往右长起。
  $$('.s9-wf-row', root).forEach((row) => {
    const cells = $$('.s9-wf-cell', row);
    cells.forEach((cell, c) => {
      cell.style.animationDelay = `${60 + (cells.length - 1 - c) * 7}ms`;
    });
  });
  $$('.s9-sp-col', root).forEach((col, c) => {
    const bar = $('.s9-sp-bar', col);
    if (bar) bar.style.animationDelay = `${80 + c * 45}ms`;
  });
  const liveCards = $$('.s9-home-live-card', root);
  const waveMs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dur-live')) || 2400;
  liveCards.forEach((card, c) => {
    const bars = $$('.s9-chart-bar', card);
    // 负相位：同卡内 7 根依次错开、卡与卡再错开一点，动画一开始就是一整条流动波形
    bars.forEach((b, i) => {
      b.style.animationDelay = `${-Math.round(c * waveMs / 9 + i * waveMs / bars.length)}ms`;
    });
  });
  const clock = $('[data-home-clock]', root);
  const tickClock = () => {
    if (clock) clock.textContent = `${new Date().toISOString().slice(11, 16)} UTC`;
  };
  tickClock();

  const hero = $('.s9-home-hero', root);
  const reveals = $$('[data-home-reveal]', root);
  reveals.forEach((el) => {
    if (reduced || S9.homeRevealed.has(el.dataset.revealKey)) el.dataset.reveal = 'in';
  });
  if (reduced) S9.homeRevealed = new Set(reveals.map(el => el.dataset.revealKey));

  // root 是设计板的滚动容器而非 window；滚出视口时循环电波暂停。
  if (window.IntersectionObserver) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const el = entry.target;
        if (el === hero) {
          root.dataset.offscreen = entry.isIntersecting ? '0' : '1';
          return;
        }
        // 实时波形跟自己这一块的可见性走，不跟 Hero 一起停。
        if (el.dataset.revealKey === 'live') el.dataset.liveOff = entry.isIntersecting ? '0' : '1';
        if (entry.isIntersecting && el.dataset.reveal !== 'in') {
          el.dataset.reveal = 'in';
          S9.homeRevealed.add(el.dataset.revealKey);
          if (el.dataset.revealKey !== 'live') observer.unobserve(el);
        }
      });
    }, { root: scroller, rootMargin: '0px 0px 40px 0px', threshold: .01 });
    reveals.forEach(el => observer.observe(el));
    if (hero) observer.observe(hero);
    S9.homeFx.observer = observer;
  } else {
    reveals.forEach(el => { el.dataset.reveal = 'in'; });
  }

  // 三层视差：rAF 合帧，只写 transform / opacity 两个属性，不整体替换内联样式。
  const copy = $('.s9-home-copy', root);
  const art = $('.s9-home-art', root);
  const eq = $('.s9-home-eq', root);
  const fx = S9.homeFx;
  const apply = () => {
    fx.raf = 0;
    fx.ticking = false;
    const y = S9.isReduced() ? 0 : clamp(scroller.scrollTop, 0, 900);
    if (copy) {
      copy.style.transform = `translateY(${(-y * .18).toFixed(1)}px)`;
      copy.style.opacity = Math.max(.45, 1 - y / 1100).toFixed(2);
    }
    if (art) {
      art.style.transform = `translateY(${(y * .30).toFixed(1)}px) scale(${(1 + y * .0004).toFixed(3)})`;
    }
    if (eq) {
      eq.style.transform = `translateY(${(y * .15).toFixed(1)}px)`;
      eq.style.opacity = Math.max(.2, 1 - y / 900).toFixed(2);
    }
  };
  fx.onScroll = () => {
    if (fx.ticking) return;
    fx.ticking = true;
    fx.raf = requestAnimationFrame(apply);
  };
  scroller.addEventListener('scroll', fx.onScroll, { passive: true });
  apply();

  // 实时读数：UTC 每秒；波形起伏完全交给 CSS 合成层行波，每 3s 只轮换峰值卡，
  // 不再写 height 触发 flex 重排，也不与 transform 动画抢同一帧。
  let beat = 0;
  fx.clock = setInterval(() => {
    if (!$('#board .s9-home') || S9.isReduced()) return;
    tickClock();
    beat += 1;
    if (beat % 3 !== 0) return;
    liveCards.forEach((card, i) => { card.dataset.liveOn = i === (beat / 3) % liveCards.length ? '1' : '0'; });
  }, S9.motion.tick);
};

// 示波屏按面板实际像素宽度重采样：viewBox 与 viewport 1:1，波形 / 噪尖 / 游标
// 都不再被横向拉伸；标注层用百分比定位，与 480 基准一一对应，无需重算。
S9.fitScopes = (root = document) => {
  $$('.s9-scope[data-scope]', root).forEach((box) => {
    const svg = $('svg', box);
    const w = svg && Math.round(box.clientWidth);
    if (!w || w < 2) return;
    const h = Number(box.dataset.scopeH);
    const filter = box.dataset.scopeFilter === '1';
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const paths = $$('path', svg);
    if (paths[0]) paths[0].setAttribute('d', F.wave(3, 10, h - 30, filter, w));
    if (paths[1]) paths[1].setAttribute('d', F.wave(7, 26, h / 2, filter, w));
    const k = w / 480;
    $$('line[data-spike]', svg).forEach((line) => {
      const x = (Number(line.dataset.spike) * k).toFixed(1);
      line.setAttribute('x1', x);
      line.setAttribute('x2', x);
    });
    const cursor = $('line[data-cursor]', svg);
    if (cursor) {
      const x = (236 * k).toFixed(1);
      cursor.setAttribute('x1', x);
      cursor.setAttribute('x2', x);
    }
  });
};

S9.animateCounts = (root = document) => {
  if (S9.isReduced()) return;
  $$('[data-count]', root).forEach((el) => {
    const raw = el.dataset.count;
    const hit = raw.match(/^(.*?)([\d][\d\s.]*)(.*)$/);
    if (!hit) return;
    const target = Number(hit[2].replace(/[\s]/g, ''));
    if (!Number.isFinite(target)) return;
    const decimals = (hit[2].split('.')[1] || '').length;
    const spaced = hit[2].includes(' ');
    let step = 0;
    const id = setInterval(() => {
      if (!el.isConnected) { clearInterval(id); return; }
      step += 1;
      const t = step / S9.motion.countSteps;
      const v = target * (1 - Math.pow(1 - t, 3));
      let val = decimals ? v.toFixed(decimals) : String(Math.round(v));
      if (spaced) val = String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      el.textContent = hit[1] + val + hit[3];
      if (step >= S9.motion.countSteps) clearInterval(id);
    }, S9.motion.countFrame);
  });
};

S9.buildPrint = () => {
  S9.pkLayerSweep();

      ${F.head(p)}<div class="s9-board-body">${S9.B[p.id]()}</div>
    </section>`).join('');
};

S9.printAll = () => {

let examTick = null;
S9.toggleExamTimer = () => {
  const s = S9.state;
  s.examRunning = !s.examRunning;
  if (examTick) { clearInterval(examTick); examTick = null; }
  if (s.examRunning) {
    examTick = setInterval(() => {
      s.examSeconds = Math.max(0, s.examSeconds - 1);
      const time = `${pad(Math.floor(s.examSeconds / 60))}:${pad(s.examSeconds % 60)}`;
      $$('[data-exam-timer]').forEach(el => { el.textContent = time; });
      if (s.examSeconds <= 300) {
        $$('[data-danger]').forEach(el => {
          el.dataset.danger = '1';
          el.textContent = '剩余 05:00';
        });
      }
      if (s.examSeconds === 0) { clearInterval(examTick); examTick = null; s.examRunning = false; }
    }, S9.motion.tick);
  }
  S9.render();
  S9.toast(s.examRunning ? 'TX WINDOW · 计时开始' : '倒计时已暂停');
};

/* dock 的「更多」是移动端唯一的路由目录入口：顶栏不再有「更多」触发器，
   所以触发者就是 dock 按钮本身（收起时焦点也还给它）；面板归位容器仍是原来的
   .s9-frame-more / .s9-more-portal —— 后者给 12 张没有 F.frame 的规格 / 组件板用。 */
S9.moreToggle = (source) => {
  const panel = S9.pkPanelFor('frame-more-panel');
  if (!panel) return;
  const open = !!(panel.__pkMounted && panel.dataset.state === 'open');
  const pop = $('#board .s9-frame-more') || $('.s9-more-portal');
  if (open) S9.pkUnmount(panel);
  else {
    // 顶栏搜索 icon 与 dock「更多」是两个不同浮层，展开目录前先收起可能开着的屏内全站搜索
    const phone = $('#mobile-search');
    if (phone && phone.dataset.open === '1') phone.dataset.open = '0';
    S9.pkMount(panel, source, pop);
    S9.syncPortalA11y();
  }
  source.setAttribute('aria-expanded', String(!open));
};

S9.onAction = (act, el, ev) => {
  const s = S9.state;
  switch (act) {
    case 'go': S9.setBoard(el.dataset.board); break;
    case 'scan': S9.scan(); break;
    case 'grid': s.grid = s.grid ? 0 : 1; S9.syncChrome(); if (s.drawerOpen) S9.openDrawer(); break;
    case 'mobile-view': {
      s.mobile = s.mobile ? 0 : 1;
      S9.render();
      S9.toast(s.mobile ? `移动端预览 · ${s.mobileWidth}px · 换板后保持` : '已回到桌面视图');
      break;
    }
    case 'mobile-width': {
      s.mobileWidth = Number(el.dataset.w);
      s.mobile = 1;
      S9.render();
      S9.toast(`移动端视口 · ${s.mobileWidth}px`);
      break;
    }
    case 'reduce':
      s.reduce = s.reduce ? 0 : 1;
      S9.syncChrome();
      if (s.board === 'home') S9.playHome(false);
      if (s.drawerOpen) S9.openDrawer();
      S9.toast(s.reduce ? '动效降级 · 首页静止终态' : '动效恢复 · 120/180/320ms');
      break;
    case 'theme': s.theme = s.theme === 'dark' ? 'light' : 'dark'; S9.syncChrome(); if (s.drawerOpen) S9.openDrawer(); break;
    case 'print': S9.printAll(); break;
    case 'palette': S9.openPalette(); break;
    case 'drawer': S9.openDrawer(); break;
    case 'close': S9.closeAll(); break;
    case 'lang': s.lang = el.dataset.lang; S9.render(); if (s.drawerOpen) S9.openDrawer(); break;
    case 'style': S9.toast(el.dataset.style === 'modern' ? 'MODERN · 当前设计板' : '像素风零影响 · 本板不切换'); break;
    case 'palette-color': {
      const order = ['default', 'mono', 'warm'];
      const idx = order.indexOf(s.palette);
      s.palette = order[(idx + 1) % order.length];
      S9.render();
      if (s.drawerOpen) S9.openDrawer();
      S9.toast(`数据色阶 · ${s.palette.toUpperCase()}`);
      break;
    }
    case 'band': s.band = el.dataset.band; s.status = s.locked ? 'LOCKED' : 'IDLE'; S9.render(); S9.toast(`BAND ${s.band} · 频谱重排 180ms`); break;
    case 'meter': s.sValue = Number(el.dataset.s); S9.render(); S9.toast(`S 表读数 S${Math.min(s.sValue, 9)}${s.sValue > 9 ? '+20' : ''}`); break;
    case 'choice': {
      // 选项选中是基础控件换态：就地改属性，让 180ms 过渡真正触发，不重建整板。
      s.choice = el.dataset.choice;
      s.judged = null;
      $$('#board .s9-option[data-act="choice"]').forEach(x => {
        x.dataset.state = x === el ? 'on' : '';
        x.setAttribute('aria-pressed', String(x === el));
      });
      const explain = $('#board .s9-explain');
      if (explain) explain.remove();
      break;
    }
    case 'submit': {
      if (!s.choice) { S9.toast('先选中一个选项 · 1–4 可快捷选择'); break; }
      s.judged = s.choice === 'A' ? 'right' : 'wrong';
      s.sValue = clamp(s.sValue + (s.judged === 'right' ? 1 : -1), 1, 11);
      S9.render();
      S9.toast(s.judged === 'right' ? '判对 · 信号清晰 · S 表上扬一格' : '判错 · QRM 已写入错题本');
      break;
    }
    case 'next-q': s.question = clamp(s.question + 1, 1, 40); s.choice = null; s.judged = null; S9.render(); break;
    case 'prev-q': s.question = clamp(s.question - 1, 1, 40); s.choice = null; s.judged = null; S9.render(); break;
    case 'exam-choice': s.examChoice = el.dataset.choice; S9.render(); break;
    case 'exam-cell': s.examAnswers = clamp(Number(el.dataset.n) - 1, 0, 40); S9.render(); break;
    case 'exam-submit': S9.openModal(); break;
    case 'cancel-exam': S9.closeAll(); break;
    case 'confirm-exam': s.examPhase = 'result'; S9.closeAll(); S9.render(); S9.toast('交卷完成 · 88 / 100 · PASS'); break;
    case 'exam-back': s.examPhase = 'window'; S9.render(); break;
    case 'exam-timer': S9.toggleExamTimer(); break;

      const detail = $('#site-search-detail');
      if (detail) detail.hidden = true;
      const phone = $('#mobile-search-results');
      if (phone) phone.innerHTML = S9.searchRows('', 8, src);
      break;
    }
    case 'site-search': {
      S9.state.searchSrc = '全部';
      const chips = $$('[data-act="search-src"]');
      chips.forEach((x, i) => { x.dataset.on = i === 0 ? '1' : '0'; });
      const input = $('#site-search-input');
      if (input) { input.value = 'QRM'; input.dispatchEvent(new Event('input', { bubbles: true })); input.focus(); }
      break;
    }
    // 错题本：图表全部有字段，点一下就地筛列表
    case 'due-pick': {
      const d = Number(el.dataset.day);
      S9.state.dueDay = S9.state.dueDay === d ? -1 : d;
      $$('[data-act="due-pick"]').forEach(x => {
        x.dataset.on = Number(x.dataset.day) === S9.state.dueDay ? '1' : '0';
      });
      S9.applyMistakeFilter();
      break;
    }
    case 'cat-pick': {
      const cat = el.dataset.cat;
      S9.state.mistakeCat = S9.state.mistakeCat === cat ? '全部' : cat;
      $$('[data-act="cat-pick"]').forEach(x => {
        const on = x.dataset.cat === S9.state.mistakeCat
          || (S9.state.mistakeCat === '全部' && x.dataset.cat === '全部');
        x.dataset.on = on ? '1' : '0';
      });
      S9.applyMistakeFilter();
      break;
    }
    case 'due-only': {
      S9.state.dueOnly = !S9.state.dueOnly;
      el.dataset.on = S9.state.dueOnly ? '1' : '0';
      el.setAttribute('aria-checked', String(S9.state.dueOnly));
      S9.applyMistakeFilter();
      break;
    }
    case 'heat-pick': {
      $$('[data-act="heat-pick"]').forEach(x => { x.dataset.pick = x === el ? '1' : '0'; });
      S9.toast(`${el.dataset.domain} / ${el.dataset.topic} · ${el.dataset.n} 题`);
      break;
    }
    case 'row-pick': {
      $$('#board tr[data-mistake-row]').forEach(x => { x.dataset.pick = x === el ? '1' : '0'; });
      S9.toast(`LOCK · ${el.dataset.pcode}`);
      break;
    }
    default: break;
  }
};

document.addEventListener('click', (ev) => {
  const target = ev.target instanceof Element ? ev.target : null;
  // 点浮层外任意处收起 Picker；手机屏内的路由 Sheet 不算「外部」，否则点条目会先被收起
  if (target && !target.closest('.s9-pk-layer')
    && !target.closest('.s9-mobile-shell > .s9-pk-panel')
    && !target.closest('[data-act="pk-toggle"]')
    && !target.closest('[data-act="dock-nav"][data-board="palette"]')) S9.pkCloseAll();
  const el = target && target.closest('[data-act]');
  if (el && !el.disabled) S9.ripple(ev.clientX, ev.clientY);
  if (ev.target.id === 'overlay') { S9.closeAll(); return; }
  if (!el) return;
  if (el.disabled) return;
  S9.onAction(el.dataset.act, el, ev);
  // 屏内 Dialog / FAB 抽屉由 data-open 驱动，交互后同步 inert 与 aria-hidden
  S9.syncPortalA11y();
});

document.addEventListener('input', (ev) => {
  // 全站路由目录：按名称 / 路径 / 分组就地过滤，整组无命中才隐藏组块；
  // 高度变了要重新 clamp 面板，否则筛选后面板底边会落到视口外。
  if (ev.target.dataset && ev.target.dataset.moreSearch) {
    const q = String(ev.target.value).trim().toLowerCase();
    const panel = ev.target.closest('.s9-frame-more-panel');
    if (panel) {
      $$('.s9-frame-more-route', panel).forEach((row) => {
        row.hidden = q !== '' && !row.dataset.name.toLowerCase().includes(q);
      });
      $$('.s9-frame-more-group', panel).forEach((group) => {
        const rows = $$('.s9-frame-more-route', group);
        group.hidden = rows.length > 0 && rows.every(r => r.hidden);
      });
      const empty = $('.s9-frame-more-empty', panel);
      if (empty) empty.hidden = $$('.s9-frame-more-group', panel).some(g => !g.hidden);
      // 换了关键词就从中间区顶部看起，别让用户停在上一轮滚到的位置
      const body = $('.s9-frame-more-body', panel);
      if (body) body.scrollTop = 0;
      if (panel.__pkMounted) S9.pkPlace(panel);
    }
    return;
  }
  // 目录搜索：按名称就地过滤，隐藏行不卸载，清掉关键词即全部回来。
  const dirId = ev.target.dataset && ev.target.dataset.dirSearch;
  if (dirId) {
    const q = String(ev.target.value).trim().toLowerCase();
    $$(`[data-dir="${dirId}"] .s9-dir-sub-item`).forEach((item) => {
      item.hidden = q !== '' && !item.dataset.name.toLowerCase().includes(q);
    });
    return;
  }
  if (ev.target.id === 'mobile-search-input') {
    const box = $('#mobile-search-results');
    if (box) box.innerHTML = S9.searchRows(ev.target.value, 8, S9.state.searchSrc);
    return;
  }
  if (ev.target.id === 'site-search-input') {
    const box = $('#site-search-results');
    if (box) box.innerHTML = S9.searchRows(ev.target.value, 8, S9.state.searchSrc);
    const detail = $('#site-search-detail');
    if (detail) detail.hidden = true;
    return;
  }
  if (ev.target.id !== 'palette-query') return;
  const s = S9.state;
  s.paletteQuery = ev.target.value;
  s.paletteIndex = 0;
  const box = $('#palette-results');
  if (box) box.innerHTML = S9.paletteResults();
  const count = $('#palette-count');
  const state = $('#palette-state');
  const label = s.paletteQuery ? 'SCANNING' : 'IDLE';
  if (count) count.textContent = `${S9.filtered().length} 条结果 · ↑↓ 选择 · ↵ 锁定 · Esc 收束`;
  if (state) state.textContent = label;
  $('#palette').dataset.state = S9.stateToken(label);
  if (s.status !== 'LOCKED') s.status = s.paletteQuery ? 'SCANNING' : 'IDLE';
  S9.statusText();
});

let knobDrag = null;
let sliderDrag = null;
document.addEventListener('pointerdown', (ev) => {
  const knob = ev.target.closest('.s9-knob');
  if (knob) {
    knobDrag = { startY: ev.clientY, startFreq: S9.state.freq };
    knob.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    return;
  }
  const sl = ev.target.closest('.s9-slider');
  if (sl) {
    sliderDrag = sl;
    sl.setPointerCapture(ev.pointerId);
    S9.tuneFromSlider(sl, ev.clientX);
    ev.preventDefault();
  }
});
document.addEventListener('pointermove', (ev) => {
  if (knobDrag) S9.tune(knobDrag.startFreq + (knobDrag.startY - ev.clientY) * .06);
  if (sliderDrag) S9.tuneFromSlider(sliderDrag, ev.clientX);
});
document.addEventListener('pointerup', () => { knobDrag = null; sliderDrag = null; });
document.addEventListener('pointercancel', () => { knobDrag = null; sliderDrag = null; });
document.addEventListener('wheel', (ev) => {
  const knob = ev.target.closest('.s9-knob');
  if (!knob) return;
  ev.preventDefault();
  S9.tune(S9.state.freq - Math.sign(ev.deltaY) * .1);
}, { passive: false });

document.addEventListener('keydown', (ev) => {
  const s = S9.state;
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === 'k') { ev.preventDefault(); S9.openPalette(); return; }
  if (ev.key === 'Escape') {
    // 只关最上层：打开的 Picker 面板优先收起，其余交给 closeAll
    if (S9.pkMounted().some(p => p.dataset.state === 'open')) { S9.pkCloseAll(); return; }
    S9.closeAll();
    return;
  }
  // Picker 键盘契约：焦点留触发器，游标靠 data-active + aria-activedescendant
  const openPanel = S9.pkMounted().find(x => x.dataset.state === 'open');
  // 全站路由目录自带筛选框：焦点在输入框里时把方向键 / Enter 还给输入控件，Tab 仍收起面板
  if (openPanel && openPanel.dataset.pkKind === 'nav'
    && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    if (ev.key === 'Tab') S9.pkCloseAll(true);
    return;
  }
  if (openPanel) {
    const opts = $$('[role="option"]:not([disabled])', openPanel).filter(o => !o.hidden);
    const combo = openPanel.__pkTrigger;
    const cur = Math.max(0, opts.findIndex(o => o.dataset.active === '1'));
    // Tab 离开即收起，焦点仍按默认顺序走向下一个控件
    if (ev.key === 'Tab') { S9.pkCloseAll(true); return; }
    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key)) {
      ev.preventDefault();
      if (!opts.length) return;
      const n = ev.key === 'Home' ? 0 : ev.key === 'End' ? opts.length - 1
        : clamp(cur + (ev.key === 'ArrowDown' ? 1 : -1), 0, opts.length - 1);
      opts.forEach((o, i) => { o.dataset.active = i === n ? '1' : '0'; });
      if (!opts[n].id) opts[n].id = `pk-opt-${n}`;
      if (combo) combo.setAttribute('aria-activedescendant', opts[n].id);
      opts[n].scrollIntoView({ block: 'nearest' });
      return;
    }
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      const target = opts[cur] || opts[0];
      if (target) target.click();
      return;
    }
  }
  // 拖放区是 role=button 的 div：补齐 Enter / Space 激活
  const drop = document.activeElement;
  if ((ev.key === 'Enter' || ev.key === ' ') && drop && drop.classList.contains('s9-drop')) {
    ev.preventDefault();
    drop.click();
    return;
  }
  if (ev.key === 'Tab') {
    const phone = $('#mobile-search');
    const layer = ['#palette', '#drawer', '#modal'].map(sel => $(sel)).find(el => el && !el.hidden)
      || (phone && phone.dataset.open === '1' ? phone : null);
    if (layer) {
      const items = $$('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex="0"]', layer)
        .filter(el => el.offsetParent !== null);
      if (items.length) {
        const first = items[0];
        const last = items[items.length - 1];
        const active = document.activeElement;
        if (!layer.contains(active) || active === layer) { ev.preventDefault(); first.focus(); }
        else if (ev.shiftKey && active === first) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && active === last) { ev.preventDefault(); first.focus(); }
      }
      return;
    }
  }
  if (s.paletteOpen) {
    const phone = $('#mobile-search');
    if (phone && phone.dataset.open === '1') {
      const rows = $$('.s9-dlg-row', phone);
      const idx = Math.max(0, rows.findIndex(r => r.dataset.on === '1'));
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const next = clamp(idx + (ev.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, rows.length - 1));
        rows.forEach((r, i) => { r.dataset.on = i === next ? '1' : '0'; });
        return;
      }
      if (ev.key === 'Enter') {
        ev.preventDefault();
        const row = rows[idx];
        if (row) { S9.closeAll(); S9.setBoard(row.dataset.board); }
        return;
      }
      return;
    }
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      const n = S9.filtered().length;
      s.paletteIndex = clamp(s.paletteIndex + (ev.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, n - 1));
      const box = $('#palette-results');
      if (box) box.innerHTML = S9.paletteResults();
      return;
    }
    if (ev.key === 'Enter') {
      ev.preventDefault();
      const item = S9.filtered()[s.paletteIndex];
      if (item) {
        S9.closeAll();
        if (item.board) S9.setBoard(item.board);
        S9.toast(`LOCKED · ${item.name} · ${item.path}`);
      }
      return;
    }
    return;
  }
  const ae = document.activeElement;
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName)
    || ae.isContentEditable || ae.getAttribute('role') === 'combobox' || ev.isComposing;
  if (typing) return;
  if (ev.key.toLowerCase() === 'm') {
    S9.onAction('mobile-view', document.body, ev);
    return;
  }
  const tuning = document.activeElement.classList.contains('s9-knob') || document.activeElement.classList.contains('s9-slider');
  if (tuning && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) {
    ev.preventDefault();
    const d = (ev.key === 'ArrowRight' || ev.key === 'ArrowUp' ? 1 : -1) * (ev.key === 'ArrowUp' || ev.key === 'ArrowDown' ? .5 : .1);
    S9.tune(s.freq + d);
    return;
  }
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    ev.preventDefault();
    const i = S9.pages.findIndex(p => p.id === s.board);
    const next = clamp(i + (ev.key === 'ArrowRight' ? 1 : -1), 0, S9.pages.length - 1);
    S9.setBoard(S9.pages[next].id);
    return;
  }
  if (s.board === 'practice' && ['1', '2', '3', '4'].includes(ev.key)) {
    const k = ['A', 'B', 'C', 'D'][Number(ev.key) - 1];
    const target = $(`[data-act="choice"][data-choice="${k}"]`);
    if (target) S9.onAction('choice', target, ev);
    return;
  }
  if (s.board === 'practice' && ev.key === 'Enter') {
    S9.onAction('submit', document.body, ev);
  }
});

window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#/', '');
  if (id && id !== S9.state.board && S9.pages.some(p => p.id === id)) S9.setBoard(id);
});

window.addEventListener('beforeprint', () => {
  document.documentElement.dataset.anim = 'off';
  if ($('#print-stack').innerHTML.trim() === '') S9.buildPrint();
});
window.addEventListener('afterprint', () => {
  S9.syncChrome();
  // 30 页副本只服务打印，打印完清栈，避免同名 landmark 常驻 DOM
  $('#print-stack').innerHTML = '';
});

const initial = location.hash.replace('#/', '');
if (S9.pages.some(p => p.id === initial)) S9.state.board = initial;
// 顶栏控件与其他界面控件同源：静态 HTML 只留容器，控件由 F.barTools() 渲染
$('.s9-bar-tools').innerHTML = F.barTools();
S9.render();

// 画布或手机屏滚动、视口变化时，已挂载的面板跟着触发器重定位
const placeOpenPanels = () => S9.pkMounted().forEach(S9.pkPlace);
document.addEventListener('scroll', placeOpenPanels, { passive: true, capture: true });
window.addEventListener('resize', placeOpenPanels);

let fitRaf = 0;
window.addEventListener('resize', () => {
  if (fitRaf) return;
  fitRaf = requestAnimationFrame(() => {
    fitRaf = 0;
    S9.fitScopes($('#board'));
  });
});

</script>
</body>
</html>
