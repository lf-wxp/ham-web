[package]
name = "ham-web-core"
description = "业余无线电：题目模型、内容指纹、考试规则与分类体系（前端与工具链共享）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ham-web-nec.workspace = true
# `mode_audio::to_wav` 只是 `ham_web_wav::encode` 的薄封装（WAV 编码只有一份实现）
ham-web-wav.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# 通话练习的报文格式要和 FT8 打包逻辑对拍（只在单测里用，运行时不依赖）。
# ft8 不依赖 core，所以没有循环。
[dev-dependencies]
ham-web-ft8.workspace = true

[lints]
workspace = true
