<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="业余无线电一站式平台：A/B/C 类题库练习、模拟考试、知识速查、通联日志与实时传播" />
    <!-- iOS Safari 用它给状态栏 / 顶部工具栏着色。只放一条、不带 media：明暗与配色方案都是用户在站内选的，
         按系统明暗二选一会在「系统浅色 + 站内深色」时露出一条浅色带。content 由下面的内联脚本按主题先写，
         挂载后 theme.rs 再按当前方案的 `--card`（顶栏底色）校准。 -->
    <meta name="theme-color" content="#FFF8E1" />

    <link rel="manifest" href="/manifest.json" />
    <!-- 字体预载**不写死在 head 里**，由下面的首屏脚本按界面风格注入：默认是像素风，
         它的字体（Fusion Pixel 等）有各自的 unicode-range 懒加载；无条件预载现代风的四个分片
         （Geist / Bricolage / Noto 中文展字第 0 片 / Plex Mono，共约 216KB）只会让像素风用户
         白花带宽、和 wasm 抢首访、还触发「preloaded but not used」告警。现代风用户则要预载：
         晚到会触发一次 font swap，中文回退与西文的行高不同，表现为「首屏内容上下跳几像素」。
         只预载必要分片：latin-ext、其余字重与中文续片都按 unicode-range 懒加载。 -->
    <!-- 图标：ICO 里打包了 16 / 32 / 48 三档（16px 是像素对齐的专用图形，母版缩到
         16px 会糊）；支持 SVG 的浏览器再拿一份矢量版。iOS 主屏图标与 PWA 的
         maskable 必须是四角不透明的满幅方形，圆角交给系统遮罩 —— 两者都出自
         `public/pwa-maskable.svg`。 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="业余无线电" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:title" content="业余无线电｜题库 · 知识 · 工具" />

    <meta property="og:url" content="__SITE_URL__/" />

    <!-- 首屏前应用主题，避免闪烁 -->
    <script>
      (() => {
        const root = document.documentElement;
        let stored = "system";
        try { stored = localStorage.getItem("theme") ?? "system"; } catch {}
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        // 只认 light / dark，其余（含手改的陌生值）一律按「跟随系统」：与 theme.rs 的
        // `Theme::parse` 同一口径，否则首屏与挂载后会各算出一个明暗。
        const resolved = stored === "dark" || stored === "light" ? stored : (prefersDark ? "dark" : "light");
        root.classList.toggle("dark", resolved === "dark");
        root.style.colorScheme = resolved;
        // 像素动效 / 易读字体：与 theme.rs 同一套存储键，首屏前先落到 <html>，避免字体与动画闪一下
        let motion = "on", readable = "off", scheme = "classic", uiStyle = "pixel";
        try {
          motion = localStorage.getItem("ui:pixelMotion") === "off" ? "off" : "on";
          readable = localStorage.getItem("ui:readableFont") === "on" ? "on" : "off";
          // 不认识的 id 在样式里没有对应的块，等价于经典方案；应用挂载后 theme.rs 会再规范化。
          const savedScheme = localStorage.getItem("ui:colorScheme");
          if (savedScheme && /^[a-z-]{1,24}$/.test(savedScheme)) scheme = savedScheme;
          // 界面风格（两套设计系统的开关）：只认这两个值，其余一律回退像素风。
          // 与 `crates/core/src/ui_style.rs` 的 `UiStyle::parse` 是两份实现（这里不能等 wasm），
          // 取值与回退策略必须逐字一致（两边都不 trim，也都区分大小写），改时两处一起改。
          if (localStorage.getItem("ui:uiStyle") === "modern") uiStyle = "modern";
        } catch {}
        root.setAttribute("data-pixel-motion", motion);
        root.setAttribute("data-readable-font", readable);
        root.setAttribute("data-scheme", scheme);
        root.setAttribute("data-ui-style", uiStyle);
        // 浏览器状态栏 / 工具栏的颜色：样式表还没加载、读不到 CSS 变量，所以按风格写死首屏值
        // （像素风取经典方案的顶栏色，现代风取 `--md-bg`）；其他配色方案由 theme.rs 挂载后校准。
        const barColor = uiStyle === "modern"
          ? (resolved === "dark" ? "#04050a" : "#f4f3ee")
          : (resolved === "dark" ? "#262B45" : "#FFF8E1");
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", barColor);
        // 字体预载：只给用得到的风格（见上方 head 里的说明）。
        const preload = (file) => {
          const link = document.createElement("link");
          link.rel = "preload";
          link.as = "font";
          link.type = "font/woff2";
          link.crossOrigin = "anonymous";
          link.href = "/fonts/" + file;
          document.head.appendChild(link);
        };
        // 只预载**首屏正文与标题**用到的三款：正文（geist）、展示标题（bricolage）、
        // 中文标题（noto-0）。等宽三档（plex 400/500/600）不进预载队列 —— 它们出现在
        // 日期 / 读数这类次要比重的文字里，`font-display: swap` 晚到不会遮挡内容，
        // 而预载一个 400 档也挡不住 500 / 600 的按需加载（实测首访仍会取这三档，共 30KB）。
        // 台账 P3；首访实测：6 个字体文件 / 241KB，预载 3 个（204KB）。
        // 中文展示字（100KB）只在中文界面预载：英 / 西语界面的标题是译文，中文只零散
        // 出现在正文里（`font-display: swap` + `Noto Sans SC Display Fallback` 的度量对齐
        // 兜住，见 `fonts.css`），不值得占 40% 的首屏字体预算。台账 P3。
        let locale = "zh";
        try { locale = localStorage.getItem("locale") || "zh"; } catch {}
        if (uiStyle === "modern") {
          const fonts = ["geist-latin", "bricolage-latin"];
          if (locale.startsWith("zh")) fonts.push("noto-sans-sc-display-0");
          fonts.forEach((name) => preload(name + ".woff2"));
        } else if (readable === "on") {
          preload("geist-latin.woff2");
        }
      })();
    </script>

    <!-- KaTeX 公式渲染（自托管，离线可用）：页面里出现 [data-tex] 节点时才按需注入脚本与样式，
         其他页面零开销。wasm 把 KaTeX 源写在节点的 data-tex 上，这里用 MutationObserver
         等节点出现 —— 不依赖 wasm 侧的任何时序（挂载 / 路由切换都覆盖）。
         加载或渲染失败就保留 Unicode 回退文本，绝不把页面弄坏。
         渲染结果按 TeX 原文缓存（再进公式页直接贴 HTML，不再排版），且每帧只花 BUDGET 毫秒，
         没渲染完的下一帧接着做：公式页上百条公式一次排完是一个上百毫秒的长任务。 -->
    <script>
      (() => {
        let state = "idle"; // idle → loading → ready；失败停在 failed（保留回退文本，不重试）
        let queued = false;
        const PENDING = "[data-tex]:not(.katex-done)";
        const BUDGET = 8;
        const cache = new Map();
        const render = () => {
          const start = performance.now();
          for (const el of document.querySelectorAll(PENDING)) {
            if (performance.now() - start > BUDGET) {
              schedule();
              return;
            }
            el.classList.add("katex-done");
            const tex = el.getAttribute("data-tex");
            try {
              let html = cache.get(tex);
              if (html === undefined) {
                html = window.katex.renderToString(tex, {
                  throwOnError: false,
                  displayMode: false,
                });
                cache.set(tex, html);
              }
              el.innerHTML = html;
            } catch {
              /* 保留回退文本 */
            }
          }
        };
        const load = () => {
          if (state !== "idle") return;
          state = "loading";
          const css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "/katex/katex.min.css";
          document.head.appendChild(css);
          const js = document.createElement("script");
          js.src = "/katex/katex.min.js";
          js.onload = () => {
            state = "ready";
            render();
          };
          js.onerror = () => {
            state = "failed";
          };
          document.head.appendChild(js);
        };
        const scan = () => {
          queued = false;
          if (!document.querySelector(PENDING)) return;
          if (state === "ready") render();
          else load();
        };
        // 观察者回调只登记一次 rAF：DOM 频繁变动的页面（波形 / 瀑布图）不会每次都扫描。
        const schedule = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(scan);
        };
        const start = () => {
          schedule();
          new MutationObserver(schedule).observe(document.body, {
            childList: true,
            subtree: true,
          });
        };
        // 内联脚本在 <head> 里同步执行，此时 body 还不存在，观察者要等 DOMContentLoaded。
        if (document.body) start();
        else document.addEventListener("DOMContentLoaded", start);
      })();
    </script>

    <!-- 致命错误兜底：wasm 加载失败或运行时 panic 时显示，不依赖 wasm 本身 -->
    <script>
      (() => {
        let shown = false;
        // 这里 wasm 还没加载（或已经崩了），不能走 i18n 词典，所以内联一份三语文案。语言选择与
        // 应用本身**严格一致**：只看用户保存的 `locale`（zh / en / es），没有就是中文 ——
        // 应用默认语言是中文、不看浏览器语言（`i18n::stored_locale`）。若这里改看 `navigator.language`，
        // 英文浏览器的用户在应用里看到中文，崩溃页却突然是英文。
        const TEXT = {
          zh: {
            desc: "本地数据（进度、错题、日志等）不受影响。可以重新加载页面；如果反复出现，建议先导出数据备份。",
            reload: "重新加载", backup: "导出数据备份", copy: "复制错误信息", copied: "已复制", details: "错误详情",
            loadFailed: "加载失败", unsupported: "浏览器不受支持",
            noWasm: "当前浏览器不支持 WebAssembly，请升级到最新版 Chrome / Edge / Safari / Firefox。",
            resource: "资源加载失败：",
          },
          en: {
            desc: "Your local data (progress, mistakes, logs, …) is not affected. Reload the page; if it keeps happening, export a data backup first.",
            reload: "Reload", backup: "Export data backup", copy: "Copy error info", copied: "Copied", details: "Error details",
            loadFailed: "Failed to load", unsupported: "Browser not supported",
            noWasm: "This browser does not support WebAssembly. Please upgrade to the latest Chrome / Edge / Safari / Firefox.",
            resource: "Resource failed to load: ",
          },
          es: {
            desc: "Tus datos locales (progreso, errores, registro, …) no se ven afectados. Recarga la página; si se repite, exporta antes una copia de seguridad.",
            reload: "Recargar", backup: "Exportar copia de seguridad", copy: "Copiar información del error", copied: "Copiado", details: "Detalles del error",
            loadFailed: "Error de carga", unsupported: "Navegador no compatible",
            noWasm: "Este navegador no admite WebAssembly. Actualiza a la última versión de Chrome / Edge / Safari / Firefox.",
            resource: "No se pudo cargar el recurso: ",
          },
        };
        const pickLang = () => {
          let saved = null;
          try { saved = localStorage.getItem("locale"); } catch {}
          return saved && TEXT[saved] ? saved : "zh";
        };
        const L = TEXT[pickLang()];
        const backup = () => {
          const map = {};
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              map[k] = localStorage.getItem(k);
            }
          } catch {}
          const d = new Date();
          const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([JSON.stringify(map)], { type: "application/json" }));
          a.download = `ham-backup-${stamp}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        };
        window.__hamFatal = (title, detail) => {
          if (shown) return;
          shown = true;
          document.getElementById("boot")?.remove();
          const box = document.createElement("div");
          box.id = "fatal";
          box.setAttribute("role", "alertdialog");
          box.setAttribute("aria-modal", "true");
          box.setAttribute("aria-labelledby", "fatal-title");
          box.setAttribute("aria-describedby", "fatal-desc");
          box.innerHTML = `
            <style>
              #fatal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: #f2e8cf; color: #1a1c2c; font: 14px/1.6 "Fusion Pixel", ui-monospace, "PingFang SC", "Microsoft YaHei", monospace; }
              .dark #fatal { background: #1a1c2c; color: #f4f4f4; }
              #fatal section { max-width: 440px; width: 100%; padding: 20px; background: #fff8e1; border: 4px solid #1a1c2c; box-shadow: 6px 6px 0 rgba(0, 0, 0, .35); }
              .dark #fatal section { background: #262b45; border-color: #94b0c2; }
              #fatal h1 { margin: 0 0 8px; font: 14px/1.5 "Press Start 2P", "Fusion Pixel", monospace; color: #b13e53; }
              .dark #fatal h1 { color: #ef7d57; }
              #fatal .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
              #fatal button { font: inherit; padding: 6px 14px; border: 2px solid #1a1c2c; background: #eadfc0; color: inherit; cursor: pointer; box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); }
              .dark #fatal button { border-color: #94b0c2; background: #333c57; }
              #fatal button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, .35); }
              #fatal button.primary { background: #3b5dc9; border-color: #1a1c2c; color: #f4f4f4; }
              #fatal button:focus-visible { outline: 2px dashed #3b5dc9; outline-offset: 2px; }
              .dark #fatal button:focus-visible { outline-color: #ffcd75; }
              #fatal pre { max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; padding: 8px; background: rgba(26, 28, 44, .12); border: 2px solid rgba(26, 28, 44, .3); }
              /* 现代风分支（本段在 JS 模板字符串里，注释中不能用反引号）：
                 与 #boot 同理 —— 不引外部字体、不读 --md-* 变量，错误发生时样式表与字体
                 都可能没到，颜色直接写死 tokens.css 里的取值。形态跟着现代按钮走：胶囊、
                 1px 描边、实心橙只给主行动，层级靠圆角与阴影而不是墨框与位移投影。 */
              html[data-ui-style="modern"] #fatal { background: #f4f3ee; color: #0a0b0d; font: 16px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
              html[data-ui-style="modern"].dark #fatal { background: #04050a; color: #f2f4fa; }
              html[data-ui-style="modern"] #fatal section { max-width: 460px; padding: 24px; background: #fffefb; border: 1px solid #e2e0d7; border-radius: 14px; box-shadow: 0 2px 8px -2px rgba(11, 13, 18, .1), 0 16px 36px -18px rgba(11, 13, 18, .25); }
              html[data-ui-style="modern"].dark #fatal section { background: #0b0d13; border-color: #222839; box-shadow: 0 2px 10px -2px rgba(0, 0, 0, .55), 0 18px 40px -20px rgba(0, 0, 0, .85); }
              html[data-ui-style="modern"] #fatal h1 { margin: 0 0 8px; font: 700 22px/1.3 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #b8340d; }
              html[data-ui-style="modern"].dark #fatal h1 { color: #ff8a63; }
              html[data-ui-style="modern"] #fatal p { margin: 0; color: #565b66; }
              html[data-ui-style="modern"].dark #fatal p { color: #8a92a6; }
              html[data-ui-style="modern"] #fatal .row { gap: 8px; margin: 20px 0 16px; }
              html[data-ui-style="modern"] #fatal button { height: 40px; padding: 0 18px; border: 1px solid #c3c1b6; border-radius: 999px; background: transparent; color: #0a0b0d; font: 600 13px/1 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; box-shadow: none; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease; }
              html[data-ui-style="modern"].dark #fatal button { border-color: #3a4460; color: #f2f4fa; }
              html[data-ui-style="modern"] #fatal button:hover { transform: translateY(-2px); background: rgba(255, 77, 31, .08); border-color: rgba(255, 77, 31, .34); color: #b8340d; }
              html[data-ui-style="modern"].dark #fatal button:hover { background: rgba(255, 106, 61, .12); border-color: rgba(255, 106, 61, .46); color: #ff8a63; }
              html[data-ui-style="modern"] #fatal button:active { transform: translateY(0); box-shadow: none; }
              html[data-ui-style="modern"] #fatal button:focus-visible { outline: 2px solid rgba(37, 64, 255, .5); outline-offset: 2px; }
              html[data-ui-style="modern"].dark #fatal button:focus-visible { outline-color: rgba(111, 140, 255, .7); }
              /* 主行动写在悬停规则之后：同权重下后者胜，避让「深色悬停浅橙底盖掉实心橙」。 */
              html[data-ui-style="modern"] #fatal button.primary { border-color: transparent; background: #ff4d1f; color: #1a0c05; box-shadow: 0 12px 32px -12px rgba(255, 77, 31, .55); }
              html[data-ui-style="modern"] #fatal button.primary:hover { border-color: transparent; background: #e8421a; color: #1a0c05; }
              html[data-ui-style="modern"].dark #fatal button.primary { background: #ff6a3d; color: #05060a; box-shadow: 0 12px 38px -10px rgba(255, 106, 61, .45); }
              html[data-ui-style="modern"].dark #fatal button.primary:hover { background: #ff7d54; color: #05060a; }
              html[data-ui-style="modern"] #fatal summary { color: #565b66; font-weight: 600; cursor: pointer; }
              html[data-ui-style="modern"].dark #fatal summary { color: #8a92a6; }
              html[data-ui-style="modern"] #fatal pre { margin: 8px 0 0; padding: 12px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; background: #ecebe4; border: 1px solid #e2e0d7; border-radius: 10px; }
              html[data-ui-style="modern"].dark #fatal pre { background: #12151f; border-color: #222839; }
            </style>
            <section>
              <h1 id="fatal-title"></h1>
              <p id="fatal-desc"></p>
              <div class="row">
                <button type="button" class="primary" data-act="reload"></button>
                <button type="button" data-act="backup"></button>
                <button type="button" data-act="copy"></button>
              </div>
              <details><summary></summary><pre></pre></details>
            </section>`;
          // 文案用 textContent 填：不把词典里的字符串拼进 innerHTML。
          box.querySelector("#fatal-desc").textContent = L.desc;
          box.querySelector('[data-act="reload"]').textContent = L.reload;
          box.querySelector('[data-act="backup"]').textContent = L.backup;
          box.querySelector('[data-act="copy"]').textContent = L.copy;
          box.querySelector("summary").textContent = L.details;
          box.querySelector("h1").textContent = title;
          box.querySelector("pre").textContent = `${detail}\n\n${location.href}\n${navigator.userAgent}`;
          box.addEventListener("click", (e) => {
            const act = e.target.closest("button")?.dataset.act;
            if (act === "reload") location.reload();
            if (act === "backup") backup();
            if (act === "copy") navigator.clipboard?.writeText(box.querySelector("pre").textContent).then(() => { e.target.textContent = L.copied; });
          });
          document.body.appendChild(box);
          box.querySelector("button")?.focus();
        };
        if (typeof WebAssembly !== "object") {
          addEventListener("DOMContentLoaded", () => window.__hamFatal(L.unsupported, L.noWasm));
          return;
        }
        const onBootError = (reason) => {
          if (document.getElementById("boot")) window.__hamFatal(L.loadFailed, String(reason?.stack ?? reason?.message ?? reason));
        };
        addEventListener("unhandledrejection", (e) => onBootError(e.reason));
        // 只关心本站资源：第三方脚本（如被广告拦截器拦下的广告）失败不影响使用
        const sameOrigin = (url) => { try { return new URL(url, location.href).origin === location.origin; } catch { return false; } };
        addEventListener("error", (e) => {
          const t = e.target;
          if (t instanceof HTMLScriptElement || t instanceof HTMLLinkElement) {
            const url = t.src || t.href;
            if (sameOrigin(url)) onBootError(`${L.resource}${url}`);
          } else if (e.error && sameOrigin(e.filename)) {
            onBootError(e.error);
          }
        }, true);
      })();
    </script>

    <!-- 首屏占位：wasm 下载 / 初始化期间显示，应用挂载后由 main.rs 移除 -->
    <div id="boot" role="status" aria-live="polite">
      <style>
        #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--background, #f2e8cf); color: var(--foreground, #1a1c2c); font: 14px/1.4 "Fusion Pixel", ui-monospace, "PingFang SC", "Microsoft YaHei", monospace; z-index: 50; }
        .dark #boot { color: var(--muted-foreground, #94b0c2); }
        #boot b { font: 14px/1.5 "Press Start 2P", "Fusion Pixel", monospace; color: var(--primary, #3b5dc9); letter-spacing: 0; text-shadow: 2px 2px 0 rgba(0, 0, 0, .3); }
        /* 读条：8 格，逐格点亮；steps() 让它是「读盘」而不是平滑进度 */
        #boot i { display: block; width: 160px; height: 16px; border: 4px solid var(--input, #1a1c2c); background: var(--pxl-field, #fffdf2); box-sizing: content-box; }
        #boot i::after { content: ""; display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--primary, #3b5dc9) 0 16px, transparent 16px 20px); animation: boot-fill 1.6s steps(8, end) infinite; }
        @keyframes boot-fill { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
        /* 现代风格的首屏占位：不引外部字体（此时 CSS 还没到），只把像素边框/读条换成中性形态，
           避免「切了 UI 还先看到一帧像素读盘」。颜色取现代令牌（样式表已在 head 里，`var()` 可用），
           回退值与 tokens.css 同值：否则占位是冷灰蓝、挂载后一跳变成暖白 / 近黑。 */
        html[data-ui-style="modern"] #boot { font: 14px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif; background: var(--md-bg, #f4f3ee); color: var(--md-fg-muted, #565b66); }
        html[data-ui-style="modern"] #boot b { font: 600 15px/1.4 system-ui, -apple-system, "PingFang SC", sans-serif; color: var(--md-fg, #0a0b0d); text-shadow: none; }
        html[data-ui-style="modern"] #boot i { width: 180px; height: 4px; border: 0; border-radius: 999px; background: var(--md-surface-2, #ecebe4); overflow: hidden; }
        html[data-ui-style="modern"] #boot i::after { background: var(--md-blue, #2540ff); animation: boot-fill-modern 1.1s ease-in-out infinite; }
        @keyframes boot-fill-modern { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
        html[data-ui-style="modern"].dark #boot { background: var(--md-bg, #04050a); color: var(--md-fg-muted, #8a92a6); }
        html[data-ui-style="modern"].dark #boot b { color: var(--md-fg, #f2f4fa); }
        html[data-ui-style="modern"].dark #boot i { background: var(--md-surface-2, #12151f); }
        html[data-ui-style="modern"].dark #boot i::after { background: var(--md-blue, #6f8cff); }
        /* 动效降级放在**最后**：现代风的 `#boot i::after`（特异性 1,1,3）比前面的降级规则
           （1,0,2 / 1,1,3 且写在前）更高或更晚，写在前面会被盖掉，系统「减少动态效果」与
           「像素动效：关」就都对现代风首屏失效。 */
        @media (prefers-reduced-motion: reduce) { html #boot i::after, html[data-ui-style="modern"] #boot i::after { animation: none; } }
        html[data-pixel-motion="off"] #boot i::after, html[data-pixel-motion="off"][data-ui-style="modern"] #boot i::after { animation: none; }
      </style>

    <!-- 首屏静态文案按已保存的界面语言切换：wasm 挂载前用户看到的就是自己选的语言。

    <script>
      (() => {
        const BOOT = {
          zh: {
            title: "业余无线电｜题库 · 知识 · 工具",
            desc: "业余无线电一站式平台：A/B/C 类题库练习、模拟考试、知识速查、通联日志与实时传播",
            app: "业余无线电",
            bootTitle: "业余无线电",
            bootMsg: "正在加载题库与工具…",
          },
          en: {
            title: "Ham Radio · Question Bank · Knowledge · Tools",
            desc: "An all-in-one amateur radio platform: Class A/B/C question-bank practice, mock exams, quick reference, contact logs and live propagation.",
            app: "Ham Radio",
            bootTitle: "Ham Radio",
            bootMsg: "Loading question bank and tools…",
          },
          es: {
            title: "Radioafición · Banco de preguntas · Conocimiento · Herramientas",
            desc: "Plataforma integral de radioafición: práctica del banco de preguntas A/B/C, exámenes simulados, consulta rápida, registro de contactos y propagación en vivo.",
            app: "Radioafición",
            bootTitle: "Radioafición",
            bootMsg: "Cargando banco de preguntas y herramientas…",
          },
        };
        let lang = "zh";
        try {
          const saved = localStorage.getItem("locale");
          if (saved && BOOT[saved]) lang = saved;
        } catch {}
        const L = BOOT[lang];
        document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
        document.title = L.title;
        const setMeta = (selector, value) => {
          const el = document.querySelector(selector);
          if (el) el.setAttribute("content", value);
        };
        setMeta('meta[name="description"]', L.desc);
        setMeta('meta[property="og:title"]', L.title);
        setMeta('meta[property="og:description"]', L.desc);
        setMeta('meta[name="twitter:title"]', L.title);
        setMeta('meta[name="twitter:description"]', L.desc);
        setMeta('meta[name="apple-mobile-web-app-title"]', L.app);
        const bootTitle = document.getElementById("boot-title");
        const bootMsg = document.getElementById("boot-msg");
        if (bootTitle) bootTitle.textContent = L.bootTitle;
        if (bootMsg) bootMsg.textContent = L.bootMsg;
      })();
    </script>
