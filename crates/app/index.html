    <!-- 首屏前应用主题，避免闪烁 -->
    <script>
      (() => {
        const root = document.documentElement;
        let stored = "system";
        try { stored = localStorage.getItem("theme") ?? "system"; } catch {}
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = stored === "system" ? (prefersDark ? "dark" : "light") : stored;
        root.classList.toggle("dark", resolved === "dark");
        root.style.colorScheme = resolved;
        // 此时样式表还没加载、读不到 CSS 变量，先用经典方案的顶栏色；其他方案由 theme.rs 挂载后校准。
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", resolved === "dark" ? "#262B45" : "#FFF8E1");
        // 像素动效 / 易读字体：与 theme.rs 同一套存储键，首屏前先落到 <html>，避免字体与动画闪一下
        let motion = "on", readable = "off", scheme = "classic";
        try {
          motion = localStorage.getItem("ui:pixelMotion") === "off" ? "off" : "on";
          readable = localStorage.getItem("ui:readableFont") === "on" ? "on" : "off";
          // 不认识的 id 在样式里没有对应的块，等价于经典方案；应用挂载后 theme.rs 会再规范化。
          const stored = localStorage.getItem("ui:colorScheme");
          if (stored && /^[a-z-]{1,24}$/.test(stored)) scheme = stored;
        } catch {}
        root.setAttribute("data-pixel-motion", motion);
        root.setAttribute("data-readable-font", readable);
        root.setAttribute("data-scheme", scheme);
      })();
    </script>

    <!-- KaTeX 公式渲染（自托管，离线可用）：页面里出现 [data-tex] 节点时才按需注入脚本与样式，
         其他页面零开销。wasm 把 KaTeX 源写在节点的 data-tex 上，这里用 MutationObserver
         等节点出现 —— 不依赖 wasm 侧的任何时序（挂载 / 路由切换都覆盖）。
         加载或渲染失败就保留 Unicode 回退文本，绝不把页面弄坏。 -->
    <script>
      (() => {
        let state = "idle"; // idle → loading → ready；失败停在 failed（保留回退文本，不重试）
        let queued = false;
        const PENDING = "[data-tex]:not(.katex-done)";
        const render = () => {
          document.querySelectorAll(PENDING).forEach((el) => {
            el.classList.add("katex-done");
            try {
              window.katex.render(el.getAttribute("data-tex"), el, {
                throwOnError: false,
                displayMode: false,
              });
            } catch {
              /* 保留回退文本 */
            }
          });
        };
        const load = () => {
          if (state !== "idle") return;
          state = "loading";
          const css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "/katex/katex.min.css";
          document.head.appendChild(css);
          const js = document.createElement("script");
          js.src = "/katex/katex.min.js";
          js.onload = () => {
            state = "ready";
            render();
          };
          js.onerror = () => {
            state = "failed";
          };
          document.head.appendChild(js);
        };
        const scan = () => {
          queued = false;
          if (!document.querySelector(PENDING)) return;
          if (state === "ready") render();
          else load();
        };
        // 观察者回调只登记一次 rAF：DOM 频繁变动的页面（波形 / 瀑布图）不会每次都扫描。
        const schedule = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(scan);
        };
        const start = () => {
          schedule();
          new MutationObserver(schedule).observe(document.body, {
            childList: true,
            subtree: true,
          });
        };
        // 内联脚本在 <head> 里同步执行，此时 body 还不存在，观察者要等 DOMContentLoaded。
        if (document.body) start();
        else document.addEventListener("DOMContentLoaded", start);
      })();
    </script>

    <!-- 致命错误兜底：wasm 加载失败或运行时 panic 时显示，不依赖 wasm 本身 -->
    <script>
      (() => {
        let shown = false;
        // 这里 wasm 还没加载（或已经崩了），不能走 i18n 词典，所以内联一份三语文案。语言选择与
        // 应用本身**严格一致**：只看用户保存的 `locale`（zh / en / es），没有就是中文 ——
        // 应用默认语言是中文、不看浏览器语言（`i18n::stored_locale`）。若这里改看 `navigator.language`，
        // 英文浏览器的用户在应用里看到中文，崩溃页却突然是英文。
        const TEXT = {
          zh: {
            desc: "本地数据（进度、错题、日志等）不受影响。可以重新加载页面；如果反复出现，建议先导出数据备份。",
            reload: "重新加载", backup: "导出数据备份", copy: "复制错误信息", copied: "已复制", details: "错误详情",
            loadFailed: "加载失败", unsupported: "浏览器不受支持",
            noWasm: "当前浏览器不支持 WebAssembly，请升级到最新版 Chrome / Edge / Safari / Firefox。",
            resource: "资源加载失败：",
          },
          en: {
            desc: "Your local data (progress, mistakes, logs, …) is not affected. Reload the page; if it keeps happening, export a data backup first.",
            reload: "Reload", backup: "Export data backup", copy: "Copy error info", copied: "Copied", details: "Error details",
            loadFailed: "Failed to load", unsupported: "Browser not supported",
            noWasm: "This browser does not support WebAssembly. Please upgrade to the latest Chrome / Edge / Safari / Firefox.",
            resource: "Resource failed to load: ",
          },
          es: {
            desc: "Tus datos locales (progreso, errores, registro, …) no se ven afectados. Recarga la página; si se repite, exporta antes una copia de seguridad.",
            reload: "Recargar", backup: "Exportar copia de seguridad", copy: "Copiar información del error", copied: "Copiado", details: "Detalles del error",
            loadFailed: "Error de carga", unsupported: "Navegador no compatible",
            noWasm: "Este navegador no admite WebAssembly. Actualiza a la última versión de Chrome / Edge / Safari / Firefox.",
            resource: "No se pudo cargar el recurso: ",
          },
        };
        const pickLang = () => {
          let saved = null;
          try { saved = localStorage.getItem("locale"); } catch {}
          return saved && TEXT[saved] ? saved : "zh";
        };
        const L = TEXT[pickLang()];
        const backup = () => {
          const map = {};
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              map[k] = localStorage.getItem(k);
            }
          } catch {}
          const d = new Date();
          const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([JSON.stringify(map)], { type: "application/json" }));
          a.download = `ham-backup-${stamp}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        };
        window.__hamFatal = (title, detail) => {
          if (shown) return;
          shown = true;
          document.getElementById("boot")?.remove();
          const box = document.createElement("div");
          box.id = "fatal";
          box.setAttribute("role", "alertdialog");
          box.setAttribute("aria-modal", "true");
          box.setAttribute("aria-labelledby", "fatal-title");
          box.setAttribute("aria-describedby", "fatal-desc");
          box.innerHTML = `
            <style>
              #fatal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: #f2e8cf; color: #1a1c2c; font: 14px/1.6 "Fusion Pixel", ui-monospace, "PingFang SC", "Microsoft YaHei", monospace; }
              .dark #fatal { background: #1a1c2c; color: #f4f4f4; }
              #fatal section { max-width: 440px; width: 100%; padding: 20px; background: #fff8e1; border: 4px solid #1a1c2c; box-shadow: 6px 6px 0 rgba(0, 0, 0, .35); }
              .dark #fatal section { background: #262b45; border-color: #94b0c2; }
              #fatal h1 { margin: 0 0 8px; font: 14px/1.5 "Press Start 2P", "Fusion Pixel", monospace; color: #b13e53; }
              .dark #fatal h1 { color: #ef7d57; }
              #fatal .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
              #fatal button { font: inherit; padding: 6px 14px; border: 2px solid #1a1c2c; background: #eadfc0; color: inherit; cursor: pointer; box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); }
              .dark #fatal button { border-color: #94b0c2; background: #333c57; }
              #fatal button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, .35); }
              #fatal button.primary { background: #3b5dc9; border-color: #1a1c2c; color: #f4f4f4; }
              #fatal button:focus-visible { outline: 2px dashed #3b5dc9; outline-offset: 2px; }
              .dark #fatal button:focus-visible { outline-color: #ffcd75; }
              #fatal pre { max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; padding: 8px; background: rgba(26, 28, 44, .12); border: 2px solid rgba(26, 28, 44, .3); }
            </style>
            <section>
              <h1 id="fatal-title"></h1>
              <p id="fatal-desc"></p>
              <div class="row">
                <button type="button" class="primary" data-act="reload"></button>
                <button type="button" data-act="backup"></button>
                <button type="button" data-act="copy"></button>
              </div>
              <details><summary></summary><pre></pre></details>
            </section>`;
          // 文案用 textContent 填：不把词典里的字符串拼进 innerHTML。
          box.querySelector("#fatal-desc").textContent = L.desc;
          box.querySelector('[data-act="reload"]').textContent = L.reload;
          box.querySelector('[data-act="backup"]').textContent = L.backup;
          box.querySelector('[data-act="copy"]').textContent = L.copy;
          box.querySelector("summary").textContent = L.details;
          box.querySelector("h1").textContent = title;
          box.querySelector("pre").textContent = `${detail}\n\n${location.href}\n${navigator.userAgent}`;
          box.addEventListener("click", (e) => {
            const act = e.target.closest("button")?.dataset.act;
            if (act === "reload") location.reload();
            if (act === "backup") backup();
            if (act === "copy") navigator.clipboard?.writeText(box.querySelector("pre").textContent).then(() => { e.target.textContent = L.copied; });
          });
          document.body.appendChild(box);
          box.querySelector("button")?.focus();
        };
        if (typeof WebAssembly !== "object") {
          addEventListener("DOMContentLoaded", () => window.__hamFatal(L.unsupported, L.noWasm));
          return;
        }
        const onBootError = (reason) => {
          if (document.getElementById("boot")) window.__hamFatal(L.loadFailed, String(reason?.stack ?? reason?.message ?? reason));
        };
        addEventListener("unhandledrejection", (e) => onBootError(e.reason));
        // 只关心本站资源：第三方脚本（如被广告拦截器拦下的广告）失败不影响使用
        const sameOrigin = (url) => { try { return new URL(url, location.href).origin === location.origin; } catch { return false; } };
        addEventListener("error", (e) => {
          const t = e.target;
          if (t instanceof HTMLScriptElement || t instanceof HTMLLinkElement) {
            const url = t.src || t.href;
            if (sameOrigin(url)) onBootError(`${L.resource}${url}`);
          } else if (e.error && sameOrigin(e.filename)) {
            onBootError(e.error);
          }
        }, true);
      })();
    </script>

    <!-- 首屏占位：wasm 下载 / 初始化期间显示，应用挂载后由 main.rs 移除 -->
    <div id="boot" role="status" aria-live="polite">
      <style>
        #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--background, #f2e8cf); color: var(--foreground, #1a1c2c); font: 14px/1.4 "Fusion Pixel", ui-monospace, "PingFang SC", "Microsoft YaHei", monospace; z-index: 50; }
        .dark #boot { color: var(--muted-foreground, #94b0c2); }
        #boot b { font: 14px/1.5 "Press Start 2P", "Fusion Pixel", monospace; color: var(--primary, #3b5dc9); letter-spacing: 0; text-shadow: 2px 2px 0 rgba(0, 0, 0, .3); }
        /* 读条：8 格，逐格点亮；steps() 让它是「读盘」而不是平滑进度 */
        #boot i { display: block; width: 160px; height: 16px; border: 4px solid var(--input, #1a1c2c); background: var(--pxl-field, #fffdf2); box-sizing: content-box; }
        #boot i::after { content: ""; display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--primary, #3b5dc9) 0 16px, transparent 16px 20px); animation: boot-fill 1.6s steps(8, end) infinite; }
        @keyframes boot-fill { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
        @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; } }
        html[data-pixel-motion="off"] #boot i::after { animation: none; }
      </style>
      <i aria-hidden="true"></i>
      <b>业余无线电</b>
      <span>正在加载题库与工具…</span>
    </div>
