[build]
target = "index.html"
dist = "../../dist"
public_url = "/"
filehash = true

[tools]
# Trunk 会自动下载对应版本的 Tailwind CSS 独立可执行文件（无需 Node.js）
tailwindcss = "4.1.14"
# wasm-opt（binaryen），release 构建时用于体积优化
wasm_opt = "version_123"

[watch]
# data/i18n 由 crates/app/build.rs 在构建期编成静态词典表，改译文也要触发重建。
#
# 这里只列**手写**资源（目录或单个文件），不整个监听 ../../public：该目录下还有构建期产物
# （sw.js / sitemap.xml / 九个 worker 的 *_worker.js 与 *_bg.wasm / 下载物字体），
# 监听它们会让 `dev` 在自己生成产物时反复自我触发重建。
# `public/data/i18n` 是 `cargo make i18n-pack` 的产物，但它由 trunk 之外的任务生成，
# 重新打包后要触发一次重建，所以也列在这里。
watch = [
  "src",
  "style",
  "index.html",
  "../core/src",
  "../../public/data/i18n",
  "../../public/decode-worker.js",
  "../../public/questions",
  "../../data/glossary",
  "../../data/i18n",
]

[serve]
addresses = ["127.0.0.1"]
port = 3000
open = false

# 开发联调：把 /api 请求代理到后端 server（端口 3001），供 /api/solar 同源访问
# backend URL 的路径部分（/api/）会作为 Trunk 监听的代理前缀，后续路径原样透传
[[proxy]]
backend = "http://localhost:3001/api/"
