[package]
name = "ham-web-server"
description = "业余无线电：静态站点服务器（SPA 回退、PWA 缓存头、压缩）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ham-web-core.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
regex.workspace = true
serde.workspace = true
# float_roundtrip：解析浮点数时不允许差 1 个 ULP。服务端要把「解析 → 存库 → 读回 → 序列化」后的文本
# 当作规范内容去算指纹，浮点数（难度系数、间隔天数、经纬度……）在这一圈里必须与前端写出的位数完全一致。
serde_json = { workspace = true, features = ["float_roundtrip"] }
sgp4.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true

# Web Push（RFC 8291 + VAPID，纯 Rust 实现，无系统 OpenSSL 依赖）
p256 = { version = "0.14", features = ["ecdsa", "ecdh"] }
hkdf = "0.13"
aes-gcm = "0.11"
base64 = "0.23"
rand = "0.10"
sha2 = "0.11"

# 在线账号（`/api/account/*`）：SQLite 存账户 / 会话 / 云端备份，Argon2id 存口令。
# `bundled` 把 SQLite 静态链进二进制：运行镜像是 distroless，没有系统 libsqlite3。
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = { version = "0.6", features = ["password-hash"] }

[lints]
workspace = true
