# 代码检查：格式 + clippy（原生 crate 与 wasm 前端）+ 单元测试，等价于本地 `cargo make check`。
name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: cargo make check
        run: cargo make check

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make, Trunk and wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen CLI 版本需与 Cargo.lock 中的 wasm-bindgen crate 一致：
          # 装错了不会报编译错误，只会在运行时让 APT Worker 的胶水代码与 wasm 不匹配。
          # 这里的版本号是硬编码的（install-action 不支持从文件读），下一步会校验它没漂移。
          tool: cargo-make,trunk,wasm-bindgen-cli@0.2.129

      - name: 校验 wasm-bindgen CLI 版本与 Cargo.lock 一致
        run: |
          lock=$(awk -F'"' '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{print $2; exit}' Cargo.lock)
          cli=$(wasm-bindgen --version | awk '{print $2}')
          echo "Cargo.lock=$lock CLI=$cli"
          if [ "$lock" != "$cli" ]; then
            echo "::error::wasm-bindgen CLI 版本漂移，请将 install-action 中的 wasm-bindgen-cli@$cli 改为 @$lock"
            exit 1
          fi

      - name: Build site and server
        run: |
          cargo make build-web
          cargo build -p ham-web-server --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
