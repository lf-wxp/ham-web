# 代码检查：格式 + clippy（原生 crate 与 wasm 前端）+ 单元测试，等价于本地 `cargo make check`。
#
# `data-sync.yml` 开的 PR（固定分支 `chore/data-sync`）只改数据产物——题库 CSV / JSON、`dxcc.txt`、
# Natural Earth 边界、`data/provenance/` 边车——所以 `docker` / `e2e` 对它跳过，省掉一轮镜像构建
# 与浏览器用例。
#
# 判据有两层，缺一不可（`scope` job 实现）：
#   1. 分支名是 `chore/data-sync` 且 head repo 是本仓库（fork 起个同名分支白蹭不到）；
#   2. `git diff` 确认本次 PR 的改动**全部**落在数据产物路径下。
# 只认分支名不够：本仓库的协作者也能建一个同名分支塞代码（甚至改本文件把门禁删掉），那样 PR 上
# 一个门禁都不跑。内容不符时按普通 PR 处理，全跑——门禁只允许往严格的方向失效。
#
# `check` job **不跳过**：`dxcc.txt` 是 `include_str!` 进 `ham-web-core` 的、被单测直接消费，
# 而 `regenerate` job 跑的 `data-sync-check` 只验来源戳与依赖摘要，验不出「数据写坏了、解析不出来」。
name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # 判断这次 PR 能不能跳过 docker / e2e。只在 PR 上跑；任何异常（fetch 失败、diff 出错、
  # 拿不到 base）都输出 skip=false，也就是「按普通 PR 全跑」。
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip_expensive: ${{ steps.diff.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 要算 `base...HEAD` 需要 merge-base，浅克隆拿不到。
          fetch-depth: 0

      - name: Decide whether this PR only touches data artifacts
        id: diff
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          skip=false
          if [ "$HEAD_REF" = "chore/data-sync" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            if git fetch --no-tags origin "$BASE_REF" && changed=$(git diff --name-only "origin/$BASE_REF...HEAD"); then
              # 白名单与 `cargo make data-sync`（dxcc / dxcc-map / cn-map / dataset）的产物一致；
              # 多出一个文件就不跳。精确文件名要带行尾锚点：否则 `public/cn-provinces.bin.js`、
              # `crates/core/data/dxcc.txt.bak` 这类「前缀相同」的路径也会被当成数据产物而绕过门禁。
              exact='^(crates/core/data/dxcc\.txt|public/dxcc-entities\.bin|public/cn-provinces\.bin)$'
              prefix='^(public/questions/|data/provenance/)'
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" |
                grep -qvE "$exact|$prefix"; then
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 工具链钉死，与 Dockerfile 的 `RUST_VERSION` 同一版本（升级时两处一起改）：
      # 这里跑 `clippy -D warnings`，浮动的 `stable` 在上游新增 lint 时会让 CI 在代码没动的
      # 情况下变红，同一个提交隔一周重跑结果还可能不同。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: cargo make check
        run: cargo make check

  # Dockerfile 平时只有 push 到 main 后的 build-docker.yml 才会用到：不在 PR 里构建一次，
  # 构建链路的改动（多阶段拷贝、产物断言、运行镜像缺 libc / 权限）只能等合并后才发现，
  # 而那时镜像是往上推的、没有「先看它能不能跑」的机会。
  docker:
    needs: scope
    # `scope` 被跳过（push / 手动触发）时 outputs 为空 → 照常跑；它自己失败时也照常跑，
    # 所以用 `!cancelled()` 而不是依赖默认的「上游失败即跳过」。理由见文件头。
    if: ${{ !cancelled() && needs.scope.outputs.skip_expensive != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ham-web:ci
          # 与 build-docker.yml 共用 gha 缓存：PR 只读主分支写下的层缓存，不再回写
          # （PR 的缓存不会进入主分支，写进去只占配额）。
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Smoke test image
        run: sh scripts/smoke-image.sh ham-web:ci

  e2e:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.skip_expensive != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 同上：与 Dockerfile 的 `RUST_VERSION` 保持一致。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make, Trunk and wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen CLI 版本需与 Cargo.lock 中的 wasm-bindgen crate 一致：
          # 装错了不会报编译错误，只会在运行时让解码 Worker 的胶水代码与 wasm 不匹配。
          # 这里的版本号是硬编码的（install-action 不支持从文件读），下一步会校验它没漂移。
          tool: cargo-make,trunk,wasm-bindgen-cli@0.2.129

      - name: 校验 wasm-bindgen CLI 版本与 Cargo.lock 一致
        run: |
          lock=$(awk -F'"' '/^name = "wasm-bindgen"$/{f=1; next} f && /^version = /{print $2; exit}' Cargo.lock)
          if [ -z "$lock" ]; then
            echo "::error::未能在 Cargo.lock 找到 wasm-bindgen 的版本（锁文件缺失或格式变化），请先在仓库根执行 cargo fetch"
            exit 1
          fi
          cli=$(wasm-bindgen --version | awk '{print $2}')
          echo "Cargo.lock=$lock CLI=$cli"
          if [ "$lock" != "$cli" ]; then
            echo "::error::wasm-bindgen CLI 版本漂移，请将 install-action 中的 wasm-bindgen-cli@$cli 改为 @$lock"
            exit 1
          fi

      - name: Build site and server
        run: |
          cargo make build-web
          cargo build -p ham-web-server --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      # 跨内核冒烟：默认不跑（firefox / webkit 的浏览器二进制要额外下载，且全套用例依赖
      # Web Serial / 假音频设备 / WebGL2）。手动触发 workflow 时跑一次，免得这份用例长期
      # 只有 chromium 一份结果。
      - name: Cross-browser smoke (Firefox / WebKit)
        if: github.event_name == 'workflow_dispatch'
        working-directory: e2e
        run: |
          npx playwright install --with-deps firefox webkit
          E2E_CROSS=1 npx playwright test --project=firefox --project=webkit

      # 覆盖率按三条口径统计：路由冒烟 / 交互 / 关键流程（详见 e2e/scripts/coverage.mjs）
      - name: E2E coverage report
        id: coverage
        # 覆盖率只扫描 spec 文件，与用例是否通过无关，失败时同样出报告便于对照
        if: always()
        working-directory: e2e
        run: |
          set +e
          E2E_MIN_JOURNEY=${{ vars.E2E_MIN_JOURNEY }} E2E_MIN_ROUTE=${{ vars.E2E_MIN_ROUTE }} \
            node scripts/coverage.mjs > /tmp/coverage.md
          code=$?
          cat /tmp/coverage.md
          {
            echo "## E2E 覆盖率"
            echo
            cat /tmp/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: |
            e2e/test-results/coverage.md
            e2e/test-results/coverage.json
          retention-days: 30

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
