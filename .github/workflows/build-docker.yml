# 在 GitHub Actions（磁盘充足的 CI 环境）上构建 Docker 镜像并推送到 Docker Hub，
# 远端小磁盘机器只需 `docker pull` + `docker run`，不参与编译。
name: Build and push Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 规范化用户名：转小写、去除空白，避免大小写/空格导致非法镜像名
      - name: Normalize Docker Hub username
        id: norm
        shell: bash
        run: |
          user=$(printf '%s' "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "user=${user}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.norm.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.norm.outputs.user }}/ham-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          # 用 GitHub Actions Cache 做 BuildKit 缓存（不占 runner 本地磁盘，也避免远端机器磁盘被写满）
          cache-from: type=gha
          cache-to: type=gha,mode=max
